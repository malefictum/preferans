<script>
/* ============================================================
   ОДЕССКИЙ ПРЕФЕРАНС — ядро
   Карты, старшинство, лестница заявок, цена игр и конвенции.
   Ничего, что зависит от хода партии: только константы и
   маленькие чистые функции над ними.
   ============================================================ */
var K = (function () {
  'use strict';

  /* Масти в порядке торговли: пики младше всех, черви старше,
     бескозырка над ними. Этот порядок — не украшение, на нём
     стоит вся лестница заявок. */
  var SUITS = ['S', 'C', 'D', 'H'];
  var SUIT_NAME = { S: 'пики', C: 'трефы', D: 'бубны', H: 'червы' };
  var SUIT_ONE = { S: 'пик', C: 'треф', D: 'бубён', H: 'червей' };
  var SUIT_CH = { S: '♠', C: '♣', D: '♦', H: '♥' };
  var SUIT_RED = { S: 0, C: 0, D: 1, H: 1 };

  // 32 карты: семёрка младшая, туз старший
  var RANKS = ['7', '8', '9', '10', 'J', 'Q', 'K', 'A'];
  var RANK_RU = { '7': '7', '8': '8', '9': '9', '10': '10', J: 'В', Q: 'Д', K: 'К', A: 'Т' };
  var RANK_WORD = { '7': 'семёрка', '8': 'восьмёрка', '9': 'девятка', '10': 'десятка',
    J: 'валет', Q: 'дама', K: 'король', A: 'туз' };

  function id(c) { return c.r + c.s; }
  function parse(t) { return { r: t.slice(0, -1), s: t.slice(-1) }; }
  function ord(c) { return RANKS.indexOf(c.r); }          // старшинство внутри масти
  function same(a, b) { return a.r === b.r && a.s === b.s; }
  function label(c) { return RANK_RU[c.r] + SUIT_CH[c.s]; }
  // то же самое, но под именем, которое ждёт художка: она общая на все наши игры
  function name(c) { return RANK_RU[c.r] + SUIT_CH[c.s]; }
  function isRed(c) { return !!SUIT_RED[c.s]; }
  // словами — для журнала и для озвучки: «туз пик», а не «ТП»
  function word(c) { return RANK_WORD[c.r] + ' ' + SUIT_ONE[c.s]; }

  function deck() {
    var l = [], i, j;
    for (i = 0; i < SUITS.length; i++)
      for (j = 0; j < RANKS.length; j++) l.push({ r: RANKS[j], s: SUITS[i] });
    return l;
  }

  /* ---------- лестница заявок ----------
     6♠ 6♣ 6♦ 6♥ 6БК · 7… · мизер · 8… · 9… · 10…
     Мизер стоит между семерной и восьмерной — так играют везде,
     и это единственное место, где лестница не арифметическая. */
  var BIDS = (function () {
    var l = [], n, i;
    function push(tricks, suit, word) {
      l.push({ n: l.length, tricks: tricks, suit: suit, word: word });
    }
    for (n = 6; n <= 10; n++) {
      if (n === 8) push(0, null, 'мизер');                // мизер перед восьмерными
      for (i = 0; i < SUITS.length; i++)
        push(n, SUITS[i], n + ' ' + SUIT_ONE[SUITS[i]]);
      push(n, 'NT', n + ' без козыря');
    }
    return l;
  })();
  var MISER = BIDS.filter(function (b) { return b.suit === null; })[0].n;

  function bid(n) { return BIDS[n] || null; }
  function bidWord(n) { return n == null ? 'пас' : BIDS[n].word; }
  function bidShort(n) {
    if (n == null) return 'пас';
    var b = BIDS[n];
    if (b.suit === null) return 'мизер';
    return b.tricks + (b.suit === 'NT' ? 'БК' : SUIT_CH[b.suit]);
  }
  function isMiser(n) { return n != null && BIDS[n].suit === null; }
  function trumpOf(n) {
    if (n == null) return null;
    var s = BIDS[n].suit;
    return (s === null || s === 'NT') ? null : s;
  }
  function tricksOf(n) { return n == null ? 0 : BIDS[n].tricks; }

  /* ---------- цена игры ----------
     6→2, 7→4, 8→6, 9→8, 10→10, мизер→10.
     Сыграл — цена в пулю. Подсел — цена × недобор в гору.
     Вистующий пишет цену × свои взятки. */
  function price(n) {
    if (n == null) return 0;
    if (isMiser(n)) return 10;
    return (tricksOf(n) - 5) * 2;
  }

  // старшинство карты внутри взятки: козырь всегда бьёт простую
  function beats(c, best, lead, trump) {
    if (trump && c.s === trump) return best.s !== trump || ord(c) > ord(best);
    if (best.s === trump && trump) return false;
    if (c.s !== lead) return false;
    return best.s !== lead ? true : ord(c) > ord(best);
  }

  /* ---------- конвенции ----------
     Это наборы значений тумблеров, а не отдельные ветки кода.
     Любой тумблер меняется отдельно — конвенция лишь задаёт
     начальные значения. */
  /* Сколько взяток положено ПАРЕ вистующих. Не «десять минус заказ»:
     на семерной и выше защите прощают, иначе вист становится
     самоубийством. Норма общая — взяли 3 и 1 вместо 2 и 2, и оба чисты. */
  var WHIST_QUOTA = { 6: 4, 7: 2, 8: 1, 9: 1, 10: 1 };

  var CONV = {
    finka: {
      name: 'Одесская финка',
      note: 'жёсткий вист, тяжёлые распасы, тёмная игра',
      whistQuota: WHIST_QUOTA,
      secondWhistBlame: 8,    // с восьмерной за недобор отвечает второй вист
      whistResp: true,        // ответственный вист: не добрал — полный штраф
      whistPart: 1,           // и штраф полный, а не половина
      vistMul: 1,             // вистовая взятка стоит цену игры
      sadMul: 1,              // и гора за подсад тоже
      passClean: 0,           // за чистый распас не пишут
      gentleWhist: true,      // при вист-пас висты пополам на двоих
      halfWhist: false,       // полвиста нет
      mustWhist6S: true,      // на 6♠ вистовать обязаны
      passProg: [1, 2, 3],    // цена распаса: 1, 2, 3 и дальше не растёт
      /* Прикуп на распасах ОТКРЫВАЕТСЯ и диктует масть хода.

         Правило переезжало дважды, и вот чем кончилось. Сперва стояло
         `true` по аналогии с сочинкой — это была наша догадка. Потом Ник
         поправил: «в Сочинке он вскрывается и разыгрывается, а в
         Ленинградке и Одесской финке не показывается вовсе», и стало
         `false`. А увидев закрытый прикуп на живой сдаче, он спросил
         сам: «а в распасах не открывается прикупная карта, чтобы
         объявить ход в нужную масть? всегда ж так было».

         Так и есть: в общих правилах преферанса прикуп на распасах
         открывается по одной карте и НАЗНАЧАЕТ МАСТЬ ХОДА, а взятку
         берёт тот, кто положил старшую карту своей масти. Закрытый
         прикуп — примета РОСТОВСКОЙ школы («не открывается и остаётся
         неизвестным до конца розыгрыша»), и в финку он, похоже, и
         приехал оттуда вместе с остальным. В Ростове так и осталось. */
      passWidow: true,
      passExit: 7,            // прервать серию можно не меньше семерной
      dark: true,             // тёмная игра, цена ×2
      /* ---------- игра без прикупа ----------
         Одесская вольность: выиграв торговлю, можно отказаться от
         прикупа и сыграть с руки. Прикуп не вскрывается, сноса нет,
         играешь теми же десятью картами — и цена за это вдвое, и в
         пулю, и в гору. Мизер с руки в Одессе ценят выше девятерной,
         а девятерная без прикупа — классическое оружие против чужого
         мизера. Ник: «просто на выбор диалоговые окна». */
      noWidowMiser: true,     // мизер можно сыграть с руки
      noWidowNine: true,      // и девятерную тоже
      noWidowMul: 2,          // без прикупа цена вдвое
      /* Десятерная не вистуется, а ПРОВЕРЯЕТСЯ: соперники только пасуют,
         играющий обязан показать взятки. Ник: «на десятерной вистовать
         нельзя, соперники могут только записать пас». */
      tenChecked: true
    },
    sochi: {
      name: 'Сочинка',
      note: 'математическая и спокойная',
      whistQuota: WHIST_QUOTA,
      secondWhistBlame: 8,
      /* Сочинка ОТВЕТСТВЕННАЯ и ЖЛОБСКАЯ одновременно — «ответственный
         (жлобский) вист» в обзорах пишут одним словом через скобку, и
         именно поэтому его все путают. Это две разные оси: за недобор
         платишь полную стоимость игры, а висты за взятки с напарником не
         делишь. Стояло `whistResp: false` — то есть за недобор не платит
         никто; такого в правилах сочинки нет нигде. */
      whistResp: true,
      whistPart: 1,
      vistMul: 1,             // всё по одной цене — «ровная» школа
      sadMul: 1,
      passClean: 1,           // чистый распас: взял ноль — пишешь в пулю цену взятки
      gentleWhist: false,     // жлобский: за взятки каждый сам, консоляцию пишут оба
      halfWhist: true,
      mustWhist6S: false,
      passProg: [1, 2, 3],
      passWidow: true,
      passExit: 6,
      passExitRow: [6, 7, 8], // выход лестницей: после вторых нужна семерная
      dark: false,
      tenChecked: false
    },
    leningrad: {
      name: 'Ленинградка',
      note: 'строгая, распасы без прикупа',
      whistQuota: WHIST_QUOTA,
      secondWhistBlame: 8,
      whistResp: true,
      /* Полуответственный вист: за недобор пишется ПОЛОВИНА стоимости
         игры. Это записано и в справочнике, и у preferans.games. */
      whistPart: 0.5,
      /* И вот в чём весь характер школы: пуля по обычной цене, а висты и
         гора ВДВОЕ. 6 — вист 4, гора 4; 10 — вист 20, гора 20; мизер 20
         за взятку. Ленинградку зовут «игрой вистующего»: заказывать
         дорого, вистовать выгодно. Стояла копия финки без тёмной — то
         есть ровно то, чем ленинградка не является. */
      vistMul: 2,
      sadMul: 2,
      passClean: 1,
      gentleWhist: true,
      halfWhist: false,
      mustWhist6S: false,
      passProg: [2, 4, 6],    // распасы 2-4-6 с потолком, а не плоские
      passWidow: true,        // прикуп открывается и диктует масть хода
      passExit: 7,
      passExitRow: [7, 8, 8], // после первых семерная, после вторых восьмерная
      dark: false,
      tenChecked: true        // десятерная проверяется (соло)
    },

    /* ---------- Ростов ----------

       Ирония в том, что одесский преферанс — это и есть ростовский:
       одна математическая модель, которую на юге Украины зовут одесской,
       а на юге России ростовской. Финка в этом проекте — одесская ветка
       той же игры, с горой на распасах, сталинградом по умолчанию и
       тёмной. Здесь — классический Ростов, от которого она отпочковалась.

       Главное отличие — РАСПАСЫ. В Ростове они считаются не горой, а
       вистами: кто взял меньше всех, тот распасы ВЫИГРАЛ и пишет на
       каждого соперника по пять вистов за каждую взятую тем взятку. В
       гору не идёт ничего. Отсюда и остальное: прогрессии нет, «выхода
       из распасов» как понятия не существует, серия не копится.

       Одесса поверх этого добавила гору (взяла у ленинградки), сделала
       сталинград законом двора и вернула тёмную. Финка агрессивнее
       ровно на эти три вещи. */
    rostov: {
      name: 'Ростов',
      note: 'распасы вистами, а не горой; вист полуответственный',
      whistQuota: WHIST_QUOTA,
      secondWhistBlame: 8,
      whistResp: true,
      whistPart: 0.5,         // полуответственный: недобор на висте — половина
      vistMul: 1,
      sadMul: 1,
      gentleWhist: true,      // «вист, как правило, джентльменский»
      halfWhist: false,
      mustWhist6S: false,     // сталинград тут договорная опция, не закон
      passMode: 'vists',      // распасы пишутся вистами на соперников
      passVist: 5,            // по пять за каждую взятку
      passProg: [1],          // прогрессии нет — в гору всё равно ничего
      passClean: 1,           // ноль взяток — очко
      passCleanGora: true,    // сначала списывается с горы, и лишь потом в пулю
      passWidow: false,       // «прикуп не открывается и остаётся неизвестным»
      passExit: 6,            // «можно заказывать любую игру, начиная с шестерной»
      dark: false,
      tenChecked: true        // десятерная только проверяется, вистовать нельзя
    }
  };

  /* ---------- ведомость «разбойника» ----------
     Заказной преферанс убирает из игры случайность: на дистанции все
     играют ОДИН И ТОТ ЖЕ набор игр. У каждого перед глазами карточка с
     пустыми графами, и каждую сдачу тот, чья очередь, обязан вписать
     её в одну из своих пустых граф.

     Вся тактика — в управлении карточкой: пришла хорошая карта —
     закрываешь дорогую графу, пришёл мусор — закрываешь распас или
     сознательно садишься на шестерной, чтобы утилизировать расклад.

     Графы: число — контрактная игра этой высоты (масть выбирает сам),

    'Преподавала французский в университете. На Привозе не спорила — объясняла.',
    'Держала будку с газводой на Соборке. Двойной сироп — только своим.',
    'Дворник с Комитетской. Метлу ставил так, что двор боялся сорить.',
    'Электрик в ЖЭКе. Чинил всё, кроме собственной проводки.',
    'Всю жизнь в зеленной лавке. Помидор выбирала на ощупь и не ошибалась.',
    'Шофёр на хлебовозке. К шести утра знал весь город, и город знал его.',
    'Настройщик в музыкальной школе. Слышал фальшь через две стены.',
    'Работала в столовой пароходства. Добавку давала тем, кто здоровался.',
    'Плотник в порту. Сорок лет чинил чужие сходни.',
    'Убирала в школе. Знала каждого второгодника по походке.',
    'Играл в клабор в Дюковском саду. Проигрывал редко и всегда с достоинством.',
    'Вязала на заказ. По её кофтам можно изучать историю двора.',
    'Массовик в санатории на Фонтане. Веселил даже отдыхающих из Москвы.',
    'Сидела в справочном на вокзале. Отвечала быстрее, чем спрашивали.',
    'Слесарь на «Продмаше». Дома чинил всё, кроме того, о чём просила жена.',
    'Билетёрша в кинотеатре «Родина». Знала все фильмы по звуку.',
    'Играл на пляже в очко. С пляжа гоняли, он возвращался.',
    'Пекла хлеб в пекарне на Слободке. Корку отдавала детям — так заведено.',
    'Раздавала карты в летнем кафе на Ланжероне. И советы раздавала, тоже метко.',
    'Администратор в «Красной». Не пускала так, что человек ещё и благодарил.',
    'Рыбный ряд на Привозе, двадцать лет. Голос ставили не в консерватории.',
    'Работала в горисполкоме. Чем именно — не рассказывала даже мужу.',
    'Выросла в проходном дворе. Знала все проходы и половину чужих секретов.',
    'Костюмер в Оперном. Каждую примадонну одевала и каждой сочувствовала.',
    'Соседка со второго этажа. Знала новости раньше, чем они происходили.',
    'Играла в музкомедии. Вторые роли, зато сорок лет подряд.',
    'Гадала на картах на Староконном. Говорила: карты не врут, врут люди.',
    'Фруктовый ряд на Новом базаре. Яблоко выбирала как жениха, придирчиво.',
    'Приехала из Бендер, осталась навсегда. Торговала специями, о прошлом молчала.',
    'Сорок лет в детском саду на Отраде. Через её руки полМолдаванки прошло.',
    'Парикмахер на Дерибасовской. Стригла по фотографии, выходило лучше.',
    'Работала на пивзаводе. Пиво не пила — говорила, на работе насмотрелась.',
    'Держала комиссионку. Вещь оценивала взглядом, человека — тоже.',
    'Продавала билеты в филармонии. Лучшие места держала для тех, кто слушает.',
    'Работала в Доме моделей на Пушкинской. Носила то, что все увидят через год.',
    'Стюардесса на линии Одесса — Москва. Привозила дефицит и сплетни.',
    'Диктор областного радио. Голос знали все, лицо не знал никто.',
    'Администратор в «Аркадии». Ресторан держался на её улыбке и её памяти.',
    'Секретарь в пароходстве. Через её стол шли все, кто собрался в загранрейс.',
    'Товаровед в универмаге. Слово «выбросили» знала раньше очереди.',
    'Гид в «Интуристе». Показывала Потёмкинскую по десять раз на дню.',
    'Инженер в проектном институте. Чертила мосты, а мечтала о Париже.',
    'Экскурсовод в катакомбах. Темноты не боялась, боялась опозданий.',
    'Заведовала отделом в «Пассаже». Порядок железный, помада алая.',
    'Регистрировала рейсы в аэропорту. Лишний килограмм прощала не всем.',
    'Костюмер на киностудии. Одесское кино семидесятых одето её руками.',
    'Преподавала в кулинарном училище. Тесто по науке, соль по наитию.',
    'Кассир в «Украине». Помнила, кто на какой ряд ходит уже десять лет.',
    'Работала в бюро путешествий. Отправила пол-Одессы на Кавказ, сама не ездила.',
    'Мастер в салоне на Ришельевской. Причёску делала под характер, не под моду.',
    'Проводница на поезде Одесса — Киев. Чай у неё был крепче, чем у всех.',
    'Художница в оформительском цехе. Все вывески на Ришельевской — её рука.',
    'Работала в театральной кассе. Бронь держала для тех, кто помнил её имя.',
    'Играла в оркестре филармонии. Скрипку возила в трамвае, как ребёнка.',
    'Приехала из села на «Красную звезду». Осталась и прижилась.',
    'Расписывала афиши для Оперного. Работала ночами, спала днём.',
    'Училась на филфаке, стояла в Доме книги. Читала быстрее, чем продавала.',
    'Пела в ресторане на Фонтане. Репертуар весь, любимая песня одна.',
    'Работала на телеграфе. Читала чужие радости и беды по три сотни в день.',
    'Танцевала в ансамбле Дома учёных. Туфли берегла больше, чем платья.',
    'Приехала из Аккермана торговать зеленью. Пустила корни, как её петрушка.',
    'Держала прилавок с бельём на Староконном. Торговалась с азартом, по-доброму.',
    'Работала в нотариальной конторе. Чужие наследства знала лучше своих дел.',
    'Гардеробщица в театре. Помнила, кому какое пальто, с одного взгляда.',
    'Пела в хоре Дома культуры. Голос вела ровно, соседей не жалела.',
    'Закройщица в ателье. Смеялась так, что мерки снимали дважды.',
    'Чинила сети на Лузановке. Узел вязала за секунду, разговор на час.',
    'Рыбный ряд на Привозе. Взвешивала честно, сдачу давала с присказкой.',
    'Стояла с семечками у Привоза. Кулёк крутила из газеты, всегда с верхом.',
    'Молочный ряд. Сметану пробовать давала всем, покупать — не всем.',
    'Ходила в море с мужем на шаланде. Море знала не хуже него.',
    'Солила огурцы на весь квартал. Рецепт не сказала даже дочери.',
    'Цветочный угол у Оперного. Гвоздики держала для тех, кто идёт на свидание.',
    'Стояла на Привозе сорок лет. Безмен держала так, что спорить не хотелось.',
    'Пекла пирожки с ливером у вокзала. Очередь была всегда, реклама не нужна.',
    'Ходила на Привоз каждое утро с авоськой. Знала, у кого что свежее.',
    'Помидорный ряд. Говорила: помидор выбирают носом, а не глазами.',
    'Торговала арбузами с Херсонщины. Стучала по арбузу, как доктор по спине.',
    'Приехала из Овидиополя торговать брынзой. Осталась, прижилась, обжилась.',
    'Держала зеленной ряд. Укроп у неё был отдельной гордостью.',
    'Продавала бычков на Пересыпи. Бычок у неё был к пиву и к разговору.',
    'Ягодный ряд в июне. Черешню давала пробовать, вишню — под честное слово.',
    'Биндюжник с Молдаванки. Лошадь звал по имени, людей — по прозвищу.',
    'Боцман дальнего плавания. Прошёл три океана, а швартовался у Привоза.',
    'Судовой механик. Машину слышал как врач сердце, руки не отмывались.',
    'Крючник в порту. Мешок на спине носил, как другие пиджак.',
    'Ходил в загранку. Привозил джинсы, жвачку и слухи, что там всё не так.',
    'Крановщик в порту. Полжизни провёл выше всех и молчал об этом.',
    'Рыбак с Лузановки. Бычков ловил столько, что кот отказывался.',
    'Катал на лодке у Ланжерона. Про каждую волну имел отдельное мнение.',
    'Франт с Молдаванки. Тройка, кепка, перстень и никакой определённой работы.',
    'Стоял на шухере у Мясоедовской. Семечки лузгал профессионально.',
    'Крутил напёрстки у вокзала. Всегда выигрывал и всегда удивлялся.',
    'Тот самый катала. Карты держал так, что их не видел даже он сам.',
    'Фарцевал у «Интуриста». Часы на обеих руках — не от жадности, для витрины.',
    'Маркёр в бильярдной. Шары считал вслух, долги про себя.',
    'Скупал золото на Пале-Рояле. Лупу носил в кармане, как другие расчёску.',
    'Старый король двора. Все споры кончались тем, что шли к нему.',
    'Сапожник в будке на Тираспольской. Гвозди во рту, правда на языке.',
    'Часовщик на Ришельевской. Чинил всё, кроме времени.',
    'Жестянщик с Пересыпи. Вёдра его переживали хозяев.',
    'Стекольщик. Ходил по дворам и кричал так, что стёкла дрожали сами.',
    'Точильщик ножей. Станок на ремне, искры на весь двор.',
    'Шарманщик с попугаем. Билетик со счастьем стоил копейку.',
    'Брил на Молдаванке. Под бритвой узнавал больше, чем участковый.',
    'Мясник на Привозе. Кость давал в довесок и никогда не забывал лицо.',
    'Стоял в пивном ларьке на Соборке. Пену снимал только знакомым.',
    'Жарил шашлык в Аркадии. Дым его чувствовали от самого моря.',
    'Торговал семечками у кино. Стакан мерил на глаз, но честно.',
    'Ходил по дворам: «Шурум-бурум!» Из чужого хлама делал чужое счастье.',
    'Бондарь и винодел. Бочки ладил сам, вино наливал только проверенным.',
    'Шил кепки на Мясоедовской. Восьмиклинка от него была как документ.',
    'Ювелир под зелёной лампой. Работал тихо, жил ещё тише.',
    'Банщик на Островидова. Веник у него был инструментом и лекарством.',
    'Одесский адвокат. В суде говорил тихо, а слышали до последнего ряда.',
    'Профессор мединститута. Диагноз ставил в коридоре, лечил по-человечески.',
    'Аптекарь на Пушкинской. Знал, кому таблетку, а кому просто поговорить.',
    'Участковый на Молдаванке. Знал всех, и все знали, когда его лучше не видеть.',
    'Водил восемнадцатый трамвай. Остановки объявлял с интонацией конферансье.',
    'Таксист на «Волге». Дорогу знал, а короткую — только для своих.',
    'Пожарный с Дерибасовской. Тушил всё, кроме дворовых скандалов.',
    'Дворник с бляхой. Двор мёл так, что соседи вытирали ноги на улице.',
    'Клезмер с кларнетом. Играл на всех свадьбах и на всех похоронах.',
    'Тапёр с аккордеоном. Папироса в углу рта не гасла даже на вальсе.',
    'Дирижировал духовым оркестром в горсаду. По воскресеньям парк был его.',
    'Конферансье в летнем театре. Куплеты сочинял в трамвае по дороге.',
    'Кондуктор в трамвае. Безбилетника чувствовала спиной.',
    'Библиотекарь на Троицкой. Книгу давала не всякому, и была права.',
    'Учила музыке на дому. Гаммы слушал весь подъезд, деваться было некуда.',
    'Буфетчица в филармонии. В антракте успевала всех и всё.',
    'Забивал козла до последнего света. «Рыба!» кричал так, что просыпался двор.',
    'Фронтовик. Ордена доставал раз в год, истории — по праздникам и по просьбе.',
    'Играл в нарды у гаражей. Кубики тряс так, будто с ними договаривался.',
    'Тот самый старик с веером карт. В клабор играет с сорокового года.',
    'Дворовый гроссмейстер с Соборки. Обыгрывал всех, кроме одного соседа.',
    'Массовик на пляже в Аркадии. Рупор и панама — всё, что нужно для веселья.',
    'Спасатель на Ланжероне. Свисток за сезон стирался до блеска.',
    'Мороженщик с тележкой. Вафельный стаканчик за девятнадцать копеек.',
    'Дачник с Фонтана. Абрикосы в авоське, разговор на всю дорогу.',
    'Курортник из Москвы. Нос в цинке, фотоаппарат наперевес, счастье полное.',
    'Болел за «Черноморец» с трибуны и с балкона. Голос садился к осени.',
    'Голубятник с Пересыпи. Голубей знал по именам, соседей по жалобам.',
    'Ходила по пляжу с ведром кукурузы. «Горячая, сладкая!» — и ведь правда.',
    'Соседка с балкона. Двор просматривала лучше, чем участковый.',
    'Хозяйка двора. Половник в руке был знаком власти, и все это понимали.',
    'Бабушка с котом. Кот сидит на её коленях с семьдесят третьего года.',
    'Капельдинер в Оперном. Ливрею носил как мундир, и по делу.',
    'Гардеробщица в театре. Номерки раздавала веером, глядя поверх очков.',
    'Пела в Оперном. Меха носила и летом — для образа.',
    'Танцевала в театре. Станок помнил её лучше, чем зеркало.',
    'Клоун в Одесском цирке. Грим смешной, глаза грустные, как положено.',
    'Укротитель. Блёстки на кителе, хлыст в руке, усы для солидности.',
    'Воздушная акробатка. Канифоль на ладонях не смывалась годами.',
    'Шпрехшталмейстер. Голос поставленный, фрак единственный.',
    'Настройщик роялей. Ухом слышал то, чего не слышал никто.',
    'Рисовал на Приморском. Портрет за десять минут, сходство на всю жизнь.',
    'Оператор Одесской киностудии. Камеру таскал на плече, как ребёнка.',
    'Актёр Русского театра. Грим, парик, папироса и полная готовность.',
    'Поэт в кашне. Печатался редко, читал везде и всем.',
    'Суфлёр. Полспектакля из будки, и ни одного провала.',
    'Костюмер. Булавки во рту, сантиметр на шее, порядок в голове.',
    'Гримёр. Из любого делала героя за двадцать минут.',
    'Штурман. Секстан к глазу — и уже знал, где мы и когда будем.',
    'Радист. Морзянку слышал во сне и во сне же отвечал.',
    'Судовой врач. Халат поверх кителя, спокойствие поверх всего.',
    'Водолаз. Медный шлем носил под мышкой, как шляпу.',
    'Океанолог. Батометр, планшет и вечное «ещё одну станцию».',
    'Ихтиолог. Рыбу в банке со спиртом знал по имени и по-латыни.',
    'Метеоролог. Шар-зонд отпускал каждое утро и каждый раз смотрел вслед.',
    'Маячник. Фонарь держал в порядке, ветер держал в бороде.',
    'Лоцман порта. Заводил суда так, что капитаны не спорили.',
    'Таможенник в порту. Печать ставил медленно, смотрел быстро.',
    'Машинист. Копоть не отмывалась, гудок узнавала вся Пересыпь.',
    'Курсант мореходки. Форменка отглажена, море ещё впереди.',
    'Диспетчер на вокзале. Рупор и китель, и поезда по расписанию.',
    'Стюардесса «Аэрофлота». Пилотка набок, улыбка на публику.',
    'Крановщица в порту. Каска, рукавицы и вид сверху на весь город.',
    'Телефонистка на коммутаторе. Соединяла город, слышала полгорода.',
    'Шеф-повар в «Красной». Колпак крахмальный, характер тоже.',
    'Кондитер. «Птичье молоко» делала так, что очередь стояла с ночи.',
    'Пекарь. Лопата с хлебами, мука по локоть, запах на весь квартал.',
    'Официант в «Красной». Полотенце через руку, память на лица безотказная.',
    'Буфетчик вагона-ресторана. Чай в подстаканнике, нарукавники, спокойствие.',
    'Стояла у автомата с газводой. Двойной сироп по знакомству.',
    'Молочница с бидоном. Разносила по дворам до семи утра.',
    'Делала брынзу. Головку держала в руках, как хрусталь.',
    'Виноградарь с Шабо. Секатор, корзина и вино для своих.',
    'Гнал самогон в сарае. Змеевик прятал, а запах спрятать не умел.',
    'Тамада на свадьбах. Рог поднимал так, что плакали и трезвые.',
    'Свадебная бабушка. Курицу несла под мышкой, а порядок — в голове.',
    'Держала стол на всю улицу. Форшмак её помнят до сих пор.',
    'Торговала бубликами у вокзала. Связки на руке, голос на весь перрон.',
    'Коптил бычков на Пересыпи. Дым выдавал его за три квартала.',
    'Мыла посуду в столовой. Тарелок за смену больше, чем людей в квартале.',
    'Учила младшие классы. Указка была нужна для карты, а не для дела.',
    'Завуч. Очки на цепочке и папка, от которой дрожала вся школа.',
    'Пионервожатая. Горн трубил так, что лагерь вставал раньше побудки.',
    'Физрук. Свисток на шее, а спортзал держал одним взглядом.',
    'Школьный сторож. Колокольчик, тулуп и полное знание всех прогульщиков.',
    'Тренер по боксу. Нос сломан дважды, характер ни разу.',

  /* ---------- вист ---------- */
  Game.prototype.startWhist = function () {
    this.whisters = this.seats.filter(function (q) { return q !== this.declarer; }, this);
    this.wi = 0;
    return this.askWhist();
  };
  /* Сколько взяток берёт вистующий, когда уходит «за свои». Это не
     норма пары, а его личная доля без розыгрыша. */
  var AWAY = { 6: 2, 7: 2, 8: 1 };

  Game.prototype.askWhist = function () {
    /* Десятерная не вистуется, а ПРОВЕРЯЕТСЯ: соперники могут только
       пасовать, играющий обязан показать, что взятки у него есть.
       Поэтому торговлю вистом пропускаем целиком, но сдачу РАЗЫГРЫВАЕМ —
       иначе «проверяется» превращается в «записывается на слово». Висты
       при этом не пишет никто. */
    if (this.o.tenChecked && !K.isMiser(this.contract) && K.tricksOf(this.contract) === 10) {
      this.checked = true;
      for (var k = 0; k < this.whisters.length; k++) this.whist[this.whisters[k]] = 'P';
      this.push({ e: 'checked', p: this.declarer });
      this.say('Десятерная проверяется: вистовать нельзя, ' +
        this.names[this.declarer] + ' обязан показать взятки.', 'big');
      return this.startPlay(this.seats[0]);
    }
    if (this.wi >= this.whisters.length) return this.afterWhist();
    var p = this.whisters[this.wi];
    /* Обязательный вист на 6♠: в финке защита обязана играть, иначе
       играющий пишет пулю даром. Тогда «пас» просто не предлагается. */
    var forced = this.o.mustWhist6S && this.contract === 0;
    this.pending = { type: 'whist', p: p, half: !!this.o.halfWhist, forced: forced };
    return this;
  };
  Game.prototype.doWhist = function (a) {
    var p = this.pending.p, v = a.whist;
    if (this.pending.forced && v === 'P') v = 'W';
    if (v !== 'W' && v !== 'P' && v !== 'H') v = 'P';
    if (v === 'H' && !this.o.halfWhist) v = 'W';
    this.whist[p] = v;
    this.push({ e: 'whist', p: p, whist: v });
    this.say(this.names[p] + ': ' + (v === 'W' ? 'вистую' : v === 'H' ? 'полвиста' : 'пас') + '.', 'hi');
    this.wi++;
    return this.askWhist();
  };
  Game.prototype.afterWhist = function () {
    var w = this.whisters.filter(function (q) { return this.whist[q] === 'W' || this.whist[q] === 'H'; }, this);

    /* Оба спасовали — игра невистованная: играющий пишет положенное без
       розыгрыша. Разыгрывать и доказывать надо только мизер. */
    if (!w.length && !K.isMiser(this.contract)) {
      this.push({ e: 'unwhisted', p: this.declarer });
      this.say('Никто не вистует — ' + this.names[this.declarer] + ' записывает без розыгрыша.', 'sys');
      return this.score({ unwhisted: true });
    }

    /* ---------- мизер: защита открывается ВСЕГДА ----------

       Ник: «никакого диалога нет, вист-пас — они ВСЕГДА открываются».
       Так мизер и ловят: карты защиты ложатся на стол лицом вверх, оба
       видят руки друг друга и вместе считают, чем всучить взятку. Спрашивать
       тут нечего — ни при двух вистующих, ни при вист-пасе, ни даже когда
       вистовать никто не сказал. */
    if (K.isMiser(this.contract) && !this.pass) {
      this.light = true;
      this.lightBy = (w.length === 1 && this.whisters.length > 1) ? w[0] : -1;
      this.open = this.whisters.slice();
      this.push({ e: 'light', by: this.lightBy, open: this.open.slice(), on: true,
        pair: this.lightBy < 0, forced: true });
      this.say('Мизер ловят в открытую: карты защиты на стол.' +
        (this.lightBy >= 0 ? ' ' + this.names[this.lightBy] + ' ведёт обе руки.' : ''), 'big');
      return this.startPlay(this.seats[0]);
    }

    /* ---------- вистует один: слово за ним ----------

       Напарник спасовал, и теперь вистующий решает, КАК играть:

         в светлую — пасовавший кладёт карты на стол, вистующий ведёт
           обе руки, и взятки считаются по сумме. Но карты видит и
           играющий: он тоже будет знать весь расклад защиты;
         в закрытую — каждый играет своей рукой, расклад остаётся
           тайной, но отвечает вистующий один и только за свои взятки.

       Это его выбор, а не режим, который включается сам. Раньше стол
       молча открывал карты — и отнимал у человека половину решения.

       «Полвиста» такого выбора не даёт: это не «играю за двоих», а «не
       играю, но пишу половину». */
    if (w.length === 1 && this.whist[w[0]] === 'W' && this.whisters.length > 1 && !this.pass) {
      /* ---------- один вистует, второй пасует ----------

         В закрытую тут играть НЕЛЬЗЯ. Ник: «в закрытую, когда один
         вистует, а второй пасует, по классическому кодексу нельзя». У
         вистующего два пути:

           открыть карты и играть в светлую — за обе руки;
           уйти «за свои» — забрать положенный минимум без розыгрыша.

         Исключение — девятерная и выше: там в светлую не разыгрывают и
         за свои не уходят. Вистующий обязан играть втёмную, и выбора
         ему не предлагают. */
      /* Мизер сюда уже не доходит — он ушёл в светлую выше, и за свои с
         него не уходят никогда: «разыгрывать и доказывать в преферансе
         нужно только мизер». */
      var lv2 = K.tricksOf(this.contract);
      if (AWAY[lv2] == null) {
        this.light = false; this.lightBy = -1; this.open = [];
        this.push({ e: 'light', by: w[0], open: [], on: false, forced: true });
        this.say(K.bidShort(this.contract) + ': в светлую не разыгрывают и за свои не уходят — ' +
          this.names[w[0]] + ' вистует втёмную.', 'big');
        return this.startPlay(this.seats[0]);
      }
      this.pending = { type: 'light', p: w[0], away: AWAY[lv2],
        open: this.whisters.filter(function (q) { return q !== w[0]; })[0] };
      return this;
    }

    /* ---------- вистуют оба: играют в ЗАКРЫТУЮ ----------

       Светлая бывает только при вист-пасе, и никогда — когда вистуют
       двое. Ник: «запрещено вистовать в светлую, если оба сказали вист;
       вист-пас — только может быть в светлую. А то я играю в светлую, а
       бот за свои карты ходит, бред».

       И это не придирка к интерфейсу, а смысл светлой. Светлая —
       не «покажем друг другу карты», а «пасовавший выбывает из
       розыгрыша, и за него ходит вистующий». Когда вистуют оба, выбывать
       некому: каждый отвечает за свои взятки и ходит своей рукой.
       Открывать при этом карты играющему — чистый подарок ему.

       Раньше тут спрашивали обоих «открываемся?», и при согласии стол
       раскладывал руки, но ходил каждый всё равно сам — отсюда и
       ощущение бреда. Вопроса больше нет.

       Сталинград (шесть пик при двух вистующих) этим же и закрылся: он
       был частным случаем того, что теперь правило. */
    if (w.length > 1 && !this.pass) {
      this.light = false; this.lightBy = -1; this.open = []; this.lightQ = [];
      this.push({ e: 'light', by: -1, open: [], on: false, pair: true, forced: true });
      this.say('Вистуют оба — играем в закрытую: светлая бывает только при вист-пасе.', 'big');
      return this.startPlay(this.seats[0]);
    }
    return this.startPlay(this.seats[0]);
  };

  /* Ответ вистующего: играем в светлую или в закрытую. */
  Game.prototype.doLight = function (a) {
    var p = this.pending.p, open = this.pending.open;
    /* Светлая — значит светлая у ОБОИХ. Ник: «вист не бывает в
       полузакрутую: или в открытую оба, или в закрытую оба».

       Раньше на стол ложилась только рука пасовавшего, а вистующий
       оставлял свою закрытой — и выходило, что играющий видит десять
       карт защиты из двадцати, а вистующий все двадцать. Полумера: он и
       так ведёт обе руки, прятать одну из них не от кого. */
    /* Уход «за свои»: карты не разыгрываются вовсе. Играющий забирает
       заказанное, вистующий пишет висты за положенный минимум,
       пасовавший не пишет ничего. */
    if (a.away) {
      var n2 = this.pending.away | 0;
      this.away = { p: p, tricks: n2 };
      this.push({ e: 'away', p: p, tricks: n2 });
      this.say(this.names[p] + ' уходит за свои — ' + n2 +
        (n2 === 1 ? ' взятка' : ' взятки') + ' без розыгрыша.', 'big');
      return this.score({ unwhisted: true, away: this.away });
    }
    this.light = !!a.light;
    this.lightBy = this.light ? p : -1;
    this.open = this.light ? this.whisters.slice() : [];
    this.push({ e: 'light', by: p, open: this.open.slice(), on: this.light });
    if (this.light) {
      this.say('Играем в светлую: карты защиты на стол. ' +
        this.names[p] + ' ведёт обе руки.', 'big');
    } else {
      this.say(this.names[p] + ' вистует в закрытую — карты защиты закрыты.', 'big');
    }
    return this.startPlay(this.seats[0]);
  };

  /* ---------- розыгрыш ---------- */
  Game.prototype.startPlay = function (first) {
    this.lead = first;                        // ходит первая рука, а не играющий
    this.push({ e: 'play-start', p: first, trump: this.trump, pass: this.pass });
    this.askPlay(first);
    return this;
  };

  /* Чья это карта и КТО её кладёт — разные вопросы. Обычно один и тот
     же человек, но в светлую за открытую руку кладёт вистующий.

     Спрашиваем всегда ТОГО, КТО РЕШАЕТ: `pending.p` — это он, как и во
     всех остальных вопросах движка. Чья рука — в `pending.hand`. Так
     любой, кто уже умеет отвечать на `pending.p`, продолжает работать,
     а про светлую знает только тот, кому она интересна. */
  Game.prototype.actorOf = function (p) {
    return (this.light && this.lightBy >= 0 && this.open.indexOf(p) >= 0) ? this.lightBy : p;
  };
  Game.prototype.askPlay = function (p) {
    this.pending = { type: 'play', p: this.actorOf(p), hand: p };
    return this;
  };

  /* Открытый прикуп на распасах ВЗЯТОК НЕ ДАЁТ — он диктует масть хода.

     Так это устроено в сочинке и ленинградке: карты прикупа
     выкладываются по одной, и первая назначает масть первой взятки,
     вторая — второй. Взятку по-прежнему берёт тот, кто положил старшую
     карту своей масти; сама карта прикупа никому не пишется.

     Мы долго не знали, как «разыгрывать» открытый прикуп, и он просто
     показывался. Вот в чём был ответ: он не разыгрывается, он
     командует. */
  Game.prototype.leadSuit = function () {
    if (!this.pass || !this.o.passWidow || !this.widow) return null;
    var n = this.tricks.length;
    if (n > 1) return null;
    var c = this.widow[n];
    return c ? c.s : null;
  };

  // какие карты можно положить: масть хода обязательна, нет масти — козырь
  Game.prototype.legal = function (p) {
    var h = this.hands[p];
    if (!this.cur.length) {
      var ls = this.leadSuit();
      if (ls) {
        var lead0 = h.filter(function (c) { return c.s === ls; });
        if (lead0.length) return lead0;       // масть прикупа есть — обязан ходить в неё
      }
      return h.slice();
    }
    var lead = this.cur[0].c.s;
    var same = h.filter(function (c) { return c.s === lead; });
    if (same.length) return same;             // перебивать старше не обязан
    if (this.trump) {
      var tr = h.filter(function (c) { return c.s === this.trump; }, this);
      if (tr.length) return tr;
    }
    return h.slice();
  };

  Game.prototype.doPlay = function (a) {
    var p = (this.pending.hand != null) ? this.pending.hand : this.pending.p, c = a.card;
    var ok = this.legal(p), i, found = false;
    for (i = 0; i < ok.length; i++) if (K.same(ok[i], c)) found = true;
    if (!found) return this;
    this.hands[p].splice(idx(this.hands[p], c), 1);
    this.cur.push({ p: p, c: c });
    this.push({ e: 'card', p: p, c: c, first: this.cur.length === 1 });

    if (this.cur.length < this.seats.length) return this.askPlay(this.after(p));
    // взятка сыграна
    var lead = this.cur[0].c.s, best = this.cur[0];
    for (i = 1; i < this.cur.length; i++)
      if (K.beats(this.cur[i].c, best.c, lead, this.trump)) best = this.cur[i];
    this.taken[best.p]++;
    this.tricks.push({ plays: this.cur.slice(), w: best.p });
    this.push({ e: 'trick', plays: this.cur.slice(), w: best.p, no: this.tricks.length });
    this.cur = [];

    /* Мизер: взял взятку — дальше можно не играть, результат уже ясен.
       Но доигрываем: цена мизера считается по числу взяток. */
    if (this.tricks.length >= 10) return this.score({});
    return this.askPlay(best.p);
  };

  /* ---------- распасы ---------- */
  Game.prototype.startPass = function () {
    this.pass = true;
    this.passRow++;
    this.trump = null;
    this.price = K.passPrice(this.o, this.passRow);
    this.push({ e: 'raspas', row: this.passRow, price: this.price, widow: this.o.passWidow ? this.widow.slice() : null });
    this.say('Все спасовали — распасы' +
      (this.passRow > 1 ? ' подряд ' + this.passRow + '-е' : '') +
      ', по ' + this.price + ' за взятку.', 'big');
    return this.startPlay(this.seats[0]);
  };

  /* ---------- подсчёт ----------
     Пуля — за сыгранное. Гора — за подсад и за распасы.
     Висты — цена игры × взятки вистующего, пишутся на играющего. */
  Game.prototype.score = function (info) {
    var i, r = { pass: this.pass, taken: this.taken.slice(), contract: this.contract,
      declarer: this.declarer, need: this.need, unwhisted: !!info.unwhisted,
      pool: [], mountain: [], whists: [], price: 0, row: this.passRow };

    var addPool = [], addMt = [], addW = [];
    for (i = 0; i < this.N; i++) { addPool.push(0); addMt.push(0); addW.push(0); }
    /* За что именно гора — это видно и в записи, и в разборе: распас,
       подсад или недобор на висте. Три разные болезни, лечатся по-разному. */
    var why = { raspas: [], podsad: [], whistShort: [] };
    for (i = 0; i < this.N; i++) { why.raspas.push(0); why.podsad.push(0); why.whistShort.push(0); }

    if (this.pass) {
      // каждому в гору по цене распаса за каждую его взятку
      r.price = this.price;
      var clean = this.o.passClean | 0;

      /* ---------- ростовские распасы: вистами, а не горой ----------

         В Ростове распасы не штрафуют, а РАЗЫГРЫВАЮТСЯ: кто взял меньше
         всех, тот их выиграл и пишет на каждого соперника по пять вистов
         за каждую взятую тем взятку. В гору не идёт ничего.

         Когда меньше всех взяли двое, банк на третьем делится между
         ними: источник так и пишет — «пишут на него по 2.5 виста за
         взятку». Делим банк целиком, а не по половинке за взятку, иначе
         на нечётном числе взяток пропадала бы половина виста; остаток
         достаётся тому, кто сидит раньше по кругу. */
      if (this.o.passMode === 'vists') {
        var pv = this.o.passVist || 5, lo = 1e9, k2;
        for (k2 = 0; k2 < this.seats.length; k2++)
          lo = Math.min(lo, this.taken[this.seats[k2]]);
        var win = this.seats.filter(function (q2) { return this.taken[q2] === lo; }, this);
        r.passWin = win.slice(); r.passVist = pv;
        if (win.length && win.length < this.seats.length) {
          for (k2 = 0; k2 < this.seats.length; k2++) {
            var loser = this.seats[k2];
            if (win.indexOf(loser) >= 0) continue;
            var bank = pv * this.taken[loser], each2 = Math.floor(bank / win.length);
            var left2 = bank - each2 * win.length;
            for (var k3 = 0; k3 < win.length; k3++) {
              var got3 = each2 + (k3 < left2 ? 1 : 0);
              if (!got3) continue;
              this.whists[win[k3]][loser] += got3; addW[win[k3]] += got3;
            }
          }
          this.say('Распасы выиграл' + (win.length > 1 ? 'и ' : ' ') +
            win.map(function (q2) { return this.names[q2]; }, this).join(' и ') +
            ' — по ' + pv + ' виста за чужую взятку.', 'hi');
        }
      } else {
        /* Обычная запись: каждому в гору по цене распаса за его взятки. */
        for (i = 0; i < this.N; i++) { addMt[i] = this.taken[i] * this.price; why.raspas[i] = addMt[i]; }
      }

      /* ---------- чистый распас ----------
         Кто не взял ни одной — пишет себе стоимость взятки. В Ростове
         сперва списывает её с горы, если гора есть, и только при пустой
         горе пишет в пулю. В финке такого бонуса нет вовсе. */
      if (clean) {
        var cl = [];
        for (i = 0; i < this.N; i++) {
          if (this.taken[i] || this.seats.indexOf(i) < 0) continue;
          var bonus = clean * this.price;
          if (this.o.passCleanGora && this.mountain[i] + addMt[i] > 0) {
            var off = Math.min(bonus, this.mountain[i] + addMt[i]);
            addMt[i] -= off; why.raspas[i] -= off;
            cl.push(this.names[i] + ' −' + off + ' с горы');
          } else {
            addPool[i] = bonus;
            cl.push(this.names[i] + ' +' + bonus + ' в пулю');
          }
        }
        if (cl.length) this.say('Чистый распас: ' + cl.join(', ') + '.', 'hi');
      }
      if (this.o.passMode !== 'vists') {
        this.say('Распасы: ' + this.seats.map(function (p) {
          return this.names[p] + ' ' + this.taken[p] + '×' + this.price;
        }, this).join(', ') + ' — в гору.', '');
      }
    } else {
      var d = this.declarer;
      /* Тёмная удваивает всё симметрично: и пулю за сыгранную, и гору
         за подсад, и висты защиты, и её же штраф за недобор. Риск
         двойной с обеих сторон — в этом вся соль. */
      var pr = K.price(this.contract) * (this.darkPlay() ? 2 : 1) *
        (this.noWidow ? (this.o.noWidowMul || 2) : 1);
      /* Цена игры и цена ВИСТОВОЙ взятки — разные числа. В финке и
         сочинке они совпадают, а ленинградка платит за вист и пишет
         гору за подсад вдвое: пуля 2, вист 4, гора 4. Пуля везде по
         обычной цене, иначе партия кончалась бы вдвое быстрее. */
      var vp = pr * (this.o.vistMul || 1);
      r.price = pr; r.vist = vp;
      var got = this.taken[d], miser = K.isMiser(this.contract);
      var made = miser ? (got === 0) : (got >= this.need), miss = 0;
      r.made = made; r.got = got; r.dark = this.darkPlay(); r.noWidow = !!this.noWidow;

      if (info.unwhisted) made = true, r.made = true, r.got = this.need;

      if (made) {
        addPool[d] = pr;
        this.say(this.names[d] + ' сыграл ' + K.bidShort(this.contract) +
          ' — ' + pr + ' в пулю.', 'hi');
      } else {
        miss = miser ? got : (this.need - got);
        addMt[d] = pr * miss * (this.o.sadMul || 1); why.podsad[d] = addMt[d];
        r.miss = miss;
        this.say('Подсад! ' + this.names[d] + ' ' +
          (miser ? 'взял ' + got : 'без ' + miss) + ' — ' + addMt[d] + ' в гору.', 'bad');

      for (i = 0; i < g.open.length; i++) if (l.indexOf(g.open[i]) < 0) l.push(g.open[i]);
      if (g.actorOf && g.actorOf(p) === g.lightBy && l.indexOf(g.lightBy) < 0) l.push(g.lightBy);
    }
    return l;
  }

  function unseen(g, p) {
    var seen = {}, i, j;
    knownSeats(g, p).forEach(function (q) {
      g.hands[q].forEach(function (c) { seen[K.id(c)] = 1; });
    });
    g.tricks.forEach(function (t) { t.plays.forEach(function (x) { seen[K.id(x.c)] = 1; }); });
    g.cur.forEach(function (x) { seen[K.id(x.c)] = 1; });
    if (p === g.declarer) g.drop.forEach(function (c) { seen[K.id(c)] = 1; });
    // прикуп: играющий его видел, в распасах с открытым прикупом — все
    if (p === g.declarer || (g.pass && g.o.passWidow))
      g.widow.forEach(function (c) { seen[K.id(c)] = 1; });
    var l = [], d = K.deck();
    for (i = 0; i < d.length; i++) if (!seen[K.id(d[i])]) l.push(d[i]);
    return l;
  }

  /* Кто в какой масти пуст. Единственный честный источник — отказ:
     не положил масть хода, значит её нет. Это знание бота, а не
     подглядывание. */
  function voids(g) {
    var v = {};
    function scan(plays) {
      if (!plays.length) return;
      var lead = plays[0].c.s;
      for (var k = 1; k < plays.length; k++)      // свой счётчик: общий сломал бы внешний цикл
        if (plays[k].c.s !== lead) {
          v[plays[k].p] = v[plays[k].p] || {};
          v[plays[k].p][lead] = 1;
          // не положил и козыря — значит и козыря нет
          if (g.trump && plays[k].c.s !== g.trump) v[plays[k].p][g.trump] = 1;
        }
    }
    for (var t = 0; t < g.tricks.length; t++) scan(g.tricks[t].plays);
    scan(g.cur);
    return v;
  }

  /* Раздать невидимые карты остальным местам. Сколько карт у кого —
     известно точно; куда какую — гадаем, но не суём масть тому, кто в
     ней уже отказался. Не сошлось за десять попыток — раздаём как
     попало: лучше грубая модель, чем зависший бот. */
  function deal(pool, need, vd, rnd) {
    var try_, i, j;
    for (try_ = 0; try_ < 10; try_++) {
      var l = pool.slice(), out = {}, ok = true;
      for (i = l.length - 1; i > 0; i--) { j = (rnd() * (i + 1)) | 0; var t = l[i]; l[i] = l[j]; l[j] = t; }
      var seats = Object.keys(need);
      for (i = 0; i < seats.length; i++) out[seats[i]] = [];
      for (i = 0; i < l.length; i++) {
        var c = l[i], put = -1;
        for (j = 0; j < seats.length; j++) {
          var q = seats[j];
          if (out[q].length >= need[q]) continue;
          if (q !== 'dead' && vd[q] && vd[q][c.s]) continue;
          put = q; break;
        }
        if (put < 0) { ok = false; break; }
        out[put].push(c);
      }
      if (ok) return out;
    }
    var l2 = pool.slice(), out2 = {}, k = 0;
    Object.keys(need).forEach(function (q) { out2[q] = l2.slice(k, k + need[q]); k += need[q]; });
    return out2;
  }


  /* Сколько карт кому раздавать. Кроме чужих рук есть стопка, которой
     не будет на столе никогда: снос играющего и невскрытый прикуп.
     Её тоже надо раздать — иначе эти карты «выпадут» кому-то в руку и
     решатель посчитает чужой расклад. */
  function ghostNeed(g, p, seats) {
    var need = {}, i, kn = knownSeats(g, p);
    for (i = 0; i < seats.length; i++) {
      var q = seats[i];
      if (kn.indexOf(q) >= 0) continue;        // эту руку не гадаем — она видна
      need[q] = g.hands[q].length;
    }
    var dead = 0;
    if (!g.pass && p !== g.declarer) dead += g.drop.length;          // чужой снос
    if (g.pass && !g.o.passWidow) dead += g.widow.length;            // закрытый прикуп
    if (!g.pass && p !== g.declarer && g.widow.length && g.drop.length === 0) dead += 0;
    if (dead) need.dead = dead;
    return need;
  }

  /* ---------- оценка мизера ----------
     Карта опасна, когда младших этой масти у соперников больше, чем у
     меня: они успеют вытянуть все мои мелкие, и я останусь со старшей
     на руках. Это вся арифметика «дырок», без мистики. */
  function miserRisk(hand) {
    var m = E.bySuit(hand), t = 0, s;
    for (s in m) {
      var c = m[s].slice().sort(function (a, b) { return a - b; });   // снизу вверх
      if (!c.length) continue;
      var st = 0;
      for (var i = 0; i < c.length; i++) {
        /* Карта опасна, когда младших этой масти у соперников больше,
           чем у меня: они вытянут все мои мелкие, и я останусь со
           старшей на руках. Потолок не единица, а полтора с лишним:
           одинокий туз в масти стоит дороже, чем прикрытый король, —
           решатель это подтверждает (2.8 взятки против 0.9). */
        var below = c[i] - i;
        st += Math.max(0, Math.min(1.6, (below - i) / 2));
      }
      /* «Паровоз» — ДЛИННАЯ масть без самого низа. Про неё пишут в
         книгах: валет-десятка-девятка-восьмёрка без семёрки выглядит
         безобидно, но отдать ход такой мастью нечем, и когда ход
         возвращается, берёшь всё подряд. На трёх картах этого ещё не
         происходит — там хватает других мастей, чтобы отбиться. */
      if (c.length >= 4 && c[0] > 0) st += (c.length - 3) * 0.55 * Math.min(2, c[0]);
      /* В одной масти нельзя взять больше взяток, чем в ней карт. */
      t += Math.min(st, c.length);
    }
    /* Нечем отдать ход — та же беда, только по всей руке. «Отказная»
       масть — та, где моя старшая карта семёрка: ею точно не возьмёшь. */
    var outs = 0;
    for (s in m) { var c2 = m[s]; if (c2.length && c2[c2.length - 1] === 0) outs++; }
    if (outs === 0) t += 0.45;
    else if (outs === 1) t += 0.15;

    /* Насыщение. Складывать опасности по всем мастям в лоб нельзя:
       соперники физически успевают ударить по слабым местам пять-шесть
       раз за сдачу, а не сколько угодно. Поэтому сумма не растёт
       бесконечно — она упирается в потолок.

       Без этого «дырявый забор» получал шесть взяток вместо двух с
       половиной: каждая дыра по отдельности посчитана верно, а вместе
       они дали цифру, которой в десяти взятках просто нет места. */
    return MIS_CAP * (1 - Math.exp(-t / MIS_CAP));
  }

  function normDist(mu, sigma) {
    var p = [], k, sum = 0;
    for (k = 0; k <= 10; k++) {
      var z = (k - mu) / sigma;
      p[k] = Math.exp(-0.5 * z * z);
      sum += p[k];
    }
    for (k = 0; k <= 10; k++) p[k] /= sum;
    return p;
  }

  /* ---------- мизер: тоже таблица, а не колокол ----------

     Меряли там, где бот мизер и видит: на руке, оставшейся после
     лучшего сноса из двенадцати (misercal3.js). Это совсем другая
     выборка, чем случайные десять карт, — чистых мизеров в ней впятеро
     больше, и решение принимается именно по ней.

     Обрыв оказался крутым: при формуле ниже 0.4 мизер был чистым
     одиннадцать раз из одиннадцати, а уже на 0.4–0.8 берётся почти две
     взятки. Ни один колокол такого обрыва не опишет — поэтому таблица.

     Строка — «дырки» с шагом 0.4, столбец — сколько взяток вышло. */
  var MDIST = [
    [0.852, 0.106, 0.005, 0.005, 0.005, 0.005, 0.005, 0.005, 0.005, 0.005, 0.005],
    [0.123, 0.481, 0.188, 0.019, 0.012, 0.069, 0.019, 0.069, 0.012, 0.004, 0.004],
    [0.093, 0.412, 0.336, 0.129, 0.014, 0.003, 0.003, 0.003, 0.003, 0.003, 0.003],
    [0.121, 0.243, 0.348, 0.08, 0.073, 0.045, 0.042, 0.038, 0.006, 0.002, 0.002],
    [0.101, 0.101, 0.036, 0.186, 0.121, 0.121, 0.197, 0.111, 0.015, 0.005, 0.005],

  /* ---------- право первой руки ----------

     Книжный принцип, которого в формуле риска не было вовсе: мизер с
     первой руки много легче, чем с третьей. Кто ходит — сам выбирает,
     чем сбрасываться, и успевает отдать опасную карту, пока соперники

     Расклад один и тот же, меняется ТОЛЬКО кто начинает, — поэтому

       играющий сам первая рука      1.18 взятки
       играющий кладёт вторым        1.75
       играющий кладёт последним     2.92

     Полтора взятки разницы на ровном месте. Причём «чисто» выходит
     одинаково часто с первой и со второй руки (47% и 45%) — разница
     не в том, СЫГРАЕТ ли, а в том, насколько больно сядет.

     Важная поправка к прошлым замерам: таблица MDIST снята при ходе
     соседа слева, то есть в САМОМ ХУДШЕМ для играющего положении. Две

  var MIS_SEAT = [0.40, 0.60, 1.00];   // множитель к ожидаемым взяткам по месту

  function distMean(row) {

    return s;
  }
  function rawDist(risk) {
    var t = risk / 0.4;
    if (t < 0) t = 0;
    var lo = Math.min(MDIST.length - 1, Math.floor(t));
    var hi = Math.min(MDIST.length - 1, lo + 1), f = t - lo;
    if (lo === hi) return MDIST[lo].slice();
    var a = MDIST[lo], b = MDIST[hi], out = [], k;
    for (k = 0; k <= 10; k++) out.push(a[k] * (1 - f) + b[k] * f);

  /* Своя таблица на каждое место. Не сдвигаем риск и не режем потери:
     ищем тот риск, при котором ИСХОДНАЯ таблица даёт нужное среднее, и
     берём оттуда всю строку целиком. Так сохраняется и обрыв у нуля
     (ниже 0.4 мизер чист с любого места — это тоже намеряно), и форма
     разброса, которую мы мерили отдельно. */
  var MDIST_P = (function () {
    var out = [], pos, j, i;
    for (pos = 0; pos < 3; pos++) {
      var f = MIS_SEAT[pos], tbl = [];
      for (j = 0; j < MDIST.length; j++) {
        if (f >= 0.999) { tbl.push(MDIST[j].slice()); continue; }
        var want = f * distMean(MDIST[j]), r = 0, step = (j * 0.4) / 60;
        for (i = 1; i <= 60; i++) { var rr = i * step; if (distMean(rawDist(rr)) <= want) r = rr; }
        tbl.push(rawDist(r));
      }
      out.push(tbl);
    }
    return out;
  })();

  function miserDist(risk, pos) {
    var T = (pos != null && MDIST_P[pos]) ? MDIST_P[pos] : MDIST;
    var t = risk / 0.4;
    if (t < 0) t = 0;
    var lo = Math.min(T.length - 1, Math.floor(t));
    var hi = Math.min(T.length - 1, lo + 1), f = t - lo;
    if (lo === hi) return T[lo].slice();
    var a = T[lo], b = T[hi], out = [], k;
    for (k = 0; k <= 10; k++) out.push(a[k] * (1 - f) + b[k] * f);
    return out;
  }

  /* ---------- настоящий разброс вместо колокола ----------

     Раньше вероятности считались по нормальному распределению вокруг
     оценки. Для шестерных это сходилось, а выше врало в одну сторону:
     оценил семь — колокол обещал 72% на семерной, а вытягивалось 63%.
     Причина не в сигме: взяток не бывает больше десяти, и колокол,
     обрезанный потолком, раздаёт лишнее вверх вместо низа.

     Поэтому тут не формула, а ТАБЛИЦА, снятая с решённых замеров:
     строка — округлённая оценка, столбец — сколько взяток вышло на
     деле. Пересобирается `distfit.js`. */
  var PDIST = [
    [0.637, 0.303, 0.051, 0.006, 0.001, 0, 0, 0, 0, 0, 0],
    [0.368, 0.385, 0.191, 0.046, 0.007, 0.002, 0, 0, 0, 0, 0],
    [0.104, 0.284, 0.347, 0.199, 0.056, 0.008, 0.001, 0.001, 0, 0, 0],
    [0.01, 0.077, 0.234, 0.335, 0.237, 0.082, 0.02, 0.004, 0, 0, 0],
    [0, 0.01, 0.075, 0.239, 0.383, 0.21, 0.064, 0.016, 0.002, 0, 0],
    [0, 0.001, 0.008, 0.053, 0.237, 0.388, 0.216, 0.075, 0.018, 0.002, 0],
    [0, 0, 0, 0.003, 0.061, 0.277, 0.366, 0.201, 0.071, 0.018, 0.002],
    [0.001, 0.001, 0.001, 0.001, 0.006, 0.087, 0.325, 0.324, 0.159, 0.061, 0.034],
    [0.003, 0.003, 0.003, 0.003, 0.003, 0.014, 0.124, 0.386, 0.338, 0.099, 0.025],
    [0, 0.003, 0.003, 0.003, 0.003, 0.003, 0.014, 0.124, 0.386, 0.338, 0.124],
    [0, 0, 0.003, 0.003, 0.003, 0.003, 0.003, 0.014, 0.124, 0.386, 0.461]
  ];
  /* Оценка дробная, а строк одиннадцать: берём две соседние и мешаем.
     Без этого рука на 6.5 считалась бы то как шестёрка, то как
     семёрка, и цена заявки прыгала бы на ровном месте. */
  function playDist(mu) {
    if (mu < 0) mu = 0; if (mu > 10) mu = 10;
    var lo = Math.floor(mu), hi = Math.min(10, lo + 1), t = mu - lo;
    if (lo === hi) return PDIST[lo].slice();
    var a = PDIST[lo], b = PDIST[hi], out = [], k;
    for (k = 0; k <= 10; k++) out.push(a[k] * (1 - t) + b[k] * t);
    return out;
  }

  /* ---------- цена заявки с прикупом ----------

     Заявить шестерную и заявить девятерную — разные вещи не только по
     цене. Заказав мало, ты оставляешь себе право выбрать игру ПОСЛЕ
     прикупа: лёг хорошо — объявишь выше, лёг плохо — сыграешь что
     заказал. Заказав много, этого права у тебя нет.

     Это право стоит примерно полторы взятки, и никакой «надбавкой за
     прикуп» его не заменить: оно разное для разных заявок. Поэтому
     считаем честно — подкидываем несколько прикупов, для каждого
     перебираем весь снос и все игры и смотрим, что бы вышло. */
  /* Цена заявки в очках — для руки, которая уже снеслась.
     Оценщик даёт среднее число взяток, разброс намерян; отсюда
     вероятность каждого исхода, отсюда цена. Сыграл — пуля минус
     висты соперникам; не сыграл — цена × недобор в гору. */
  /* pos — место играющего в раскладке этой сдачи: 0 первая рука, 1
     вторая, 2 третья. Для мизера это полторы взятки разницы, для
     контрактной игры — мелочь, и мы её не считаем. Не передали — счёт
     как раньше, по худшему месту. */
  function bidValue(hand, n, pos) {
    var pr = K.price(n);
    if (K.isMiser(n)) {
      /* Перевод «дырок» во взятки намерян решателем на 220 мизерных
         руках (misercal2.js): взято ≈ 1.57 × формула, подгонка через
         ноль. Через ноль — не для красоты: на руке без дырок мизер и
         правда чистый, это сходится и с книгой (железная масть снизу,
         ловушка семь-девять — решатель даёт ровно ноль).

         Разброс большой, 1.9 взятки, и это честная характеристика
         формулы: заявлять мизер можно только когда дырок почти нет.
         Там, где формула даёт ≤0.6, чистыми оказались четыре из пяти;
         уже при 1.2 — меньше трети. */
      var pm = miserDist(Math.max(0, miserRisk(hand)), pos);
      var ev = pm[0] * pr;
      for (var k = 1; k <= 10; k++) ev -= pm[k] * pr * k * GORA;
      return ev;
    }
    var need = K.tricksOf(n), trump = K.trumpOf(n);
    /* Оценщик намерян решателем, а решатель видит все карты. За столом
       так не играют: живых взяток у играющего в среднем на пятую часть
       взятки меньше, чем обещает расклад в открытую (calibblind.js).
       Без этой поправки бот заказывает чуть смелее, чем стоило бы. */
    var p = playDist(Math.max(0, E.play(hand, trump) - BLIND)), ev2 = 0;
    for (var i = 0; i <= 10; i++) {
      if (i >= need) ev2 += p[i] * (pr - VIST * pr * (10 - i));
      else ev2 -= p[i] * pr * (need - i) * GORA;
    }
    /* Невистованная игра пишется БЕЗ розыгрыша: пуля даром, без риска
       сесть. Шестерные и семерные не вистуют примерно в половине
       случаев — не учитывать это значит недооценивать каждый заказ
       примерно на очко. Доли намерены за столом (calibunw.js). */
    var un = UNWH[need] || 0;
    return un * pr + (1 - un) * ev2;
  }

  var WSAMP = 5;             // сколько прикупов примерить

  function bidScan(g, p, cfg) {
    if (g._scan && g._scan.no === g.handNo && g._scan.p === p) return g._scan.v;
    var hand = g.hands[p], pool = [], seen = {}, i, j, n;
    hand.forEach(function (c) { seen[K.id(c)] = 1; });
    var d = K.deck();
    for (i = 0; i < d.length; i++) if (!seen[K.id(d[i])]) pool.push(d[i]);

    var rnd = rndOf(g), NB = K.BIDS.length;
    /* Место играющего в раскладке. Ключом `seatMiser: 0` поправку
       можно выключить — это нужно поединку, который её и проверяет. */
    var pos = (cfg && cfg.seatMiser === 0) ? -1 : (g.seats ? g.seats.indexOf(p) : -1);
    var acc = []; for (n = 0; n < NB; n++) acc.push(0);

    for (var s = 0; s < WSAMP; s++) {
      var a = (rnd() * pool.length) | 0, b = (rnd() * pool.length) | 0;
      while (b === a) b = (rnd() * pool.length) | 0;
      var h12 = hand.concat([pool[a], pool[b]]);
      var bestAt = []; for (n = 0; n < NB; n++) bestAt[n] = -1e9;
      for (i = 0; i < h12.length; i++) for (j = i + 1; j < h12.length; j++) {
        var left = [];
        for (var t = 0; t < h12.length; t++) if (t !== i && t !== j) left.push(h12[t]);
        for (n = 0; n < NB; n++) {
          var v = bidValue(left, n, pos);
          if (v > bestAt[n]) bestAt[n] = v;
        }
      }
      /* Право выбрать игру повыше: заявив n, играешь лучшее из того,
         что не ниже. С одной оговоркой — МИЗЕР сюда не входит. Назвал
         «шесть пик» — мизера тебе уже не сказать (правило «мизер только
         первым словом»), значит и цену мизера в шестёрку подмешивать
         нельзя. Пока подмешивалась, scan[6♠] был не меньше scan[мизер]
         по построению, и бот не заявлял мизер НИ РАЗУ. */
      for (n = NB - 2; n >= 0; n--) {
        var up = K.isMiser(n + 1)
          ? (n + 2 < NB ? bestAt[n + 2] : -1e9)
          : bestAt[n + 1];
        if (up > bestAt[n]) bestAt[n] = up;
      }
      for (n = 0; n < NB; n++) acc[n] += bestAt[n];
    }
    for (n = 0; n < NB; n++) acc[n] /= WSAMP;
    g._scan = { no: g.handNo, p: p, v: acc };
    return acc;
  }

  /* Чего ждать, если промолчать.

     Раньше тут стояла догадка «плюс четверть очка за то, что играет
     кто-то другой». Догадка оказалась дорогой: на живых партиях
     молчание стоит МИНУС 0.85 очка (см. calibquiet.js). Разница в целое
     очко — ровно столько бот и недозаказывал.

     Понятно почему: чужая сыгранная игра — это его пуля, а она бьёт по
     всем остальным. Вистами это не окупается. */
  var QUIET = -0.51;         // цена чужой игры, намерена на партиях

  /* Средний сбор на распасе — 3.3 взятки на руку. Проверено
     принудительными распасами: оценщик обещает 3.30, берётся 3.33,
     наклон 1.04. То есть E.pass честен, разброс только великоват. */
  var RASPAS_AVG = 3.3;

  function silenceValue(g, p) {
    var o = g.o, price = K.passPrice(o, g.passRow + 1);

    /* Распас считаем ОТНОСИТЕЛЬНО, а не в лоб.

       Тут была дорогая ошибка: бот вычитал всю свою распасную гору
       целиком. Но на распасах платят ВСЕ, и если я собрал свои три
       взятки и соперники свои три — в турнирной таблице не изменилось
       ничего. Страшен не распас, а распас с плохой для распаса картой.

       Поэтому в счёт идёт только разница: насколько моя рука хуже
       средней (3.3 взятки). Пока считалось иначе, бот боялся распасов
       как огня и заказывал что попало — распасы не случались вовсе. */
    var mine = E.pass(g.hands[p]);
    var raspas = -(mine - RASPAS_AVG) * price * GORA;

    var live = g.seats.filter(function (q) { return g.out.indexOf(q) < 0 && q !== p; });
    /* Распасы будут, только если промолчат все. Уже прозвучавшая заявка
       эту возможность закрывает. */
    var pRaspas = (g.high != null) ? 0 : (live.length ? Math.pow(0.45, live.length) : 1);
    return pRaspas * raspas + (1 - pRaspas) * QUIET;
  }

  /* Тёмная игра.

     Оценить руку нельзя — её никто не видел, поэтому считать тут
     нечего, и это единственное решение бота, которое честно
     принимается вслепую. Но вслепую не значит наугад: тёмную берут,
     когда терять уже нечего. Если гора выросла заметно выше, чем у
     соперников, двойная цена — это шанс отыграться одним махом, а
     двойной подсад мало что меняет.

     И только с первого слова: перебивать чужую заявку втёмную —
     не риск, а бравада. */
  function chooseDark(g, p, cfg) {
    if (!g.o.dark || g.high != null) return false;
    var my = g.mountain[p], best = 0, i;
    for (i = 0; i < g.N; i++) if (i !== p && g.mountain[i] > best) best = g.mountain[i];
    var behind = my - best;
    var pr = (behind > 14) ? 0.30 : (behind > 7) ? 0.12 : 0.02;
    if (cfg && cfg.darkBias != null) pr = cfg.darkBias;
    return rndOf(g)() < pr;
  }

  function chooseBid(g, p, cfg) {
    /* Решение про тёмную принимается ДО взгляда на карты, значит и до
       любого расчёта. Заказываем самую дешёвую игру: втёмную важно не
       сколько заказал, а что рискнул. */
    if (chooseDark(g, p, cfg)) return { bid: 0, dark: true };

    var min = (g.high == null) ? 0 : g.high + 1, best = null, bestV = -1e9;
    var scan = bidScan(g, p, cfg);
    /* Старшинство спрашиваем у движка, а не считаем по индексу: мизер
       говорят только первым своим словом и бьют только девятерной.
       Незаконную заявку движок молча не примет — и стол встанет. */
    function ok(n2) { return !g.canBid || g.canBid(n2, p); }
    for (var n = min; n < K.BIDS.length; n++) {
      if (!ok(n)) continue;
      if (scan[n] > bestV) { bestV = scan[n]; best = n; }
    }
    /* Мизер стоит в лестнице между семерной и восьмерной, а по
       старшинству он выше восьмерной: смотрим его отдельно, иначе после
       чужой восьмерной бот его не увидит вовсе. */
    if (K.MISER >= min && ok(K.MISER) && scan[K.MISER] > bestV) {
      bestV = scan[K.MISER]; best = K.MISER;
    }
    /* Заявлять выше, чем нужно, незачем: объявить окончательную игру
       можно и после прикупа, а вот опуститься уже нельзя. Поэтому из
       равноценных берём самую низкую. */
    for (n = min; n < K.BIDS.length; n++) {
      if (!ok(n)) continue;
      if (scan[n] >= bestV - 0.02) { best = n; break; }
    }
    var quiet = silenceValue(g, p);
    /* Заявляем ровно столько, сколько стоит: лишняя ступень не нужна —
       по правилам можно объявить окончательную игру выше заявленной,
       а вот ниже уже нельзя. */
    /* Смелость торговли — одна ручка. Ноль значит «заказываю, только
       когда заказ честно дороже молчания»; выше — рискую охотнее.
       Подбирается поединком, а не на глаз. */
    var edge = 0.15 - (cfg && cfg.bidBias || 0);
    if (best == null || bestV <= quiet + edge) return { bid: null };
    return { bid: best };
  }

  /* ---------- снос ----------
     Двенадцать карт, выбрать две. Перебираем все 66 пар и все пять
     игр — это дёшево и честнее любых правил вроде «сноси короткую
     масть». Заодно тут же выясняется, какую игру объявлять. */
  function chooseDrop(g, p) {
    var h = g.hands[p], i, j, best = null, bestV = -1e9, miser = K.isMiser(g.high);
    for (i = 0; i < h.length; i++) for (j = i + 1; j < h.length; j++) {
      var left = h.filter(function (c, k) { return k !== i && k !== j; });
      var v;
      if (miser) v = -miserRisk(left);
      else {
        v = -1e9;
        for (var n = g.high; n < K.BIDS.length; n++) {
          if (K.isMiser(n)) continue;
          var t = bidValue(left, n);
          if (t > v) v = t;
        }
      }
      if (v > bestV) { bestV = v; best = [h[i], h[j]]; }
    }
    return { cards: best };
  }

  /* ---------- карточка разбойника ----------

     Выбор графы — это не «какая игра выгоднее сейчас». Набор игр у всех
     одинаковый, сыграть придётся всё, и вопрос только в том, КАКОЙ
     картой какую графу закрыть. Значит считать надо не цену сдачи, а
     насколько эта рука лучше обычной для этой графы.

     Отсюда точка отсчёта: сколько даёт средняя рука (намерено в
     razbase.js, 400 раздач). Средняя рука на десятерной теряет полсотни
     очков, на шестерной — одно. Поэтому хорошую карту тратят на дорогую
     графу, а мусор сливают в распасовку — ровно так, как за столом. */
  var RAZBASE = { 6: -1.00, 7: -6.83, 8: -17.40, 9: -32.84, 10: -52.70,
    M: -42.77, R: 3.29 };

  function chooseSlot(g, p) {
    var left = g.pending.left || [], hand = g.hands[p];
    if (!left.length) return { slot: 0 };
    var best = null, bestV = -1e9, i, j;
    for (i = 0; i < left.length; i++) {
      var t = left[i].t, v, suit = null;
      if (t === 'R') {
        /* Распасовка: чем меньше возьму, тем лучше. В очках это цена
           распаса за каждую взятку сверх обычной. */
        var price = K.passPrice(g.o, g.passRow + 1);
        v = -(E.pass(hand) - RAZBASE.R) * price * GORA;
      } else if (t === 'M') {
        v = bidValue(hand, K.MISER) - RAZBASE.M;
      } else {
        var want = t | 0, bv = -1e9;
        for (j = 0; j < K.BIDS.length; j++) {
          if (K.BIDS[j].tricks !== want) continue;
          var x = bidValue(hand, j);
          if (x > bv) { bv = x; suit = K.BIDS[j].suit; }
        }
        v = bv - (RAZBASE[want] || 0);
      }
      if (v > bestV) { bestV = v; best = { slot: left[i].i, suit: suit }; }
    }
    return best || { slot: left[0].i };
  }

  function chooseContract(g, p, cfg) {
    var h = g.hands[p], min = g.high, best = min, bestV = -1e9;
    var pos = (cfg && cfg.seatMiser === 0) ? -1 : (g.seats ? g.seats.indexOf(p) : -1);
    /* Мизер после прикупа — конвенция «мизер с прикупа», по умолчанию
       выключенная: заявить мизер можно только в торговле и только
       первым своим словом. Объявить его тут задним числом нельзя. */
    var misOK = K.isMiser(g.high) || !!g.o.miserWidow;
    for (var n = min; n < K.BIDS.length; n++) {
      if (K.isMiser(n) && !misOK) continue;
      var v = bidValue(h, n, pos);
      if (v > bestV) { bestV = v; best = n; }
    }
    return { bid: best };
  }

  /* ---------- вист ----------
     Вопрос не «сильна ли карта», а «дешевле ли спасовать». При
     ответственном висте пас иногда дороже виста: играющий пишет
     пулю даром, а это чистый минус всем за столом. */
  /* Сколько взяток берёт вистующий, уходя «за свои» — та же таблица,
     что в движке. Боту она нужна, чтобы понимать, чем кончится его
     собственный пас. */
  var AWAY_T = { 6: 2, 7: 2, 8: 1 };

  function chooseWhist(g, p, cfg) {
    if (g.pending.forced) return { whist: 'W' };
    if (K.isMiser(g.contract)) return { whist: 'W' };      // мизер ловят всегда

    var pr = K.price(g.contract), need = g.need, trump = g.trump, share = g.seats.length - 1;
    var others = g.whisters.filter(function (q) { return q !== p; });
    var saidW = others.filter(function (q) { return g.whist[q] === 'W' || g.whist[q] === 'H'; }).length;
    var saidP = others.filter(function (q) { return g.whist[q] === 'P'; }).length;

    var lvl = K.tricksOf(g.contract);
    var quota = (g.o.whistQuota && g.o.whistQuota[lvl] != null)
      ? g.o.whistQuota[lvl] : Math.max(0, 10 - need);

    /* ---------- главное: слово напарника ещё не сказано ----------

       Первым говорит тот, кто сидит раньше, и он решает вслепую. Раньше
       он молча считал, что напарник вистовать БУДЕТ: делил норму пополам
       и не брал в расчёт, что игра может вообще не состояться. Обе
       ошибки тянули в одну сторону — вистовать. Поединок большинством
       это и показал: «вистовать реже» выигрывало под восемь десятков
       вистов за дюжину сдач — цифра, которой в честной модели быть не
       может.

       Поэтому считаем ОБА случая и смешиваем их по тому, как часто
       напарник и правда вистует на этой высоте (PARTNER_W, намерено
       calibpw.js). Когда слово уже сказано, смесь вырождается в один из
       случаев сама. */
    var pw = (saidW > 0) ? 1 : (saidP > 0 ? 0
      : (PARTNER_W[lvl] != null ? PARTNER_W[lvl] : 0.5));
    var join = (cfg && cfg.join != null) ? cfg.join : JOIN;

    var hw = (cfg && cfg.hisw != null) ? cfg.hisw : HISW;
    var his = pr / share * hw;              // его пуля в моих очках

    var mu = DEF_A + DEF_B * E.play(g.hands[p], trump);

    /* Напарник вистует. Игра состоится в любом случае, и моё слово
       меняет ровно две вещи: мои висты и мою ответственность. Ехать
       зайцем можно — но тогда и напарник в следующий раз поедет. */
    function evWith() {
      /* На восьмерной и выше вся гора за недобор на ВТОРОМ сказавшем
         «вист» — значит, если напарник уже вистовал, второй это я. */
      var owed = (lvl >= (g.o.secondWhistBlame || 8) && saidW > 0)
        ? quota : Math.floor(quota / 2);
      var dist = normDist(mu, DEF_SD), ev = 0, k;
      for (k = 0; k <= 10; k++) {
        if (dist[k] < 1e-4) continue;
        ev += dist[k] * (VIST * pr * k -
          (g.o.whistResp ? pr * Math.max(0, owed - k) * GORA : 0));
      }
      /* ---------- пас не бесплатный ----------

         Тут стоял ноль: «напарник вистует, игра состоится, моё слово
         меняет только мои висты». Это неверно, и Ник назвал чем именно:
         «а то отпустят без своих — висты запишет только тот, кто
         вистовал, пасующий ничего не возьмёт, а это ему в минус».

         Оставшись один, напарник выбирает из двух путей, и они для меня
         разные:

           уйдёт ЗА СВОИ — розыгрыша не будет вовсе, играющий запишет
             пулю, а я не напишу НИЧЕГО: правило прямо говорит, что
             пасовавший не пишет. Это тот же минус, что и когда молчат
             оба;
           сыграет в СВЕТЛУЮ — карман защиты делится пополам по
             джентльменскому висту, и половина моя даром, без спроса за
             норму.

         Что он выберет, считается ровно как считает он сам: уход даёт
         ему фиксированные `away` взяток, светлая — сколько возьмут обе
         руки. Отсюда и цена моего паса. */
      var pairE = 10 - (need + (DPRIOR[need] || 0));      // сколько возьмёт защита
      var away = AWAY_T[lvl];
      var vPass;
      if (away != null && pairE <= away) vPass = -his;     // уйдёт за свои — мне ноль
      else vPass = (g.o.gentleWhist === false) ? 0 : VIST * pr * pairE / 2;
      /* Ключ для поединка: вернуть старую оценку, где пас стоил ровно
         ноль. Нужен, чтобы сравнить модели, а не верить на слово. */
      if (cfg && cfg.freeRide) vPass = 0;
      return { vist: ev + join, pass: vPass };
    }

    /* Напарник пасует. Вистовать придётся одному — но НЕ одной рукой:
       он кладёт карты на стол, и я играю за двоих. Это и есть ответ на
       вопрос, который раньше стоял неправильно. Норма спрашивается с
       меня целиком, зато и взятки считаются по ОБЕИМ рукам: всё, что не
       взял играющий, взяла защита, а защита — это я.

       Раньше тут стояла надбавка к своей руке («напарник помогает
       зряче», ×1.22) — догадка вместо правила. Из-за неё норму в четыре
       взятки бот примерял к одной своей руке, вист выглядел
       самоубийством, и защита пропадала. Теперь считается то, что
       считается за столом: сколько останется от десяти.

       А если промолчу и я — игра не состоится вовсе, и играющий пишет
       пулю даром. */
    function evAlone() {
      var dist = normDist(mu, DEF_SD);
      var mBar = (10 - need - (DPRIOR[need] || 0)) / 2;
      var ev = 0, k, t;
      for (k = 0; k <= 10; k++) {
        if (dist[k] < 1e-4) continue;
        var td = need + (DPRIOR[need] || 0) - BETA * (k - mBar);
        var dt = normDist(td, DSD[need] || 1.2);
        for (t = 0; t <= 10; t++) {
          if (dt[t] < 1e-4) continue;
          var w = dist[k] * dt[t], pair = 10 - t, v;
          v = VIST * pr * pair;                  // висты за обе руки пишет вистующий
          if (t >= need) {                       // вытянул
            v -= his;
            if (g.o.whistResp) v -= pr * Math.max(0, quota - pair) * GORA;
          } else {                               // сел
            v += pr * (need - t) * GORA / share;
          }
          ev += w * v;
        }
      }
      return { vist: ev, pass: -his };
    }

    var a = (pw > 0) ? evWith() : null, b = (pw < 1) ? evAlone() : null;
    var evVist = (a ? pw * a.vist : 0) + (b ? (1 - pw) * b.vist : 0);
    var evPass = (a ? pw * a.pass : 0) + (b ? (1 - pw) * b.pass : 0);

    var v2 = evVist - evPass + (cfg && cfg.whistBias || 0);
    if (g.o.halfWhist && v2 > 0 && v2 < 0.3) return { whist: 'H' };
    return { whist: v2 > 0 ? 'W' : 'P' };
  }

  /* ---------- ход ---------- */

  function rndOf(g) {
    return g.botRnd || (g.botRnd = (function () {
      var s = 123456789;
      return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
    })());
  }

  /* Точный выбор карты: подкидываем невидимое, решаем каждый расклад
     до конца, усредняем. Карта, которая в среднем лучше — та и идёт. */
  function exactCard(g, p, legal, cfg) {
    var pool = unseen(g, p), vd = voids(g), rnd = rndOf(g);
    var seats = g.seats, si = {}, i;
    for (i = 0; i < seats.length; i++) si[seats[i]] = i;
    var need = ghostNeed(g, p, seats), total = 0;
    for (var nk in need) total += need[nk];
    if (total !== pool.length) return null;          // модель разъехалась — не гадаем

    var declSeat = g.pass ? p : g.declarer;
    var mini = !g.pass && K.isMiser(g.contract);
    var trump = g.trump ? K.SUITS.indexOf(g.trump) : -1;
    var trickPre = g.cur.map(function (x) { return { p: si[x.p], ci: S.bit(x.c) }; });
    var sum = [], cnt = 0;
    for (i = 0; i < legal.length; i++) sum.push(0);

    var stop = now() + (cfg.ms || 0);
    for (var s = 0; s < cfg.mc; s++) {
      if (s >= 2 && now() > stop) break;
      var got = deal(pool, need, vd, rnd);
      var base = [0, 0, 0];
      knownSeats(g, p).forEach(function (q3) { base[si[q3]] = S.maskOf(g.hands[q3]); });
      for (var q2 in got) if (q2 !== 'dead') base[si[q2]] = S.maskOf(got[q2]);
      for (i = 0; i < legal.length; i++) {
        var ci = S.bit(legal[i]), m = base.slice();
        m[si[p]] = (m[si[p]] ^ (1 << ci)) >>> 0;
        var tr = trickPre.concat([{ p: si[p], ci: ci }]);
        var nxt, r;
        if (tr.length === seats.length) {
          /* Взятка закрылась прямо этой картой — считаем её сами и
             отдаём ход победителю. Решателю остаётся чистая позиция. */
          var w = trickWinner(tr, trump);
          var mine = (w === si[declSeat]) ? 1 : 0;
          r = mine + S.solve(m, si[declSeat], trump, w, { mini: mini }).tricks;
        } else {
          nxt = si[g.after(p)];
          r = S.solve(m, si[declSeat], trump, nxt, { mini: mini, trick: tr }).tricks;
        }
        /* Решатель считает взятки играющего. Мне нужны СВОИ: если я не
           играющий, мои — это то, что не досталось ему, пополам с
           напарником; но сравнивать хватит и знака. */
        sum[i] += (p === declSeat) ? r : -r;
      }

      counts: (g.hands || []).map(function (h) { return h.length; }),
      dropN: (g.drop || []).length,
      /* Карточки разбойника — общее знание: за столом их видно всем, и
         без них гость не нарисует ни своей графы, ни чужого выбора. */
      sheet: g.sheet || null,
      /* Тёмная: кто уже заглянул в карты и кто играет вслепую. Без
         этого гость не поймёт, предлагать ему выбор или нет. */
      seen: g.seen || null, dark: !!g.dark, darkBy: (g.darkBy != null ? g.darkBy : -1),
      /* Светлая: открытая рука лежит на столе лицом вверх — это общее
         знание, и гостю она нужна целиком, а не числом карт. */
      light: !!g.light, lightBy: (g.lightBy != null ? g.lightBy : -1),
      open: g.open || [],
      openHands: (g.light && g.open) ? g.open.map(function (q) {
        return (g.hands[q] || []).slice();
      }) : null,
      /* Прикуп уезжает гостям только когда он и так открыт: взял его
         играющий или роспись вскрывает его на распасах. */
      widow: (g.pass && g.o && g.o.passWidow) ? g.widow : null,
      lastTrick: (g.tricks && g.tricks.length) ? g.tricks[g.tricks.length - 1] : null,
      tricksN: (g.tricks || []).length,
      faces: g.faces || null, lvl: g.lvl || 2, stats: g.stats || null
    };
  }
  /* Что видит только один. Своя рука, свой прикуп (если он у него) и
     свой вопрос. Чужой вопрос приходит без подробностей: видно, что
     человек думает, но не над чем. */
  function privState(g, seat) {
    var pd = null;
    if (g.pending) {
      if (g.pending.p === seat || g.pending.type === 'next') pd = g.pending;
      else pd = { type: g.pending.type, p: g.pending.p, hand: g.pending.hand };
    }
    return {
      hand: (g.hands && g.hands[seat]) || [],
      widow: (seat === g.declarer && !g.pass) ? (g.widow || []) : null,
