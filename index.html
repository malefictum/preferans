    g.hands[ME].forEach(function (c) {
      var d = el('div', 'card');
      /* Масти разделены зазором. На сплошном веере в десять карт глаз
         каждый раз пересчитывает, где кончились пики; с зазором рука
         читается сразу — и мимо нужной масти уже не ткнёшь. */
      if (prevSuit !== null && c.s !== prevSuit) d.classList.add('gap');
      prevSuit = c.s;
      d.innerHTML = ART.faceHTML(c);
      d.dataset.id = K.id(c);
      if (myPlay) d.classList.add(legal.indexOf(K.id(c)) >= 0 ? 'playable' : 'dead');
      /* Ходим за открытую руку — свой веер сейчас не при делах, и это
         должно быть видно, а не выясняться щелчками. */
      else if (g.pending && g.pending.type === 'play' && g.pending.p === ME) d.classList.add('dead');
      if (myDrop) {
        d.classList.add('playable');
        /* Снос втёмную: двенадцать рубашек, тычешь в две. Показать
           карты тут нельзя — весь смысл тёмной в том, что ты их не
           видел. */
        if (g.pending.blind) { d.className = 'card back dk playable'; d.innerHTML = ''; }
        if (dropPick.indexOf(K.id(c)) >= 0) d.classList.add('sel');
      }
      if (selected === K.id(c)) d.classList.add('sel');
      h.appendChild(d);
    });
  }
  function hint(t) { var e = $('#hint'); if (e) e.textContent = t || ''; }

  /* Есть ли у меня прямо сейчас выбор «смотреть или втёмную».
     Только в торговле, только пока не заглянул, и только если роспись
     тёмную вообще допускает. */
  function darkChoice() {
    return !!(g && g.o && g.o.dark && !g.pass && g.seen && !g.seen[ME] &&
      g.pending && g.pending.type === 'bid' && g.seats && g.seats.indexOf(ME) >= 0);
  }

  /* ============================================================
     РАСЧЕРЧЕННАЯ ПУЛЬКА

     Счёт в преферансе пишут не таблицей, а фигурой, и это не
     украшение: игрок держит её в голове именно такой. Прямоугольник,
     диагонали из углов, круг посередине, три пояса от центра наружу:

         ближний к кругу — ГОРА
         средний         — ПУЛЯ
         внешний         — ПОЛЕ ВИСТОВ, поделённое по соперникам

     У каждого свой сектор. Втроём секторов три, вчетвером четыре —
     фигура перестраивается под состав стола.

     Рисуем вектором, а не картинкой: одна и та же фигура должна быть
     одинаково чёткой и в боковой панели размером с ладонь, и на весь
     экран по клику.

     Маленькая фигура показывает итоги. Большая — саму запись: на
     бумаге в пульку пишут столбиком, и последнее число и есть
     текущее. Столбик и показываем.
     ============================================================ */

  // история записей: по игроку — что и когда записано
  var hist = null;
  function histReset() {
    hist = [];
    for (var i = 0; i < g.N; i++) {
      var v = [];
      for (var j = 0; j < g.N; j++) v.push([]);
      hist.push({ pool: [], gora: [], vist: v });
    }
  }
  function histAdd(r) {
    if (!hist || hist.length !== g.N) histReset();
    var no = g.handNo;
    for (var i = 0; i < g.N; i++) {
      if (r.pool[i]) hist[i].pool.push({ n: r.pool[i], h: no, w: K.bidShort(r.contract) });
      if (r.mountain[i]) {
        var why = r.pass ? 'распас'
          : (r.why && r.why.podsad[i]) ? 'подсад'
          : (r.why && r.why.whistShort[i]) ? 'недобор на висте' : '';
        hist[i].gora.push({ n: r.mountain[i], h: no, w: why });
      }
      for (var j = 0; j < g.N; j++) {
        var was = hist[i].vist[j].length
          ? hist[i].vist[j][hist[i].vist[j].length - 1].t : 0;
        if (g.whists[i][j] > was)
          hist[i].vist[j].push({ n: g.whists[i][j] - was, t: g.whists[i][j], h: no });
      }
    }
  }

  /* ---------- геометрия ----------
     Луч из центра упирается в квадрат, а не в окружность: у пульки
     внешняя граница прямая. Поэтому точка на «радиусе» s — это точка
     пересечения луча со стороной квадрата половинного размера s. */
  function ptSq(cx, cy, ang, s) {
    var dx = Math.cos(ang), dy = Math.sin(ang);
    var t = s / Math.max(Math.abs(dx), Math.abs(dy));
    return [cx + dx * t, cy + dy * t];
  }
  function norm(a) { while (a < 0) a += Math.PI * 2; while (a >= Math.PI * 2) a -= Math.PI * 2; return a; }
  // углы четырёх углов квадрата — на них граница ломается
  var CORN = [Math.PI / 4, Math.PI * 3 / 4, Math.PI * 5 / 4, Math.PI * 7 / 4];
  function arcPts(cx, cy, a1, a2, s) {
    var out = [ptSq(cx, cy, a1, s)], k;
    for (k = 0; k < 4; k++) {
      var c = CORN[k], d = norm(c - a1);
      if (d > 1e-6 && d < norm(a2 - a1) - 1e-6) out.push([c, ptSq(cx, cy, c, s)]);
    }
    out = [out[0]].concat(out.slice(1).sort(function (x, y) {
      return norm(x[0] - a1) - norm(y[0] - a1);
    }).map(function (x) { return x[1]; }));
    out.push(ptSq(cx, cy, a2, s));
    return out;
  }
  function cell(cx, cy, a1, a2, sIn, sOut) {
    var inn = arcPts(cx, cy, a1, a2, sIn), out = arcPts(cx, cy, a1, a2, sOut);
    var pts = inn.concat(out.slice().reverse());
    return pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
  }

  /* Углы секторов.

     Вчетвером граница идёт по диагоналям квадрата — ровно как на
     бумаге, четыре треугольника. Втроём иначе: вверх из центра и в два
     нижних угла, так что сверху двое, снизу третий. Не «поделить круг
     на три», а именно так — иначе фигура перестаёт быть узнаваемой.

     Ось Y на экране смотрит вниз, поэтому угол 0 — вправо, π/2 — вниз. */
  function sectors(n) {
    if (n === 4) {
      return [[Math.PI * 3 / 4, Math.PI * 5 / 4],     // лево
              [Math.PI * 5 / 4, Math.PI * 7 / 4],     // верх
              [Math.PI * 7 / 4, Math.PI * 9 / 4],     // право
              [Math.PI / 4, Math.PI * 3 / 4]];        // низ
    }
    return [[Math.PI * 3 / 4, Math.PI * 3 / 2],       // левый верх
            [Math.PI * 3 / 2, Math.PI * 2 + Math.PI / 4], // правый верх
            [Math.PI / 4, Math.PI * 3 / 4]];          // низ
  }

  /* Кто в каком секторе. Своё место внизу — как за столом: игрок ищет
     себя там, где сидит. */
  function seatOrder() {
    var o = others();
    if (g.N === 4) return [o[0], o[1], o[2], ME];
    return [o[0], o[1], ME];
  }

  function tot(list) { return list.reduce(function (a, x) { return a + x.n; }, 0); }

  /* Как пишут пульку на бумаге: не итог, а РЯД нарастающим итогом через
     точку — 3.13.31.39.51.67. По такой записи видно и сколько всего, и
     сколько было на каждой сдаче, и сколько сдач сыграно. В маленькой
     фигуре ряд не помещается, там пишется только последнее число — оно
     и есть текущий итог. */
  function serie(list) {
    var out = [], sum = 0, i;
    for (i = 0; i < list.length; i++) { sum += list[i].n; out.push(sum); }
    return out;
  }
  /* Ряд делится надвое: хвост истории и последнее число. Последнее —
     текущий итог, и на бумаге его выделяют: глаз должен находить его
     сразу, а история пусть не мешает. */
  function cellNum(list, big) {
    var r = serie(list);
    if (!r.length) return null;
    return { head: big ? r.slice(0, -1).join('.') : '', last: String(r[r.length - 1]) };
  }
  /* Вдоль какой стороны квадрата стоит клетка: у боковых число пишется
     столбиком, у верхних и нижних — строкой. Ровно так и от руки. */
  function upright(cx, cy, pt) {
    return Math.abs(pt[0] - cx) <= Math.abs(pt[1] - cy);
  }
  function numSVG(cls, cx, cy, pt, num) {
    if (!num) return '';
    var x = pt[0].toFixed(1), y = pt[1].toFixed(1);
    var rot = upright(cx, cy, pt) ? '' : ' transform="rotate(-90 ' + x + ' ' + y + ')"';
    var long = (num.head.length + num.last.length + 1) > 6;
    return '<text class="' + cls + (num.head ? ' ser' : '') + (long ? ' tight' : '') +
      '" x="' + x + '" y="' + y + '"' + rot + '>' +
      (num.head ? esc(num.head) + '.' : '') +
      '<tspan class="lastv">' + esc(num.last) + '</tspan></text>';
  }

  function pulkaSVG(size, big) {
    /* Запас по краям нужен только большой фигуре: там снаружи стоят
       имена. В маленькой ничего снаружи нет — и поля ей ни к чему,
       пусть занимает всё место, какое есть. */
    /* Запас под имена в большой фигуре: они пишутся снаружи слева и
       справа, и им нужно место. Раньше запас был со всех четырёх сторон
       одинаковый, и фигура из-за этого не разворачивалась в ширину. */
    /* Запас под имена: они пишутся снаружи фигуры, и им нужно место.
       Маленькой фигуре его раньше не давали вовсе — там стояли кружки
       внутри; теперь подпись снаружи и ей тоже нужны поля. */
    /* Большая фигура заполняет поле, а не сидит в нём островком. Раньше
       она занимала 63% окна: поле было квадратным, запас под имена
       стоял со всех четырёх сторон одинаковый, да ещё внешний радиус
       был 0.40 от стороны вместо половины. Ник: «переориентируй, а то
       ничего не видно в зум-версии».

       Теперь запас РАЗНЫЙ по осям: слева и справа он нужен под имена,
       сверху и снизу — почти нет. Окно шире, чем выше, и лишняя ширина
       уходит ровно туда, где она нужна. */
    var S = size;
    var PADX = S * (big ? 0.17 : 0.085), PADY = S * (big ? 0.08 : 0.085);
    var W = S + PADX * 2, H = S + PADY * 2;
    var cx = W / 2, cy = H / 2;
    var k = big ? 1.25 : 1;              // большая — во всё поле, маленькая как была
    var rOut = S * 0.40 * k, rVist = S * 0.295 * k, rPool = S * 0.19 * k, rGora = S * 0.10 * k;
    var order = seatOrder(), secs = sectors(g.N);
    var parts = [];

    parts.push('<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="none"/>');

    order.forEach(function (p, si) {
      var a1 = secs[si][0], a2 = secs[si][1], mid = (a1 + a2) / 2;
      var mine = (p === ME);
      // гора
      parts.push('<polygon class="pk-g' + (mine ? ' pk-me' : '') + '" data-c="g:' + p +
        '" points="' + cell(cx, cy, a1, a2, rGora, rPool) + '"/>');
      // пуля
      parts.push('<polygon class="pk-p' + (mine ? ' pk-me' : '') + '" data-c="p:' + p +
        '" points="' + cell(cx, cy, a1, a2, rPool, rVist) + '"/>');
      // поле вистов — по ячейке на каждого соперника
      var foes = [];
      for (var q = 0; q < g.N; q++) if (q !== p) foes.push(q);
      var step = (a2 - a1) / foes.length;
      foes.forEach(function (q, fi) {
        var b1 = a1 + step * fi, b2 = b1 + step;
        parts.push('<polygon class="pk-v' + (mine ? ' pk-me' : '') + '" data-c="v:' + p + ':' + q +
          '" points="' + cell(cx, cy, b1, b2, rVist, rOut) + '"/>');
        var vm = (b1 + b2) / 2, pv = ptSq(cx, cy, vm, (rVist + rOut) / 2);
        /* В ячейке — только числа. Подписей «на кого» в пульке нет: чей
           это вист, видно по месту. */
        parts.push(numSVG('pk-num sm', cx, cy, pv, cellNum(hist[p].vist[q], big)));
      });
      /* Числа. Гора уходит на четверть сектора в сторону: в самой
         середине, у центра, стоит портрет игрока, и число иначе
         ложится прямо на него. */
      var gAng = mid - (a2 - a1) * 0.26;
      var pg = ptSq(cx, cy, gAng, (rGora + rPool) / 2);
      var pp = ptSq(cx, cy, mid, (rPool + rVist) / 2);
      parts.push(numSVG('pk-num gora', cx, cy, pg, cellNum(hist[p].gora, big)));
      parts.push(numSVG('pk-num pool', cx, cy, pp, cellNum(hist[p].pool, big)));
      /* Чей это сектор — видно у самого центра, в пересечении линий:
         так пульку и подписывают, инициалами. У нас вместо инициала
         портрет, а инициал остаётся запасным вариантом. */
      /* Портретов в клетках нет ни в большой фигуре, ни в маленькой.
         Ник: «в пуле какие-то кружочки, убери их — они путают; ты хотел
         туда портреты, но неудобно» и, про боковую панель, «убери круги
         тоже, поставь туда, где я обозначил» — то есть подписью снаружи,
         слева, справа и снизу. Так пульку и подписывают на бумаге.

         Код рисования портрета оставлен мёртвым намеренно: если решим
         вернуть — возвращать нечего заново придумывать. */
      var pc = ptSq(cx, cy, mid, rGora * 1.62), R = S * 0.042 * k;
      var fi = (g.faces && g.faces[p] != null) ? g.faces[p] : -1;
      if (true) {
        /* ничего не рисуем — подпись снаружи фигуры */
      } else if (fi >= 0 && ART.hasFaces && ART.hasFaces()) {
        parts.push('<clipPath id="pkc' + si + '"><circle cx="' + pc[0].toFixed(1) +
          '" cy="' + pc[1].toFixed(1) + '" r="' + R.toFixed(1) + '"/></clipPath>');
        parts.push('<image href="' + ART.faceUrl(fi) + '" x="' + (pc[0] - R).toFixed(1) +
          '" y="' + (pc[1] - R).toFixed(1) + '" width="' + (R * 2).toFixed(1) +
          '" height="' + (R * 2).toFixed(1) + '" preserveAspectRatio="xMidYMid slice" clip-path="url(#pkc' + si + ')"/>');
        parts.push('<circle class="pk-face' + (mine ? ' me' : '') + '" cx="' + pc[0].toFixed(1) +
          '" cy="' + pc[1].toFixed(1) + '" r="' + R.toFixed(1) + '"/>');
      } else {
        parts.push('<circle class="pk-ini' + (mine ? ' me' : '') + '" cx="' + pc[0].toFixed(1) +
          '" cy="' + pc[1].toFixed(1) + '" r="' + R.toFixed(1) + '"/>');
        parts.push('<text class="pk-init" x="' + pc[0].toFixed(1) + '" y="' + (pc[1] + 0.5).toFixed(1) +
          '">' + esc(initials(g.names[p])) + '</text>');
      }
      /* Имя снаружи фигуры — теперь и в маленькой тоже, вместо кружка.
         В мини оно короче: там колонка узкая, и длинное имя её распирает. */
      var pn = ptSq(cx, cy, mid, rOut * (big ? 1.13 : 1.16));
      parts.push('<text class="pk-who' + (mine ? ' me' : '') + (big ? '' : ' mini') +
        '" x="' + pn[0].toFixed(1) + '" y="' + pn[1].toFixed(1) + '">' +
        esc(big ? short(g.names[p]) : initials(g.names[p])) + '</text>');
    });

    // разделительные лучи и границы поясов
    order.forEach(function (p, si) {
      [secs[si][0], secs[si][1]].forEach(function (a) {
        var i1 = ptSq(cx, cy, a, rGora), o1 = ptSq(cx, cy, a, rOut);
        parts.push('<line class="pk-ray" x1="' + i1[0].toFixed(1) + '" y1="' + i1[1].toFixed(1) +
          '" x2="' + o1[0].toFixed(1) + '" y2="' + o1[1].toFixed(1) + '"/>');
      });
      // и перегородки внутри поля вистов
      var foes2 = [];
      for (var q2 = 0; q2 < g.N; q2++) if (q2 !== p) foes2.push(q2);
      var st2 = (secs[si][1] - secs[si][0]) / foes2.length;
      for (var f2 = 1; f2 < foes2.length; f2++) {
        var a2 = secs[si][0] + st2 * f2;
        var i2 = ptSq(cx, cy, a2, rVist), o2 = ptSq(cx, cy, a2, rOut);
        parts.push('<line class="pk-ray thin" x1="' + i2[0].toFixed(1) + '" y1="' + i2[1].toFixed(1) +
          '" x2="' + o2[0].toFixed(1) + '" y2="' + o2[1].toFixed(1) + '"/>');
      }
    });
    [rGora, rPool, rVist, rOut].forEach(function (s2) {
      var pts = arcPts(cx, cy, 0, Math.PI * 2 - 1e-9, s2);
      parts.push('<polygon class="pk-band" points="' +
        pts.map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' ') + '"/>');
    });
    parts.push('<circle class="pk-mid" cx="' + cx + '" cy="' + cy + '" r="' + (rGora * 0.92).toFixed(1) + '"/>');
    parts.push('<text class="pk-mid-t" x="' + cx + '" y="' + cy + '">' + g.target + '</text>');

    return '<svg class="pulka' + (big ? ' big' : '') + '" viewBox="0 0 ' + W + ' ' + H +
      '" width="100%" preserveAspectRatio="xMidYMid meet">' + parts.join('') + '</svg>';
  }
  /* Короткое имя для фигуры. Режем по слову, а не по буквам: «Наум с
     Фонтана» должен стать «Наум», а не «Наум с .» — обрубок читается
     хуже, чем просто имя. */
  function short(n) {
    n = String(n || '').trim();
    if (n.length <= 9) return n;
    var w = n.split(/\s+/)[0];
    return w.length <= 11 ? w : w.slice(0, 10) + '…';
  }
  /* Инициал — первая буква имени, и вторая, если имя из двух слов:
     «Боря с Фонтана» → «БФ», «Сеня» → «С». */
  function initials(n) {
    var w = String(n || '?').trim().split(/\s+/);
    var a = (w[0] || '?').charAt(0).toUpperCase();
    if (w.length > 1 && w[1]) {
      var b2 = w[1].charAt(0);
      if (b2 === b2.toUpperCase() && /[А-ЯA-Z]/.test(b2)) return a + b2;
    }
    return a;
  }

  /* ============================================================
     КНИЖКА СДАЧИ

     Справа от стола под пулькой много воздуха, а в голове у игрока в
     этот момент три вещи: кто как торговался, что лежало в прикупе и
     сколько кто взял. Всё это движок знает — оставалось перестать
     прятать. Журнал для этого не годится: он течёт, а тут нужна
     табличка, на которую смотрят посреди розыгрыша.
     ============================================================ */
  var hb = null;
  /* Строка движка, которую стол уже написал по-своему. */
  var sayMute = null;
  /* Ход партии по сдачам — для окна итогов. Ник: «неплохо чтобы ты в
     конце в финальном пуле показывал, какие игры были сыграны за партию
     в каждом раунде». Заодно это чинит и вторую его находку: когда пуля
     закрывается, окно последней сдачи не успевает показаться — движок
     сразу объявляет конец. Теперь последняя сдача не пропадает: она
     стоит в этом же списке, последней строкой. */
  var rounds = [];
  /* Короткое имя игрока для книжки. Отдельно от `short()`, которая
     режет ДЛИННОЕ имя для пульки: одинаковые названия однажды уже
     затёрли друг друга, и подписи на пульке превратились в «на». */
  function who(p) {
    var n = (g.names && g.names[p]) || '';
    return n.split(/\s+/)[0];
  }
  function hbReset(no) {
    hb = { no: no, bids: [], whist: [], contract: null, declarer: -1,
      widow: null, dark: false, slot: null, pass: false, lightOn: null };
  }
  function hbAdd(k, v) { if (hb) hb[k].push(v); }

  /* Книжка сдачи собирается по ходу — из событий. При возврате в
     сохранённую партию событий нет вовсе: стол рисуется по состоянию.
     Поэтому книжку тут складываем из того, что видно на столе. Полного
     хода торговли не восстановить (кто в каком порядке говорил — это
     история, а не состояние), но заявки, игра и вист на месте. */
  /* Одна строка ведомости: что это была за сдача и чем кончилась. */
  /* Номер сдачи берём из события: пока стол доигрывает анимацию,
     движок уже сдал следующую, и `g.handNo` тут врёт. */
  function roundRow(r, no) {
    if (!r) return null;
    var o = { no: no || g.handNo, pass: !!r.pass };
    if (r.pass) {
      o.what = 'распасы по ' + r.price;
      o.how = (r.seats || g.seats).map(function (p) { return r.taken[p]; }).join('/') +
        (r.passWin ? ' · выиграл ' + who(r.passWin[0]) : ' в гору');
      return o;
    }
    o.what = bidHTML(r.contract) + (r.dark ? ' втёмную' : r.noWidow ? ' с руки' : '');
    o.who = who(r.declarer);
    if (r.away) o.how = who(r.away.p) + ' ушёл за свои · +' + r.price + ' в пулю';
    else if (r.unwhisted) o.how = 'никто не вистовал · +' + r.price + ' в пулю';
    else if (r.made) o.how = 'сыграл' + (r.checked ? ' (проверка)' : '') +
      ' · +' + r.price + ' в пулю';
    else o.how = (K.isMiser(r.contract) ? 'взял ' + r.got : 'без ' + r.miss) +
      ' · ' + (r.price * r.miss) + ' в гору';
    return o;
  }
  /* Сдача может прийти дважды: списком из движка при `attach` и тут же
     событием, если хозяин прислал повтор с самого начала. Кладём по
     номеру — тогда порядок вызовов не важен. */
  function addRound(row) {
    if (!row) return;
    for (var i = 0; i < rounds.length; i++)
      if (rounds[i] && rounds[i].no === row.no) { rounds[i] = row; return; }
    rounds.push(row);
  }

  function roundsHTML() {
    var l = rounds.filter(Boolean);
    if (!l.length) return '';
    return '<div class="mcard rounds"><b>Как шла партия</b>' +
      '<div class="rlist">' + l.map(function (x) {
        return '<div class="rrow"><span class="rn">' + x.no + '</span>' +
          '<span class="rw">' + (x.who ? esc(x.who) + ' · ' : '') + x.what + '</span>' +
          '<span class="rh">' + esc(x.how) + '</span></div>';
      }).join('') + '</div></div>';
  }

  function hbFromState() {
    hbReset(g.handNo || 0);
    if (!g.seats) return;
    hb.pass = !!g.pass;
    var i, p;
    for (i = 0; i < g.seats.length; i++) {
      p = g.seats[i];
      if (g.bids && g.bids[p] !== undefined)
        hb.bids.push({ p: p, bid: g.bids[p], dark: !!(g.dark && g.darkBy === p),
          noWidow: !!(g.noWidowBy === p && g.noWidowBid === g.bids[p]) });
      else if (g.out && g.out.indexOf(p) >= 0) hb.bids.push({ p: p, bid: null });
    }
    if (g.contract != null) {
      hb.contract = g.contract; hb.declarer = g.declarer;
      hb.dark = !!(g.darkPlay && g.darkPlay()); hb.noWidow = !!g.noWidow;
    }
    for (i = 0; i < g.seats.length; i++) {
      p = g.seats[i];
      if (g.whist && g.whist[p]) hb.whist.push({ p: p, w: g.whist[p] });
    }
    if (g.widow && g.widow.length && (g.pass ? g.o.passWidow : false)) hb.widow = g.widow.slice();
  }

  /* Кружок взяток. Цвет — не украшение: красное значит «пока недобор»,
     зелёное «своё взял». На распасах и мизере всё наоборот, и это
     ровно то, за чем там следят. */
  function tricksRing() {
    if (!g.taken || !g.seats || dealing) return '';
    var miser = !g.pass && K.isMiser(g.contract);
    var lvl = (!g.pass && !miser) ? K.tricksOf(g.contract) : 0;
    var quota = (!g.pass && g.o.whistQuota && g.o.whistQuota[K.isMiser(g.contract) ? 8 : lvl]) || 0;
    var pairT = 0, i;
    if (!g.pass) for (i = 0; i < (g.whisters || []).length; i++) pairT += g.taken[g.whisters[i]];

    function cls(p) {
      if (g.pass) return g.taken[p] ? 'bad' : 'ok';           // на распасах взятка — беда
      if (p === g.declarer) {
        if (miser) return g.taken[p] ? 'bad' : 'ok';
        return g.taken[p] >= g.need ? 'ok' : 'bad';
      }
      if (miser) return 'n';                                   // защите на мизере считать нечего
      if (!quota) return 'n';
      if (g.whist && g.whist[p] !== 'W' && g.whist[p] !== 'H' && !g.light) return 'n';
      return pairT >= quota ? 'ok' : 'bad';
    }
    /* Места кружка — как на столе: свой внизу, соседи по бокам,
       четвёртый сверху. Иначе цифры придётся сопоставлять с именами. */
    var pos = {}, ot = others();
    pos[ME] = [60, 97];
    if (ot.length === 2) { pos[ot[0]] = [20, 62]; pos[ot[1]] = [100, 62]; }
    else { pos[ot[0]] = [20, 62]; pos[ot[1]] = [60, 26]; pos[ot[2]] = [100, 62]; }

    var mid = g.pass ? '—' : (miser ? '0' : g.need);
    var out = '<svg class="tring" viewBox="0 0 120 120">' +
      '<circle class="tr-o" cx="60" cy="60" r="30"/>' +
      '<text class="tr-mid" x="60" y="58">' + mid + '</text>' +
      '<text class="tr-lbl" x="60" y="70">' + (g.pass ? 'распас' : 'надо') + '</text>';
    g.seats.forEach(function (p) {
      var c = pos[p]; if (!c) return;
      out += '<text class="tr-n ' + cls(p) + '" x="' + c[0] + '" y="' + c[1] + '">' +
        g.taken[p] + '</text>';
    });
    return out + '</svg>';
  }

  /* Ход торговли строкой: кто что сказал, по порядку. Пас — серым,
     заявка — золотом, тёмная — отдельной пометкой. */
  /* Заявка с цветной мастью: «6♠» чёрным, «7♥» красным. Значок масти
     вынесен в отдельный элемент, иначе покрасить его нечем — он часть
     той же строки, что и число. */
  function bidHTML(n) {
    if (n == null) return 'пас';
    if (K.isMiser(n)) return 'мизер';
    var b = K.bid(n);
    if (!b) return esc(K.bidShort(n));
    if (b.suit === 'NT') return b.tricks + 'БК';
    return b.tricks + '<s class="su-' + b.suit + '">' + K.SUIT_CH[b.suit] + '</s>';
  }

  function bidsHTML() {
    if (!hb || (!hb.bids.length && !hb.whist.length)) return '';
    var out = '';
    if (hb.bids.length) {
      out += '<div class="hbrow"><b>торг</b><span>' + hb.bids.map(function (x) {
        return '<i class="' + (x.bid == null ? 'ps' : 'bd') + '">' + esc(who(x.p)) + ' ' +
          bidHTML(x.bid) + (x.bid == null ? '' :
            (x.dark ? '⚫' : x.noWidow ? ' ·с руки' : '')) + '</i>';
      }).join('') + '</span></div>';
    }
    if (hb.contract != null) {
      out += '<div class="hbrow"><b>игра</b><span><i class="bd">' + esc(who(hb.declarer)) +
        ' ' + bidHTML(hb.contract) +
        (hb.dark ? ' втёмную, цена ×2' : hb.noWidow ? ' без прикупа, цена ×2' : '') +
        '</i></span></div>';
    }
    if (hb.whist.length) {
      out += '<div class="hbrow"><b>вист</b><span>' + hb.whist.map(function (x) {
        return '<i class="' + (x.w === 'P' ? 'ps' : 'bd') + '">' + esc(who(x.p)) + ' ' +
          (x.w === 'W' ? 'вист' : x.w === 'H' ? 'полвиста' : 'пас') + '</i>';
      }).join('') + '</span></div>';
    }
    /* Светлая — отдельной строкой и словами. В светлую на стол ложатся
       ОБЕ руки защиты; разница лишь в том, ведёт ли их один человек
       (вистовал один, напарник спасовал) или каждый ходит своей. */
    if (g.light && g.open && g.open.length && g.lightBy >= 0) {
      out += '<div class="hbrow txt"><b>светлая</b><span>карты защиты на столе, ' +
        esc(who(g.lightBy)) + ' ведёт обе руки</span></div>';
    } else if (g.light && g.open && g.open.length) {
      out += '<div class="hbrow txt"><b>светлая</b><span>карты на столе: ' +
        g.open.map(function (q) { return esc(who(q)); }).join(', ') + '</span></div>';
    } else if (hb && hb.lightOn === false) {
      out += '<div class="hbrow txt"><b>вист</b><span>в закрытую</span></div>';
    }
    return out;
  }

  /* Прикуп — только если он и так открыт: свой или вскрытый росписью
     на распасах. Чужой прикуп тайна, и панель её не выдаёт. */
  function widowHTML() {
    if (!g.widow || !g.widowOpen) return '';
    var l = g.widow.filter(function (c) { return c && c.r; });
    if (!l.length) return '';
    return '<div class="hbrow txt"><b>прикуп</b><span class="hbw">' + l.map(function (c) {
      return '<div class="card">' + ART.faceHTML(c) + '</div>';
    }).join('') + '</span></div>';
  }

  function handBox() {
    if (!g.seats || !g.taken) return '';
    var head = 'Сдача ' + g.handNo;
    if (g.pass) head += ' · распасы по ' + (g.price || 1);
    else if (g.contract != null) head += ' · ' + K.bidShort(g.contract) + ' · играет ' + who(g.declarer);
    var body = bidsHTML() + widowHTML();
    return '<h4 class="hd">' + esc(head) + '</h4>' +
      '<div class="hbox">' + tricksRing() +
      '<div class="hbtxt">' + (body || '<span class="hbempty">торг ещё не начался</span>') + '</div>' +
      '</div>';
  }

  function drawScore() {
    var pane = $('#scpane');
    if (!pane || !g.pool) return;
    if (!hist || hist.length !== g.N) histReset();
    pane.innerHTML =
      '<div class="pkwrap" id="pkSmall">' + pulkaSVG(260, false) + '</div>' +
      '<div class="pklegend"><span class="lg gora">гора</span>' +
      '<span class="lg pool">пуля</span><span class="lg vist">висты</span></div>' +
      /* Пуля до десяти — И ПАРТИЯ ЖДЁТ ПОСЛЕДНЕГО. Пока это не написано,
         закрывшийся игрок не понимает, почему партия идёт дальше. */
      '<div class="sub">Пуля: до ' + g.target + ' у каждого</div>' +
      handBox();
    var w = pane.querySelector('#pkSmall');
    if (w) w.onclick = zoomPulka;
  }

  /* Зум — это та же самая пулька, только во весь экран. Цифры стоят в
     своих клетках, как на бумаге: пуля в поясе пули, гора в поясе горы,
     висты в своей ячейке. Никаких отдельных таблиц сбоку — иначе это
     уже не пулька, а ведомость.

     А вот ЧТО стоит за числом, на бумаге не видно: там пишут столбиком
     и зачёркивают. У нас лучше — щёлкни по клетке, и под фигурой ляжет
     вся её запись по сдачам. */
  function zoomPulka() {
    /* Два блока, как Ник нарисовал: фигура во всю ширину сверху, запись
       снизу. Крестик — в правом верхнем углу: кнопка «закрыть» внизу
       уезжала под скролл, и до неё приходилось домотать. */
    modal('<div class="zhead"><h3>Пулька</h3>' +
      '<button class="zx" id="pkClose" title="Закрыть">✕</button></div>' +
      '<div class="pkbig" id="pkBig">' + pulkaSVG(560, true) + '</div>' +
      '<div class="zfoot">' +
      '<div class="pkhint" id="pkHint">Нажмите на клетку — покажу, из чего сложилось.</div>' +
      '<div class="pkdet" id="pkDet"></div>' +
      '</div>',
      function (m) {
        m.querySelector('#pkClose').onclick = closeModal;
        m.querySelector('#pkBig').addEventListener('click', function (ev) {
          var t = ev.target.closest('[data-c]');
          if (!t) return;
          m.querySelectorAll('[data-c]').forEach(function (x) { x.classList.remove('pick'); });
          t.classList.add('pick');
          showCell(m, t.dataset.c);
        });
      }, { wide: true, zoom: true });
  }

  function showCell(m, key) {
    var a = key.split(':'), kind = a[0], p = +a[1];
    var list, title;
    if (kind === 'g') { list = hist[p].gora; title = 'Гора · ' + g.names[p]; }
    else if (kind === 'p') { list = hist[p].pool; title = 'Пуля · ' + g.names[p]; }
    else { var q = +a[2]; list = hist[p].vist[q]; title = 'Висты ' + g.names[p] + ' на ' + g.names[q]; }
    var hint = m.querySelector('#pkHint'), det = m.querySelector('#pkDet');
    hint.textContent = title;
    if (!list.length) { det.innerHTML = '<div class="pkempty">пусто — сюда ещё ничего не писали</div>'; return; }
    var run = 0;
    det.innerHTML = '<div class="pkrow head"><span class="pkh">сдача</span>' +
      '<span class="pkn">запись</span><span class="pkw">за что</span><span class="pkt">итого</span></div>' +
      list.map(function (x) {
        run += x.n;
        return '<div class="pkrow ' + (kind === 'g' ? 'gora' : kind === 'p' ? 'pool' : 'vist') + '">' +
          '<span class="pkh">' + x.h + '</span><span class="pkn">+' + x.n + '</span>' +
          '<span class="pkw">' + esc(x.w || '') + '</span><span class="pkt">' + run + '</span></div>';
      }).join('');
  }

  /* ---------- лестница торговли ----------
     Заявки идут снизу вверх, мизер стоит между семерной и восьмерной.
     Нельзя заказать ниже уже сказанного — такие клетки просто гаснут,
     а не ругаются после нажатия. */
  function bidPanel(min, canPass, onPick, noMiser) {
    var box = $('#bidbar');
    /* Панель прячется классом, а не стилем: в правилах у неё стоит
       display:none, и «убрать свой стиль» её не покажет. */
    box.classList.add('on');
    var g2 = el('div', 'bidgrid');
    g2.appendChild(el('b', '', canPass ? 'ваше слово' : 'окончательная игра'));
    K.BIDS.forEach(function (b) {
      if (K.isMiser(b.n)) return;
      var c = el('button', 'bcell');
      if (b.suit === 'NT') c.textContent = b.tricks + 'БК';
      else {
        /* Значок масти отдельным элементом — иначе его не покрасить: он
           часть той же надписи, что и число. */
        c.textContent = b.tricks;
        var sx = el('span', 'sx su-' + b.suit, K.SUIT_CH[b.suit]);
        c.appendChild(sx);
      }
      /* Гасим не по индексу, а по правилу: в торговле старшинство
         спрашивается у движка — мизер стоит выше восьмерной, и просто
         «индекс больше» тут не работает. На окончательной игре правило
         другое: не ниже заявленного. */
      c.disabled = canPass ? !(g.canBid && g.canBid(b.n, ME)) : (b.n < min);
      c.onclick = function () { onPick(b.n); };
      g2.appendChild(c);
      if (b.n === K.MISER - 1 && !noMiser) {
        var m = el('button', 'bcell miser', 'МИЗЕР');
        m.disabled = canPass
          ? !(g.canBid && g.canBid(K.MISER, ME))
          : (K.MISER < min || !(K.isMiser(g.high) || (g.o && g.o.miserWidow)));
        m.onclick = function () { onPick(K.MISER); };
        g2.appendChild(m);
      }
    });
    if (canPass) {
      var p = el('button', 'bcell pass', 'ПАС');
      p.onclick = function () { onPick(null); };
      g2.appendChild(p);
    } else if (noMiser) {
      var bk = el('button', 'bcell pass', '‹ передумал');
      bk.onclick = function () { askDark(); };
      g2.appendChild(bk);
    }
    box.innerHTML = ''; box.appendChild(g2);
  }
  function hideBid() { var b = $('#bidbar'); if (b) { b.classList.remove('on'); b.innerHTML = ''; } }

  /* Лестница заявок жива ровно пока ждут МОЕГО слова. Проверять это
     на одном пути мало: гостю состояние приезжает пачками, и панель
     успевала пережить свой вопрос — Ник видел живое «ВАШЕ СЛОВО»
     поверх чужого сноса. Поэтому проверка стоит в общей перерисовке,
     через которую проходит любое изменение стола. */
  function syncBidBar() {
    var b = $('#bidbar');
    if (!b || !b.classList.contains('on')) return;
    var q = g && g.pending;
    var mine = q && q.p === ME && (q.type === 'bid' || q.type === 'contract');
    if (!mine) hideBid();
  }

  function drawAll() { drawSeats(); drawTrick(); drawWidow(); drawHand(); drawMyDrop();
    drawScore(); drawInfo(); syncBidBar(); }

  /* ---------- свой снос ----------
     Две карты, которые я убрал из прикупа, лежат у моего места лицом
     вверх — но только для меня. Держать их в голове десять взяток
     невозможно, а помнить, что снёс, — половина розыгрыша: по сносу
     считается, что осталось у соперников. Чужой снос при этом остаётся
     тайной, как и положено. */
  function drawMyDrop() {
    var e = $('#mydrop'); if (!e) return;
    var l = (!g || g.pass || g.declarer !== ME) ? [] :
      (g.drop || []).filter(function (c) { return c && c.r; });
    if (!l.length) { e.className = ''; e.innerHTML = ''; return; }
    e.className = 'on';
    e.innerHTML = '<span class="dlbl">снос</span>' + l.map(function (c) {
      return '<div class="card">' + ART.faceHTML(c) + '</div>';
    }).join('');
  }
  function drawHandLater() { clearTimeout(handTimer); handTimer = setTimeout(drawHand, 40); }

  /* ============================================================
     СОБЫТИЯ ДВИЖКА

     Движок не рисует и не ждёт — он складывает события в очередь.
     Стол их проигрывает по одному, с паузами: карта должна успеть
     долететь, реплика — прочитаться. Пока очередь не кончилась,
     ходов ни у кого не спрашиваем.
     ============================================================ */
  function handleEvent(e, next) {
    switch (e.e) {

      case 'deal':
        dealing = true;
        hbReset(e.no);
        g.widowOpen = false; g.phaseAfterWidow = false;
        drawSeats(); drawInfo(); drawScore(); drawHand(); drawWidow();
        /* Разделитель сдач стол ставит сам: у движка это обычная строка
           «Сдача N. Сдаёт X.», а глазу нужна черта, по которой журнал
           делится на сдачи. Поэтому тут не дубль, а оформление — и
           движковую строку мы для этой сдачи гасим. */
        sayMute = 'Сдача ' + e.no + '. Сдаёт ' + g.names[e.dealer] + '.';
        log('— Сдача ' + e.no + '. Сдаёт ' + g.names[e.dealer] + ' —', 'big');
        talk(e.dealer, 'dealing');
        // за стол сели — поздоровались. Один раз за партию, на первой сдаче.
        if (e.no === 1) { var hp = anyBot(e.dealer);
          if (hp >= 0) wait(1200, function () { talk(hp, 'greet', null, true); }); }
        dealAnim(function () {
          dealing = false; drawHand(); drawWidow();
          next();
        });
        return;

      case 'bid':
        hbAdd('bids', { p: e.p, bid: e.bid, dark: !!e.dark, noWidow: !!e.noWidow });
        drawSeats(); drawInfo(); drawScore();
        /* В журнал тут не пишем: движок уже сказал это сам, событием
           `say`. Ник поймал на скриншоте — каждая строка в журнале
           стояла дважды: «Зяма: 6 пик.», «Колянусик: вистую.», «берёт
           прикуп». Одно и то же событие писали и движок, и стол.

           Право говорить оставлено движку: у него формулировка полнее
           («втёмную», «БЕЗ ПРИКУПА», «уходит за свои»), и он один знает,
           что именно записал. Столу остаются реплики и картинка. */
        if (e.bid == null) {
          talk(e.p, 'bidPass');
        } else {
          var t = K.tricksOf(e.bid);
          var key = e.dark ? 'bidDark' : K.isMiser(e.bid) ? 'bidMiser'
            : (K.trumpOf(e.bid) === null ? 'bidNT'
              : t >= 8 ? 'bidHigh' : t === 7 ? 'bidMid' : 'bidLow');
          talk(e.p, key, { suit: K.trumpOf(e.bid) });
        }
        wait(360, next);
        return;

      case 'razturn':
        drawSeats(); drawInfo();
        wait(300, next);
        return;

      case 'slot':
        wait(260, next);
        return;

      case 'look':
        drawHand();
        wait(120, next);
        return;

      case 'widow':
        if (hb) hb.widow = e.cards;
        /* До сноса прикуп видит только тот, кто его взял: показать его
           раньше — значит выдать соперникам логику сноса.

           Исключение — МИЗЕР: «игрок объявляет мизер и забирает прикуп,
           ПОКАЗЫВАЯ ЕГО ВСЕМ». Снос при этом всё равно втёмную: что
           именно он сбросил, не видит никто. */
        g.widowOpen = (e.p === ME) || !!e.all;
        drawWidow();
        wait(g.widowOpen ? 900 : 520, function () {
          g.phaseAfterWidow = true;
          drawWidow(); drawHand(); drawSeats();
          drawScore();
          if (e.p === ME) {
            var good = e.cards.some(function (c) { return K.ord(c) >= 5; });
            talk(ME, good ? 'widowGood' : 'widowBad');
          } else talk(e.p, Math.random() < 0.5 ? 'widowGood' : 'widowBad');
          next();
        });
        return;

      case 'nowidow':
        /* Прикуп так и остаётся лежать закрытым — показывать нечего,
           и это половина смысла: соперники тоже его не увидят. */
        talk(e.p, 'bidDark', null, true);
        wait(620, next);
        return;

      case 'drop':
        /* Снос сделан — теперь прикуп показываем всем и оставляем
           лежать наверху до конца сдачи. Ник: «у нас прикуп не светится,
           неважно кто играл — нужно показать, какие карты БЫЛИ в
           прикупе». Логику сноса это уже не выдаёт: снесённое ушло в
           отбой и никому не показано. */
        g.widowOpen = true; g.phaseAfterWidow = false;
        drawWidow();
        log(g.names[e.p] + ' снёс две карты.');
        talk(e.p, 'drop');
        drawHand();
        wait(260, next);
        return;

      case 'contract':
        if (hb) { hb.contract = e.bid; hb.declarer = e.p; hb.dark = !!(g.darkPlay && g.darkPlay()); }
        drawInfo(); drawSeats(); drawScore();
        talk(e.p, 'contract', { suit: K.trumpOf(e.bid) }, true);
        wait(520, next);
        return;

      case 'whist':
        hbAdd('whist', { p: e.p, w: e.whist });
        drawSeats(); drawScore();
        talk(e.p, e.whist === 'P' ? 'whistNo' : e.whist === 'H' ? 'whistHalf' : 'whistYes');
        wait(380, next);
        return;

      case 'light':
        if (hb) hb.lightOn = !!e.on;
        drawSeats(); drawScore(); drawHand();
        wait(700, next);
        return;

      case 'unwhisted':
        talk(e.p, 'unwhisted', null, true);
        wait(900, next);
        return;

      case 'raspas':
        if (hb) hb.pass = true;
        g.widowOpen = !!(g.o && g.o.passWidow);
        drawWidow(); drawInfo(); drawScore();
        talk(g.seats[0], 'raspasStart', null, true);
        wait(800, next);
        return;

      case 'play-start':
        hideBid();
        drawAll();
        wait(180, next);
        return;

      case 'card':
        var from;
        if (e.p === ME) {
          var hc = $('#hand .card[data-id="' + K.id(e.c) + '"]');
          from = hc ? rectOf(hc)
            : { x: innerWidth / 2, y: innerHeight - 100, w: cardW(), h: cardW() * 1.49 };
          if (hc) hc.style.visibility = 'hidden';
        } else {
          var sEl = seatEl(e.p);
          var r2 = sEl ? sEl.getBoundingClientRect()
            : { left: innerWidth / 2, top: 40, width: 40, height: 40 };
          from = { x: r2.left + r2.width / 2 - 18, y: r2.top + 22, w: 36, h: 54 };
        }
        drawSeats(); drawHandLater();
        sayOnCard(e);
        return flyCard(e.c, from, e.p, function () { wait(110, next); });

      case 'trick':
        /* Закрытую взятку показываем целиком — со всеми тремя картами. */
        shown = e.plays ? e.plays.slice() : null;
        drawTrick();
        drawSeats(); drawInfo(); drawScore();
        sayOnTrick(e);
        /* Взятка не исчезает сразу. Секунда на то, чтобы увидеть, чем
           её взяли, — иначе карты просто мигают и игрок не понимает,
           что произошло. */
        wait(TRICK_HOLD, function () {
          collectTrick(e.w, function () { drawInfo(); wait(140, next); });
        });
        return;

      case 'hand-end':
        hideBid();
        addRound(roundRow(e.res, e.no));
        histAdd(e.res);
        if (window.Boot && Boot.achHand) { try { Boot.achHand(g, e.res); } catch (err) { } }
        drawAll();
        sayOnEnd(e.res);
        /* Сдача кончилась — пауза, в которую и лезет байка. Тут её
           слышно лучше всего: карты собраны, все смотрят на запись. */
        if (Math.random() < 0.55) joke(e.res && e.res.declarer, 2400, 0.7, true);
        wait(1200, next);
        return;

      case 'over':
        drawAll();
        if (window.Boot && Boot.achGame) { try { Boot.achGame(g); } catch (err) { } }
        wait(400, function () { showOver(); next(); });
        return;

      case 'say':
        /* Единственное место, где строка попадает в журнал. Одну
           движковую строку стол подменяет своей — разделитель сдач; всё
           остальное идёт как сказано. */
        if (e.t && e.t !== sayMute) log(e.t, e.k);
        if (e.t === sayMute) sayMute = null;
        next();
        return;
    }
    next();
  }

  /* Что сказать на положенную карту. Говорим редко и по делу: если
     комментировать каждую карту, стол превращается в базар без пауз. */
  function sayOnCard(e) {
    if (Math.random() > 0.22) return;
    var key = null;
    if (g.pass) key = null;
    else if (e.first && g.trump && e.c.s === g.trump) key = 'leadTrump';
    else if (!e.first && g.cur.length && g.trump && e.c.s === g.trump &&
      g.cur[0].c.s !== g.trump) key = 'ruff';
    else if (K.ord(e.c) >= 6) key = 'playBig';
    else key = 'playSmall';
    if (key) talk(e.p, key);
  }
  function sayOnTrick(e) {
    if (g.pass) {
      // на распасах взятка — беда, а не радость
      if (Math.random() < 0.4) talk(e.w, 'raspasTake');
      return;
    }
    if (e.no === 10) { if (Math.random() < 0.5) talk(e.w, 'posled'); return; }
    if (Math.random() < 0.15) talk(e.w, 'playBig');
    /* Между взятками травят байки — иначе стол звучит как читальный зал.
       Бросок отдельный от «похвалить карту»: в клаборе так, и именно
       этого Нику тут не хватало. */
    if (Math.random() < 0.24) joke(e.w, 1500);
  }
  function sayOnEnd(r) {
    if (!r) return;
    if (r.pass) {
      g.seats.forEach(function (p) {
        if (!g.taken[p] && Math.random() < 0.6) talk(p, 'raspasClean');
      });
      return;
    }
    var d = r.declarer;
    if (K.isMiser(r.contract)) {
      if (r.made) talk(d, 'miserClean', null, true);
      else {
        talk(d, 'miserFail', null, true);
        var w = g.whisters && g.whisters[0];
        if (w != null) wait(700, function () { talk(w, 'miserCatch'); });
      }
      return;
    }
    if (r.made) {
      talk(d, r.got === r.need ? 'madeTight' : 'made', null, true);
    } else {
      talk(d, 'setSelf', { n: numWord(r.miss) }, true);
      var q = (g.whisters || []).filter(function (x) {
        return g.whist[x] === 'W' || g.whist[x] === 'H';
      })[0];
      if (q != null) wait(760, function () { talk(q, 'setOpp', { name: g.names[d] }); });
    }
    // недобор на висте — отдельная беда, о ней говорят
    if (r.why && r.why.whistShort) {
      for (var i = 0; i < r.why.whistShort.length; i++) {
        if (!r.why.whistShort[i]) continue;
        (function (p) { wait(1000, function () { talk(p, 'whistShort'); }); })(i);
      }
    }
  }
  function numWord(n) {
    return ({ 1: 'одной', 2: 'двух', 3: 'трёх', 4: 'четырёх', 5: 'пяти' })[n] || (n + '');
  }

  /* ---------- насос событий ----------
     Единственное место, где стол двигается вперёд. Пока событие
     проигрывается, новых ходов не спрашиваем — иначе анимация и логика
     разъедутся, и карта улетит не туда. */
  function pump() {
    if (pumping) return;
    pumping = true;
    step();
  }
  function step() {
    if (paused) { pumping = false; needReady = true; return; }
    if (evIdx < g.ev.length) {
      var e = g.ev[evIdx++];
      handleEvent(e, step);
      return;
    }
    pumping = false;
    /* Гостю вопрос приезжает отдельно от событий и ЖДЁТ, пока стол
       доиграет анимацию: иначе панель заявок выскакивала бы поверх
       летящих карт. `pendHold` для этого и заведён — только его до сих
       пор никто не разворачивал обратно, и гость не мог сделать ни
       одного хода: за него ходил хозяин. */
    if (g.pendHold !== undefined) g.pending = g.pendHold;
    ready();
  }

  /* ---------- чей ход ---------- */
  /* Чем сейчас занят сосед. Ник: «игрок спасовал, другой игрок должен
     сносить — но у него висит меню; нужно выводить, что игрок там
     думает, что снести, выбирает игру — такие сообщения выводить».
     «Ждём Колянусика…» не говорит ничего: ждём-то понятно, а вот чего
     именно — нет. */
  var BUSY = {
    bid: ' торгуется',
    drop: ' сносит прикуп',
    contract: ' называет окончательную игру',
    whist: ' решает: вист или пас',
    light: ' решает, открываться ли',
    slot: ' выбирает графу',
    play: ' думает над ходом'
  };
  function waitWord(p) {
    var t = g.pending ? g.pending.type : null;
    return g.names[p] + (BUSY[t] || ' думает') + '…';
  }

  function ready() {
    if (!g.pending) { drawAll(); return; }
    drawAll();
    var p = g.pending.p;
    if (g.pending.type === 'next') { askNext(); return; }
    if (p === ME) { askHuman(); return; }
    /* Вопрос ушёл к соседу — свою панель торговли убираем. Без этого
       гость сидел с живой лестницей «ВАШЕ СЛОВО» поверх чужого хода:
       нажать можно, толку ноль, а подсказку внизу она собой закрывала. */
    stopIdle(); hideBid();
    /* За чужое место ходит только хозяин, и только если там бот. Гость
       не ходит ни за кого: карт чужой руки у него нет, и «подумать» за
       соседа он может разве что по рубашкам. */
    if (window.Net && Net.S.on &&
      (!Net.S.host || (Net.isHuman && Net.isHuman(p)))) {
      hint(waitWord(p));
      return;
    }
    // бот
    hint('');
    var lvl = (window.Boot && Boot.CFG) ? Boot.CFG.level : 2;
    var name = lvl === 1 ? 'easy' : lvl === 3 ? 'hard' : 'normal';
    wait(360, function () {
      if (!g.pending || g.pending.p !== p) return;
      /* Пока бот «думал» эти треть секунды, человек мог вернуться за
         стол. Тогда ходить за него уже нельзя: место снова живое, и
         вопрос теперь его. Место, освободившееся при обрыве, занимает
         бот — но ровно до возвращения хозяина этих карт. */
      if (window.Net && Net.S.on && Net.isHuman && Net.isHuman(p)) return;
      /* Стол ждёт вылетевшего — значит ждут ВСЕ, и боты тоже. Этот ход
         стоит в очереди и будет сделан, когда ожидание кончится. */
      if (netHold) { needReady = true; return; }
      var a = Bots.act(g, p, name);
      if (!a) { a = fallback(p); }
      act(a);
    });
  }
  // если бот почему-то промолчал — стол не должен вставать колом
  function fallback(p) {
    var t = g.pending.type;
    if (t === 'bid') return { bid: null };
    if (t === 'whist') return { whist: 'P' };
    if (t === 'light') return { light: true };   // запасной ответ — всегда светлая
    if (t === 'contract') return { bid: g.high };
    if (t === 'drop') return { cards: g.hands[p].slice(0, 2) };
    if (t === 'play') return { card: g.legal(handSeat())[0] };
    return {};
  }

  /* Единственная дверь, через которую стол двигается.

     У гостя `g` — сетевая заглушка: её apply не считает правила, а
     отсылает ход хозяину. У хозяина apply настоящий, и после него надо
     разослать новое состояние — иначе гости застынут на первой сдаче,
     а хозяин уедет вперёд. Именно это и случилось при первой проверке
     тремя вкладками. */
  function act(a) {
    if (!g.pending) return;
    /* Стол на паузе ждёт вылетевшего. Принять ход сейчас — значит
       отыграть сдачу без него, ровно то, от чего пауза и заведена.
       Это единственная дверь для всех ходов: и для своих, и для
       присланных гостями (`applyRemote` зовёт сюда же), — потому
       проверка стоит здесь. */
    if (netHold) { toast('Партия на паузе — ждём игрока'); return; }
    stopIdle();
    g.apply(a);
    if (window.Net && Net.S.on && Net.S.host) Net.broadcast(g);
    /* Стол сдвинулся — записали. Партия до десяти у каждого идёт сдач
       пятнадцать, и терять её от случайного F5 нельзя. */
    if (window.Boot && Boot.autosave) Boot.autosave(g);
    pump();
  }

  /* ---------- ход человека ----------
     Пока человек думает, стол не молчит: через пятнадцать секунд кто-то
     из соседей подаёт голос, дальше каждые полминуты. Таймер снимается
     на любом нашем действии — иначе подначка догонит уже после хода. */
  var idleT = null;
  function stopIdle() { if (idleT) { clearTimeout(idleT); idleT = null; } }
  function startIdle(ms) {
    stopIdle();
    var my = gen;
    idleT = setTimeout(function () {
      idleT = null;
      if (my !== gen || !g || !g.pending || g.pending.p !== ME) return;
      var who = anyBot();
      if (who >= 0) talk(who, Math.random() < 0.3 ? 'anekdot' : 'slow', null, true);
      startIdle(30000);
    }, ms || 15000);
  }

  function askHuman() {
    startIdle();
    var t = g.pending.type;
    if (t === 'bid') return askBid();
    if (t === 'drop') return askDrop();
    if (t === 'contract') return askContract();
    if (t === 'slot') return askSlot();
    if (t === 'whist') return askWhist();
    if (t === 'light') return askLight();
    if (t === 'play') return askPlay();
  }

  function askBid() {
    if (darkChoice()) return askDark();
    hint('Ваше слово');
    bidPanel(g.high == null ? 0 : g.high + 1, true, function (n) {
      hideBid();
      /* Мизер и девятерную в Одессе можно заявить БЕЗ ПРИКУПА — сыграть
         с руки за двойную цену. Спрашиваем ровно там, где это
         разрешено, и ровно в тот момент, когда слово ещё не сказано:
         после прикупа отказываться поздно. */
      if (n != null && g.canNoWidow && g.canNoWidow(n)) return askNoWidow(n);
      act({ bid: n });
    });
  }

  /* ---------- с прикупом или с руки ----------

     Показываем то, что нужно для решения: во что превращается цена и
     чего игрок лишается. Настоящая плата тут не «вдруг в прикупе туз»,
     а отсутствие сноса — особенно на мизере, где снос это половина
     игры. Про это и написано словами, а не намёком. */
  function askNoWidow(n) {
    var base = K.price(n), mul = (g.o && g.o.noWidowMul) || 2;
    var mis = K.isMiser(n);
    modal('<h3>' + esc(K.bidWord(n)) + ' — с прикупом или с руки?</h3>' +
      '<div class="sub">Без прикупа он не вскрывается вовсе, сноса нет, ' +
      'играете теми же десятью картами. Цена за это вдвое.</div>' +
      '<div class="whistbox">' +
      '<button class="btn" data-nw="0">С прикупом<br><i>' + base + ' в пулю</i></button>' +
      '<button class="btn" data-nw="1">С руки<br><i>' + (base * mul) + ' в пулю</i></button>' +
      '</div>' +
      '<div class="whistnote">С прикупом — две лишние карты и снос: можно ' +
      'выбросить то, что мешает' + (mis ? ', а на мизере снос это половина игры' : '') +
      '.<br>С руки — ' + (base * mul) + ' в пулю за сыгранную и ' + (base * mul) +
      ' в гору за каждую недобранную. Висты защиты тоже вдвое.</div>',
      function (m) {
        m.querySelectorAll('[data-nw]').forEach(function (b) {
          b.onclick = function () {
            closeModal();
            act({ bid: n, noWidow: b.dataset.nw === '1' });
          };
        });
      }, { light: true, lock: true });
  }

  /* Первый вопрос сдачи: рискуем или смотрим.

     Тёмная объявляется, пока не притронулся к картам, — значит и
     спрашивать надо до того, как они показаны. Карты лежат рубашками,
     кнопок две, и это единственный момент, когда их видно. */
  function askDark() {
    hint('Карты закрыты');
    var box = $('#bidbar');
    box.classList.add('on');
    box.innerHTML = '';
    var d = el('div', 'bidgrid');
    d.appendChild(el('b', '', 'карты ещё закрыты'));
    var look = el('button', 'bcell pass', 'СМОТРЮ КАРТЫ');
    look.onclick = function () { hideBid(); act({ look: true }); };
    var dark = el('button', 'bcell miser', 'ИГРАЮ ВТЁМНУЮ');
    dark.onclick = function () { darkLadder(); };
    d.appendChild(look); d.appendChild(dark);
    box.appendChild(d);
  }
  function darkLadder() {
    hint('Втёмную — цена вдвое, и подсад тоже вдвое');
    bidPanel(g.high == null ? 0 : g.high + 1, false, function (n) {
      hideBid();
      act({ bid: n, dark: true });
    }, true);
  }

  function askDrop() {
    dropPick = [];
    hint(g.pending.blind
      ? 'Снос втёмную: отметьте две карты, не глядя'
      : 'Выберите две карты в снос');
    drawHand();
    showDropBar();
  }
  function showDropBar() {
    var box = $('#bidbar');
    box.classList.add('on');
    box.innerHTML = '';
    var d = el('div', 'bidgrid');
    d.appendChild(el('b', '', 'снос: ' + dropPick.length + ' из 2'));
    var ok = el('button', 'bcell pass', 'СНЕСТИ');
    ok.disabled = dropPick.length !== 2;
    ok.onclick = function () {
      var cards = dropPick.map(K.parse);
      dropPick = []; hideBid();
      act({ cards: cards });
    };
    d.appendChild(ok);
    box.appendChild(d);
  }

  function askContract() {
    hint('Объявите игру');
    bidPanel(g.high, false, function (n) {
      hideBid();
      act({ bid: n });
    });
  }

  /* ---------- карточка разбойника ----------
     Вопрос сдачи один: в какую графу её вписать. Показываем всю
     карточку — и закрытые графы тоже, с номером сдачи: игрок должен
     видеть, что у него осталось, иначе выбирать не из чего. */
  function slotName(t) {
    if (t === 'R') return 'распасовка';
    if (t === 'M') return 'мизер';
    return t + '-я';
  }
  function askSlot() {
    hint('Впишите сдачу в карточку');
    var mine = g.sheet[ME], left = g.pending.left || [];
    var rows = mine.map(function (r, i) {
      var open = left.some(function (x) { return x.i === i; });
      return '<button class="slotc' + (open ? '' : ' done') + '" data-s="' + i + '"' +
        (open ? '' : ' disabled') + '>' +
        '<b>' + slotName(r.t) + '</b>' +
        '<span>' + (r.done ? 'сдача ' + r.no : 'пусто') + '</span></button>';
    }).join('');
    modal('<h3>Ваша карточка</h3>' +
      '<div class="sub">Сыграть придётся всё. Вопрос только в том, какой картой что закрыть: ' +
      'хорошая рука — в дорогую графу, мусор — в распасовку.</div>' +
      '<div class="slots">' + rows + '</div>' +
      '<div class="slotsuit" id="slotSuit" hidden></div>',
      function (m) {
        m.querySelectorAll('[data-s]').forEach(function (b) {
          b.onclick = function () {
            var i = +b.dataset.s, t = mine[i].t;
            if (t === 'R' || t === 'M') { closeModal(); act({ slot: i }); return; }
            askSuit(m, i, t);
          };
        });
      }, { light: true, lock: true });
  }
  /* Высоту задаёт карточка, а масть игрок выбирает сам — это
     единственная свобода в разбойнике, и её надо дать явно. */
  function askSuit(m, i, t) {
    var box = m.querySelector('#slotSuit');
    box.hidden = false;
    box.innerHTML = '<div class="sub">' + t + '-я — в какой масти?</div><div class="row">' +
      K.SUITS.map(function (s2) {
        return '<button class="btn opt' + (K.SUIT_RED[s2] ? ' red' : '') + '" data-su="' + s2 + '">' +
          K.SUIT_CH[s2] + '</button>';
      }).join('') + '<button class="btn opt" data-su="NT">БК</button></div>';
    box.querySelectorAll('[data-su]').forEach(function (b) {
      b.onclick = function () { closeModal(); act({ slot: i, suit: b.dataset.su }); };
    });
  }

  function askWhist() {
    var pr = K.price(g.contract), need = g.need;
    var quota = (g.o.whistQuota && g.o.whistQuota[K.tricksOf(g.contract)] != null)
      ? g.o.whistQuota[K.tricksOf(g.contract)] : Math.max(0, 10 - need);
    var forced = g.pending.forced;
    hint('');
    var html =
      '<h3>' + esc(g.names[g.declarer]) + ' играет ' + esc(K.bidWord(g.contract)) + '</h3>' +
      '<div class="whistbox">' +
      '<button class="btn" data-w="W">Вистую</button>' +
      (g.pending.half ? '<button class="btn" data-w="H">Полвиста</button>' : '') +
      (forced ? '' : '<button class="btn" data-w="P">Пас</button>') +
      '</div>' +
      '<div class="whistnote">' +
      (K.isMiser(g.contract)
        ? 'Мизер ловят всегда: каждая его взятка идёт ему в гору.'
        : 'Паре вистующих положено <b>' + quota + '</b> взяток. Норма общая: ' +
          'взяли поровну или вразнобой — неважно, лишь бы в сумме. ' +
          'Не добрали — платит виновный.') +
      (forced ? '<br>На шестерной пик вистовать обязаны.' : '') +
      '</div>';
    modal(html, function (m) {
      m.querySelectorAll('[data-w]').forEach(function (b) {
        b.onclick = function () { closeModal(); act({ whist: b.dataset.w }); };
      });
    }, { light: true, lock: true });
  }

  /* Вистуешь один — выбираешь, как играть. Спрашиваем словами, что
     стоит за каждым вариантом: за светлую платят тем, что играющий тоже
     увидит весь расклад защиты, за закрытую — тем, что норму спросят с
     одних твоих взяток. */
  function askLight() {
    var open = g.pending.open, lvl = K.tricksOf(g.contract);
    var away = g.pending.away | 0;
    var pr = K.price(g.contract) * ((g.darkPlay && g.darkPlay()) ? 2 : 1);
    var quota = (g.o.whistQuota && g.o.whistQuota[K.isMiser(g.contract) ? 8 : lvl]) || 0;
    /* Вист-пас: в закрытую тут играть нельзя. Либо открываемся и ведём
       обе руки, либо уходим за свои — берём положенный минимум без
       розыгрыша. Второе всегда точная и известная цифра, поэтому она
       прямо на кнопке: игроку не надо считать в уме. */
    var html = '<h3>Вистуете один</h3>' +
      '<div class="sub">' + esc(g.names[open]) + ' спасовал. В закрытую тут не играют — ' +
      'или открываемся, или уходите за свои.</div>' +
      '<div class="whistbox">' +
      '<button class="btn" data-l="1">Играть в светлую</button>' +
      '<button class="btn" data-l="a">Уйти за свои · ' + (away * pr) + ' вистов</button>' +
      '</div>' +
      '<div class="whistnote">В светлую — <b>обе руки защиты</b> ложатся на стол, и вы ходите ' +
      'за двоих' + (quota ? ' (норме нужно ' + quota + ' на пару)' : '') +
      '. Весь расклад защиты при этом увидит и играющий, зато взятки можно взять сверх нормы, ' +
      'и висты делятся пополам с напарником.<br>' +
      'Уйти за свои — розыгрыша нет вовсе: ' + esc(g.names[g.declarer]) + ' записывает заказанное, ' +
      'вы пишете ' + away + (away === 1 ? ' взятку' : ' взятки') + ' = ' + (away * pr) +
      ' вистов, напарник не пишет ничего.</div>';
    modal(html, function (m) {
      m.querySelectorAll('[data-l]').forEach(function (b) {
        b.onclick = function () {
          closeModal();
          act(b.dataset.l === 'a' ? { away: true } : { light: true });
        };
      });
    }, { light: true, lock: true });
  }

  /* Вистуете вдвоём. Здесь светлая — не «играю за двоих», а «кладём
     карты на стол и видим руки друг друга»: карт никто не получает,
     меняется только видимость. И согласие нужно от обоих — поэтому
     прямо говорим, что одного «в закрытую» хватит на двоих. */

  function askPlay() {
    /* Открытый прикуп на распасах диктует масть хода — без подсказки
       игрок видит только, что половина руки вдруг не нажимается. */
    var ls = g.leadSuit ? g.leadSuit() : null;
    var lead = (ls && !g.cur.length)
      ? ('Прикуп открыт — ход в ' + K.SUIT_NAME[ls]) : null;
    hint(handSeat() !== ME
      ? ('Ходите за ' + g.names[handSeat()] + ' — его карты открыты')
      : (lead || (g.pass ? 'Ваш ход — старайтесь не брать' : 'Ваш ход')));
    drawHand();
  }

  function askNext() {
    hint('');
    var r = g.result;
    var html = '<h3>' + (r && r.pass ? 'Распасы сыграны' : 'Сдача сыграна') + '</h3>' + handSummary(r) +
      '<div class="row"><button class="btn" id="bNext">Дальше</button></div>';
    modal(html, function (m) {
      m.querySelector('#bNext').onclick = function () { closeModal(); act({}); };
    }, { light: true, lock: true });
  }

  function handSummary(r) {
    if (!r) return '';
    var out = [];
    if (r.pass && r.passWin) {
      /* Ростовские распасы: не штраф, а розыгрыш. Показывать «в гору»
         тут нечего — надо показать, кто выиграл и сколько на ком. */
      out.push('<div class="sub">Распасы по-ростовски: выигравший пишет по ' +
        r.passVist + ' виста за каждую чужую взятку.</div>');
      g.seats.forEach(function (p) {
        var win = r.passWin.indexOf(p) >= 0;
        var v = r.whistAdd ? r.whistAdd[p] : 0;
        var mt = r.why ? r.why.raspas[p] : 0;
        out.push('<div class="dline"><span>' + esc(g.names[p]) +
          (win ? ' · выиграл распасы' : '') + '</span><b>' + r.taken[p] +
          (r.taken[p] === 1 ? ' взятка' : ' взяток') +
          (v ? ' · +' + v + ' вистов' : '') +
          (mt < 0 ? ' · ' + (-mt) + ' с горы' : '') + '</b></div>');
      });
    } else if (r.pass) {
      out.push('<div class="sub">По ' + r.price + ' за взятку.</div>');
      g.seats.forEach(function (p) {
        var cl = r.pool && r.pool[p] ? r.pool[p] : 0;
        out.push('<div class="dline"><span>' + esc(g.names[p]) + '</span><b>' +
          r.taken[p] + ' × ' + r.price + ' = ' + (r.taken[p] * r.price) + ' в гору' +
          (cl ? ' · чистый распас, +' + cl + ' в пулю' : '') + '</b></div>');
      });
    } else {
      var d = r.declarer;
      out.push('<div class="dline"><span>' + esc(g.names[d]) + ' · ' + esc(K.bidWord(r.contract)) +
        (r.noWidow ? ' без прикупа' : '') +
        '</span><b>' + (r.made
          ? '+' + r.price + ' в пулю'
          : (r.price * r.miss) + ' в гору') + '</b></div>');
      /* Уход «за свои» приезжает сюда с тем же флагом `unwhisted`, что и
         настоящая невистованная игра: розыгрыша не было ни там, ни там.
         Но вистовал-то человек — и висты себе записал. Ник поймал на
         живой сдаче: «я вистовал, в логе пишет висты, а в уведомлении
         нет». В окне стояло «Никто не вистовал», хотя в журнале рядом
         было «Колянусик пишет 4 виста на Зяму — ушёл за свои». */
      if (r.away) {
        out.push('<div class="sub">' + esc(g.names[r.away.p]) + ' ушёл за свои — ' +
          r.away.tricks + (r.away.tricks === 1 ? ' взятка' : ' взятки') +
          ' без розыгрыша.</div>');
        out.push('<div class="dline"><span>' + esc(g.names[r.away.p]) +
          '</span><b>+' + r.away.vists + ' вистов</b></div>');
        (g.whisters || []).forEach(function (q) {
          if (q === r.away.p) return;
          out.push('<div class="dline"><span>' + esc(g.names[q]) +
            ' · пасовал</span><b>ничего</b></div>');
        });
      } else if (r.checked) {
        out.push('<div class="sub">Десятерная проверяется — вистов не пишет никто.</div>');
      } else if (r.unwhisted) {
        out.push('<div class="sub">Никто не вистовал — записано без розыгрыша.</div>');
      } else {
        if (r.whistQuota != null)
          out.push('<div class="sub">Защите положено ' + r.whistQuota +
            ', взято ' + r.whistGot + '.</div>');
        (g.whisters || []).forEach(function (q) {
          var v = r.whistAdd ? r.whistAdd[q] : 0;
          var mt = r.why ? r.why.whistShort[q] : 0;
          if (!v && !mt) return;
          out.push('<div class="dline"><span>' + esc(g.names[q]) + '</span><b>' +
            (v ? '+' + v + ' вистов' : '') + (mt ? ' · ' + mt + ' в гору' : '') + '</b></div>');
        });
      }
    }
    /* Залив в чужую пулю: без этой строки игрок видит «+2 в пулю», а в
       своей пуле ничего не прибавилось — и не понимает, куда делось. */
    (r.poured || []).forEach(function (x) {
      out.push('<div class="dline"><span>' + esc(g.names[x.from]) +
        ' — пуля закрыта</span><b>' + x.pts + ' в пулю ' + esc(g.names[x.to]) +
        ' · +' + x.vists + ' вистов на него</b></div>');
    });
    return out.join('');
  }

  /* Итог партии.

     Победителя определяет не пуля, а расчёт. Пуля — это финиш, а не
     счёт: закрыть её первым и всё равно проиграть можно легко, если
     набрал гору и раздал висты. В разбойнике пули-финиша нет вовсе,
     партия кончается по карточкам, и без расчёта победителя не назвать.

     Считаем классически: остаток пули после горы идёт по десять вистов
     с каждого соперника, взаимные висты сворачиваются. */
  function settle(g) { return K.settle(g.pool, g.mountain, g.whists); }

  /* Что выбито за эту партию — прямо в окне итогов. Тост живёт две с
     половиной секунды и гаснет ещё до того, как игрок дочитает раздачу;
     а тут написано чёрным по белому и никуда не денется. */
  function achOverHTML() {
    var l = [];

  /* ---------- ввод: клик и перетаскивание ---------- */
  var dragId = null, dragEl = null, startY = 0, moved = false;

    var mineCard = (g.hands[ME] || []).some(function (c) { return c && K.id(c) === id; });

  /* ---------- окна ---------- */
  function modal(html, wire, o) {

       а стол остаётся ждать ответа, которого уже некому дать. Такие окна

  /* Перерисовка ТОГО ЖЕ экрана не должна швырять к началу.

     Ник: «при клике на портрет внизу кидает опять скролл в начало — в
     клаборе мы его уже пофиксили». Починка оттуда же и взята, и она не
     в одном месте: прокруток на экране три этажа. Сам `#splash` —
     флексбокс и не скроллится вовсе (поэтому старая строка ничего и не
     держала); скроллится `.dlg` внутри него, а внутри `.dlg` — своя
     сетка портретов и лента комнаты. Запоминаем все три. */

    var same = key && m.dataset.k === key && m.classList.contains('on');
    var top = same ? m.scrollTop : 0;
    var dlg = m.querySelector('.dlg');
    var dtop = (same && dlg) ? dlg.scrollTop : 0;
    var keep = {};
    if (same) SCROLLERS.forEach(function (sel) {
      var e2 = m.querySelector(sel);
      if (e2) keep[sel] = e2.scrollTop;
    });
    m.innerHTML = '<div class="dlg' + (wide ? ' hallwide' : '') + '">' + html + '</div>';
    m.dataset.k = key || '';
    m.classList.add('on');
    if (wire) wire(m);
    if (same) m.scrollTop = top;
    var nd = m.querySelector('.dlg');
    if (nd) nd.scrollTop = dtop;
    SCROLLERS.forEach(function (sel) {
      if (keep[sel] == null) return;
      var e2 = m.querySelector(sel);
      if (e2) e2.scrollTop = keep[sel];

  function closeSplash() { var m = $('#splash'); m.classList.remove('on'); m.innerHTML = ''; }

  function toast(t) {
    var e = $('#toast');

  function showPane(id) {
    $$('#tabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.p === id); });
    $$('.pane').forEach(function (p) { p.classList.toggle('on', p.id === id); });

  /* ---------- чат за столом ---------- */
  var chatLog = [];

    var body = chatLog.length
      ? chatLog.map(function (x) {
        if (x.sys) return '<div class="cmsg sys">' + esc(x.t) + '</div>';

      }).join('')

  function chatDraw() {
    var p = $('#chatpane');

      var t = (inp.value || '').trim();

    };

  /* Сеть зовёт chatIn тремя аргументами, свой ввод — одним объектом.

     дороже, чем один раз тут. */
  function chatIn(m, text, seat) {
    if (typeof m === 'string') m = { from: m, t: String(text || ''), seat: seat };
    chatLog.push(m);

     Раньше тут был только красный огонёк на кнопке «Сеть» — и человек

  function netLost() {

    if (b) { b.style.borderColor = '#e06a5a'; b.style.color = '#ffb3a7'; b.textContent = 'Связь!'; }
