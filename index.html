  }
  function rating(st) { return eloOf(st); }

  /* Сумма вистов за всё время — её игрок хочет видеть отдельно: по ней
     понятно, сколько вообще наиграно, а не только каким вышел итог. */
  function vistNet(st) { return (st.vWon || 0) - (st.vLost || 0); }

  /* ---------- партия с ботами ---------- */
  var G = null;
  /* ---------- сохранённая партия с ботами ----------

     Ник: «я вылетел с игры с ботами — обновил браузер и не могу
     вернуться снова». Партия до десяти у каждого идёт сдач пятнадцать;
     терять её от случайного F5 — обиднее всего.

     Сетевые столы сюда не пишутся: там за возврат отвечает `Net`, у
     него свой ключ и своя кнопка «вернуться за стол». Тут только боты. */
  var SKEY = 'pref.game';
  function autosave(g) {
    try {
      if (window.Net && Net.S && Net.S.on) return;        // сетевой стол — не наше дело
      if (!g || g.over) { localStorage.removeItem(SKEY); return; }
      localStorage.setItem(SKEY, JSON.stringify({
        v: 2, t: Date.now(), me: 0, faces: g.faces || null, g: g.save()
      }));
    } catch (e) { }
  }
  function savedGame() {
    try {
      var d = JSON.parse(localStorage.getItem(SKEY) || 'null');
      if (!d || d.v !== 2 || !d.g || d.g.over) return null;
      if (!d.g.handNo) return null;
      return d;
    } catch (e) { return null; }
  }
  function dropSave() { try { localStorage.removeItem(SKEY); } catch (e) { } }

  function resumeGame() {
    var d = savedGame();
    if (!d) return;
    var g = Engine.Game.load(d.g);
    if (!g) { dropSave(); return; }
    G = g;
    G.faces = d.faces || null;
    achRunReset();
    UI.closeSplash(); UI.closeModal();
    toTable();
    UI.attach(G, [], d.me || 0);
    if (window.Hall && Hall.where) Hall.where('bots');   // продолженная партия — такая же партия
    UI.resume();
  }

  function start(opts) {
    dropSave();                        // новая партия затирает старую
    opts = opts || {};
    var n = opts.players || CFG.players;
    var names = [myName()];
    var faces = [CFG.face];
    var busy = [CFG.face];
    for (var i = 1; i < n; i++) {
      var sex = (i % 2) ? 'm' : 'f';
      var f = pickFace(sex, busy);
      busy.push(f); faces.push(f);
      // имя не должно повториться: двое «Изей» за столом сбивают с толку
      names.push(NAMES.make(ART.FACE_SEX.charAt(f) === 'f' ? 'f' : 'm', null,
        names.map(function (x) { return String(x).split(' ')[0]; })));
    }
    G = new Engine.Game(Object.assign({
      players: n, names: names, target: opts.target || CFG.target
    }, K.opts(opts.conv || CFG.conv), CFG.raz
      ? { razboynik: true, card: (CFG.card === 'full' ? K.CARD_FULL : K.CARD_SHORT) }
      : {}));
    G.faces = faces;
    achRunReset();
    toTable();
    UI.closeSplash(); UI.closeModal();
    UI.attach(G, [], 0);
    if (window.Hall && Hall.where) Hall.where('bots');   // из комнаты не уходим — помечаемся
    UI.begin();
  }
  function pickFace(sex, busy) {
    var cand = [], i;
    for (i = 0; i < ART.FACES; i++) {
      if (busy.indexOf(i) >= 0) continue;
      if (ART.FACE_SEX.charAt(i) !== sex) continue;
      cand.push(i);
    }
    if (!cand.length) for (i = 0; i < ART.FACES; i++) if (busy.indexOf(i) < 0) cand.push(i);
    return cand.length ? cand[Math.floor(Math.random() * cand.length)] : 0;
  }


  /* ============================================================
     ВЫДАЧА ДОСТИЖЕНИЙ

     Достижения без выдачи — это просто список в профиле, поэтому здесь
     всё, что игра может проверить сама: по итогу сдачи и по итогу
     партии. Считаем только своё место: чужие подвиги не наши.

     Накопительные счётчики живут в профиле рядом со статистикой — их
     нельзя восстановить из текущей сдачи, а терять между партиями
     нельзя тем более.
     ============================================================ */
  function cnt() {
    var c = null;
    try { c = JSON.parse(ls('cnt', 'null')); } catch (e) { }
    return c || {};
  }
  function saveCnt(c) { try { lsSet('cnt', JSON.stringify(c)); } catch (e) { } }
  function bump(c, k, n) { c[k] = (c[k] || 0) + (n || 1); return c[k]; }

  function isNet() { return !!(window.Net && Net.S.on); }

  /* ---------- счёт и мелкая арифметика для значков ---------- */
  /* Настоящий счёт игрока: пуля минус гора по десять за вистующего,
     плюс свои висты, минус чужие. Пуля сама по себе победителя не
     называет — проверено прогоном. */
  function scoreOf(g, i) { return K.settle(g.pool, g.mountain, g.whists)[i]; }
  function leads(g, me) {                    // веду ли я по счёту
    for (var i = 0; i < g.N; i++) if (i !== me && scoreOf(g, i) >= scoreOf(g, me)) return false;
    return true;
  }
  function hasCard(l, c) {
    for (var i = 0; i < (l || []).length; i++) if (K.same(l[i], c)) return true;
    return false;
  }

  /* ---------- вопросы задним числом ----------
     Два значка нельзя выдать по результату сдачи: надо знать, чего рука
     стоила ДО прикупа и чего стоила бы другая игра. Считать это
     решателем нельзя — полный перебор бескозырной десятки идёт секунды,
     и стол на них встанет. Поэтому спрашиваем ту же оценку руки,
     которой торгуется бот: она намеряна тем же решателем заранее и
     стоит микросекунды. */

  /* «Прикуп лёг» — не «пришли два туза», а «без прикупа заказ не
     брался, с прикупом взялся». Смотрим ровно это: оценка руки до
     прикупа против оценки после сноса, в той же масти. */
  function widowMadeIt(g, r, me) {
    if (!g.deal0 || !window.Eval || g.sheet) return false;
    var before = g.deal0[me] || [];
    if (before.length !== 10) return false;
    var after = before.concat(g.widow || []).filter(function (c) { return !hasCard(g.drop, c); });
    if (after.length !== 10) return false;
    var trump = K.trumpOf(r.contract);
    var a = Eval.play(before, trump), b = Eval.play(after, trump);
    return a < r.need - 0.75 && b >= r.need - 0.25 && b - a >= 0.75;
  }

  /* «Пропустил мизер» — на руках лежал чистый мизер, а вы промолчали.
     Мера та же, по которой мизер заказывает бот: ниже порога он идёт
     сам, и там же проходит граница «чисто» — она намеряна, а не
     назначена. Берём с запасом: значок за верный мизер, а не за
     рискованный. */
  function missedMiser(g, me) {
    if (!g.deal0 || !window.Bots || !Bots.miserRisk || g.sheet) return false;
    var h = g.deal0[me] || [];
    if (h.length !== 10) return false;
    for (var i = 0; i < h.length; i++) if (h[i].r === 'A') return false;
    return Bots.miserRisk(h) < 0.35;
  }

  /* Итог сдачи. Всё, что тут проверяется, видно прямо в результате:
     что заказал, сколько взял, кто сел, сколько записал. */
  function achHand(g, r) {
    if (!r) return;
    var me = UI.me ? UI.me() : 0, c = cnt(), net = isNet();
    bump(c, 'hands');
    if (c.hands >= 100) ach('h100');
    if (c.hands >= 200) ach('hands200');
    if (c.hands >= 500) ach('hands500');
    if (c.hands >= 1000) ach('h1000');
    if (c.hands >= 2500) ach('h2500');
    if (net) { bump(c, 'nhands');
      if (c.nhands >= 100) ach('nH100');
      if (c.nhands >= 500) ach('nH500');
      if (c.nhands >= 1000) ach('nH1000'); }

    /* Насколько глубоко проваливался за партию — для «с того света». */
    var diff = 0, q5;
    for (q5 = 0; q5 < g.N; q5++) if (q5 !== me && g.pool[q5] - g.pool[me] > diff) diff = g.pool[q5] - g.pool[me];
    if (diff > (c.behind || 0)) c.behind = diff;
    if (g.mountain[me] > (c.deepGora || 0)) c.deepGora = g.mountain[me];
    if (!r.pass && r.taken && g.tricks && g.tricks.length >= 10 && net) {
      var lastT = g.tricks[g.tricks.length - 1];
      if (lastT && lastT.w === me) { if (bump(c, 'nlast') >= 100) ach('gKostya'); }
    }

    /* Отставание по счёту — для «догнал». Важно не то, как дела сейчас,
       а как они шли за две сдачи до конца, поэтому держим три отсчёта и
       сдвигаем их каждую сдачу. */
    c.behind3 = c.behind2 || 0; c.behind2 = c.behind1 || 0;
    c.behind1 = leads(g, me) ? 0 : 1;

    /* Закрыть пулю последней сдачей, идя до неё позади. */
    if (!g.sheet && r.poolNow && r.poolNow[me] >= g.target) {
      var pb = r.poolNow[me] - (r.pool ? r.pool[me] : 0), ahead = 0, q6;
      for (q6 = 0; q6 < g.N; q6++) if (q6 !== me) {
        var ob = r.poolNow[q6] - (r.pool ? r.pool[q6] : 0);
        if (ob > ahead) ahead = ob;
      }
      if (pb < ahead) ach('lastHand');
    }

    /* Чистый мизер на руках, а вы промолчали. Спрашиваем решатель
       только если заявки не было: сказал слово — значит не пропустил. */
    if ((r.pass || r.declarer !== me) && g.bids && g.bids[me] == null && missedMiser(g, me))
      ach('miserPass');

    var mine = r.taken ? r.taken[me] : 0;
    bump(c, 'tricks', mine);
    if (c.tricks >= 1000) ach('tr1000');
    if (c.tricks >= 5000) ach('tr5000');
    if (net) { bump(c, 'ntricks', mine); if (c.ntricks >= 1000) ach('gPushkin'); }

    if (r.pass) {
      bump(c, 'raspas');
      bump(c, 'raspasThisGame');
      c.wasRaspas = 1;
      if (c.raspasThisGame >= 3) ach('viaRaspas');
      /* Выйти из распаса не хуже других — тоже достижение: обычно
         оттуда все выходят с горой. */
      var worst = 0;
      for (var q4 = 0; q4 < g.N; q4++) if (q4 !== me && r.mountain[q4] > worst) worst = r.mountain[q4];
      if (r.mountain[me] <= worst) ach('raspasWin');
      if (c.raspas >= 100) ach('raspas100');
      if (!mine) { ach('raspas0'); if (net) ach('nRaspas0'); }
      if (mine >= 10) ach('raspasAll');
      if (g.passRow >= 3) ach('raspas3');
      saveCnt(c); return;
    }

    var d = r.declarer, miser = K.isMiser(r.contract), lvl = K.tricksOf(r.contract);

    /* Что пришло в сдаче — это видно и стоит своих значков. */
    if (d === me) {
      var wid = g.widow || [], drp = g.drop || [];
      if (wid.filter(function (c) { return c && c.r === 'A'; }).length >= 2) ach('widow2A');
      if (wid.length === 2 && wid.every(function (c) { return c && c.r === '7'; }) && r.made)
        ach('widowDead');
      if (r.made) {
        if (drp.some(function (c) { return c && c.r === 'A'; })) ach('dropAce');
        if (drp.some(function (c) { return c && c.r === 'K'; })) ach('dropKing');
        /* Прикуп не пригодился совсем: обе карты уехали обратно в снос,
           игра сыграна теми же десятью, что и пришли. */
        if (wid.length === 2 && drp.length === 2 &&
          wid.every(function (c) { return hasCard(drp, c); })) ach('dryWin');
        /* А тут наоборот: без прикупа заказ не брался. */
        if (!miser && widowMadeIt(g, r, me)) ach('widowLucky');
        /* Мизер с прикупа: торговался за контрактную игру, а после
           прикупа объявил мизер — и сыграл его чисто. */
        if (miser && g.bids && g.bids[me] != null && !K.isMiser(g.bids[me])) ach('miserWidow');
      }
      c.tookGame = 1;
      if (r.pool && r.pool[me] >= 10) ach('bigHand');
      var lvlKey = (lvl === 10 ? 'ten' : lvl === 9 ? 'nine' : lvl === 6 ? 'six' : null);
      if (r.made && lvlKey) {
        var suit = K.trumpOf(r.contract) || 'NT';
        var key2 = lvlKey + 'Suits';
        c[key2] = c[key2] || '';
        if (c[key2].indexOf(suit) < 0) c[key2] += suit;
        var full = (lvlKey === 'nine') ? 4 : 5;   // девятерная только в мастях
        if (c[key2].replace(/NT/, 'N').length >= full) ach(lvlKey + 'All');
      }
      if (r.made && lvl === 10 && K.trumpOf(r.contract) === null) ach('tenNoTrump');
      if (r.made) { c.bids = (c.bids || '') + lvl;
        if (/6/.test(c.bids) && /7/.test(c.bids) && /8/.test(c.bids)) ach('allBids'); }
      if (r.made && lvl === 6) { if (bump(c, 'six') >= 4) ach('six4'); }
      if (lvl >= 8) { if (bump(c, 'big') >= 3) ach('bigBid'); }
      if (miser && !r.made) ach('miserSet');
      if (r.dark && r.made) { ach('dark'); if (net) ach('nDark'); }
      /* Прервать серию распасов своим заказом — отдельное умение:
         обычно из распасов вываливаются, а не выходят. */
      if (r.made && g.passRow === 0 && c.wasRaspas) { ach('raspasExit'); c.wasRaspas = 0; }
      if (miser && r.made && net) { if (bump(c, 'nmisers') >= 50) ach('gBabel'); }
    }

    /* Рука, которую стоит запомнить. Считаем по своим картам вместе со
       снесённым: снос — тоже часть того, что пришло. */
    var mineAll = (g.hands[me] || []).concat(d === me ? (g.drop || []) : []);
    if (mineAll.filter(function (c2) { return c2 && c2.r === 'A'; }).length >= 4) ach('aces4');
    if (mineAll.filter(function (c2) { return c2 && c2.r === '7'; }).length >= 4) ach('sevens4');

    if (d === me) {
      if (miser) {
        if (r.made) {
          ach('miser1'); bump(c, 'misers');
          if (c.misers >= 25) ach('miser25');
          if (c.misers >= 50) ach('miser50');
          if (net) ach('nMiser');
          if (r.dark) ach('darkMiser');
          if (g.sheet) ach('razMiser');
          if (bump(c, 'miserThisGame') >= 2) ach('bothMiser');
        } else ach('miserFail');
      } else if (r.made) {
        bump(c, 'made');
        if (c.made >= 200) ach('made200');
        if (net && bump(c, 'nmade') >= 100) ach('gBenya');
        if (r.got === r.need) { ach('exactNeed'); if (net) ach('nExact'); }
        if (r.got - r.need >= 3) { ach('over3'); if (net) ach('nOver3'); }
        if (mine >= 10) { ach('sweep'); if (net) ach('nSweep'); }
        if (K.trumpOf(r.contract) === null) { ach('noTrump6'); if (net) ach('nNoTrump'); }
        if (lvl === 10) { ach('tenth'); if (net) ach('nTenth'); if (g.sheet) ach('razTen'); }
        if (lvl === 9) { ach('nine'); if (net) ach('nNine'); }
        if (r.dark) {
          ach('dark1'); if (net) ach('darkNet');
          if (lvl >= 8) ach('darkBig');
          if (bump(c, 'darks') >= 3) ach('dark3');
        }
        if (r.unwhisted) ach('noWhist');
      } else {
        if (r.unwhisted) ach('setSelf');
        if (r.mountain[me] >= 20) ach('bigMinus');
        bump(c, 'sat');
        if (g.sheet) bump(c, 'satRaz');        // подсад в разбойнике считаем отдельно
        if (r.dark) bump(c, 'darkSat');        // сел на тёмной — но партию ещё можно взять
      }
    } else {
      // я в защите
      var iWhist = g.whist && (g.whist[me] === 'W' || g.whist[me] === 'H');
      if (!r.made && iWhist) {
        ach('whistSet'); bump(c, 'sets');
        if (c.sets >= 100) ach('set100');
        if (r.miss >= 3) { ach('whistSet3'); if (net) ach('nSet3'); }
        if (net && bump(c, 'nsets') >= 50) ach('gYaponchik');
        var alone = g.whisters.filter(function (q) {
          return g.whist[q] === 'W' || g.whist[q] === 'H';
        }).length === 1;
        if (alone) { ach('whistAlone'); if (net) { ach('nWhistAlone');
          if (bump(c, 'nalone') >= 15) ach('gReilly'); } }
        if (bump(c, 'setRow') >= 3) ach('defense3');
      } else if (r.made) { c.setRow = 0; }
      if (miser && !r.made) { ach('miserCatch'); if (net) ach('nMiserCatch');
        if (mine >= 3) ach('miserBig'); }
      /* Норма пары выполнена — это отдельное умение, а не случайность. */
      if (r.whistQuota != null && r.whistGot >= r.whistQuota && iWhist) ach('whistBoth');
      var wl = (g.whisters || []).filter(function (q) {
        return g.whist[q] === 'W' || g.whist[q] === 'H';
      });
      if (iWhist && wl.length === 2 && wl[wl.length - 1] === me && lvl >= 8 &&
        (!r.why || !r.why.whistShort[me])) ach('secondW');
      if (r.made) c.foreignMade = 1;         // соперник записал игру — пуля уже не чистая
      if (net && iWhist) { if (bump(c, 'nvisted') >= 150) ach('gBender'); }
      var v = r.whistAdd ? r.whistAdd[me] : 0;
      /* Отыграть свою гору вистами за одну сдачу. Гора и висты — разные
         деньги: в расчёте одно очко горы стоит десять вистов за каждого
         соперника, по этому курсу и сравниваем. */
      if (v && iWhist) {
        var gb = r.mtNow[me] - (r.mountain ? r.mountain[me] : 0);
        if (gb > 0 && v >= gb * 10 * g.N) ach('whistSave');
      }
      if (v) { bump(c, 'vists', v);
        if (c.vists >= 1000) ach('vist1000');
        if (v >= 20) ach('bigVist');
        for (var q3 = 0; q3 < g.N; q3++) if (g.whists[me][q3] >= 100) {
          ach('vist100'); if (isNet()) ach('nVist100');
        } }
      if (iWhist && r.made && (!r.why || !r.why.whistShort[me])) {
        if (bump(c, 'quotaRow') >= 10) ach('whistPerfect');
        if (bump(c, 'quota') >= 20) ach('whistQuota');
      } else if (iWhist) { c.quotaRow = 0; }
    }
    saveCnt(c);
  }

  /* Итог партии. Тут же ведём общую статистику: она видна в профиле и
     уезжает в комнату на карточке игрока. */
  function achGame(g) {
    var me = UI.me ? UI.me() : 0, c = cnt(), st = stats(), net = isNet();
    /* Победителя определяет расчёт, а не пуля: закрыть её первым и всё
       равно проиграть можно легко, если набрал гору и раздал висты.
       Проверено прогоном — в четырёх партиях из пятнадцати победитель
       по расчёту не тот, кто первым закрыл пулю. */
    var sc = [], po = [], i, j;
    for (i = 0; i < g.N; i++) {
      sc.push(scoreOf(g, i));
    }
    var poAll = K.settle(g.pool, g.mountain, null);            // то же самое, но без вистов
    for (i = 0; i < g.N; i++) {
      po.push(poAll[i]);
    }
    var best = 0;
    for (i = 1; i < g.N; i++) if (sc[i] > sc[best]) best = i;
    var won = (best === me);

    st.games++; st.hands = (st.hands || 0) + g.handNo;
    st.pool = (st.pool || 0) + g.pool[me];
    st.gora = (st.gora || 0) + g.mountain[me];

    /* ---------- рейтинг в вистах ----------

       Партия кончается не «победой», а расчётом: кто-то забирает
       вистами, кто-то платит. Это и есть единственная честная мера
       игрока на дистанции — побед можно набрать на слабых столах, а
       висты считают, СКОЛЬКО ты выиграл.

       Расчёт теперь ноль-сумма сам по себе, и вычитать среднее не надо:
       оно и так ноль. Раньше приходилось — старая формула считала
       разницу не с соперниками, а с нулём, и сумма по столу не
       сходилась. Плюс идёт в «выиграно», минус в «проиграно» — две
       цифры, как их и пишут после партии. */
    var pts = Math.round(sc[me]);
    if (pts >= 0) st.vWon = (st.vWon || 0) + pts;
    else st.vLost = (st.vLost || 0) - pts;

    /* Спортивный рейтинг — см. формулу выше. */
    var myR = eloOf(st), fo = 0, nf = 0;
    for (i = 0; i < g.N; i++) if (i !== me) { fo += foeRate(g, i); nf++; }
    var D = myR - (nf ? fo / nf : myR);
    var Kc = KCONV[(g.o && g.o.conv) || 'finka'] || 1;
    var S = Math.min(1, (g.handNo || 0) / 20);
    var prov = ((st.games || 0) <= PROV) ? PROV_X : 1;
    st.elo = Math.max(100, Math.round(myR + (pts * Kc - D) * S / 50 * prov));
    if (won) st.wins++;
    if (net) { st.net = (st.net || 0) + 1; if (won) st.netWins = (st.netWins || 0) + 1; }
    saveStats(st);

    if (won) {
      ach('first');
      if (st.wins >= 10) ach('w10');
      if (st.wins >= 20) ach('w20');
      if (st.wins >= 50) ach('w50');
      if (st.wins >= 100) ach('w100');
      if (st.wins >= 200) ach('w200');
      if (st.wins >= 500) ach('w500');
      if (bump(c, 'row') >= 3) ach('streak3');
      if (c.row >= 5) ach('streak5');
      if (c.row >= 10) ach('streak10');
      if (!g.mountain[me]) { ach('clean0'); ach('gora0'); if (net) ach('nClean'); }
      if (g.N === 3) { if (bump(c, 'w3') >= 25) ach('three25'); }
      else { if (bump(c, 'w4') >= 25) ach('four25'); }
      if (c.w3 && c.w4) ach('allModes');
      if (net) {
        st.netWins >= 10 && ach('nW10');
        st.netWins >= 50 && ach('nW50');
        st.netWins >= 100 && ach('nW100');
        if (bump(c, 'nrow') >= 3) ach('nS3');
        if (c.nrow >= 5) ach('nS5');
        if (c.nrow >= 10) ach('nS10');
        ach('net1');
        if (bump(c, 'netw') >= 5) ach('net5');
      }
      if (!c.sat) ach('noSit');
      /* Выиграл не игрой, а вистами: по пуле и горе я соперника не
         обошёл — обошёл тем, что записал на нём. */
      var byPool = true;
      for (i = 0; i < g.N; i++) if (i !== me && po[i] >= po[me]) byPool = false;
      if (!byPool) ach('vistAll');
      /* Догнал: за две сдачи до конца шёл вторым. */
      if (g.handNo >= 3 && c.behind3) ach('catchup');
      /* Ни одной чужой игры за всю партию. */
      if (!g.sheet && !c.foreignMade) ach('noLoss');
      if (c.behind >= g.target / 2) { ach('comeback'); if (net) ach('nComeback'); }
      if (net && !c.sat) { if (bump(c, 'nclean') >= 75) ach('gKholodnaya'); }
      if (net && !c.tookGame) { if (bump(c, 'nSonka') >= 10) ach('gSonka'); }
      if (net && !g.sheet) {
        var top = 0;
        for (i = 0; i < g.N; i++) if (i !== me && g.pool[i] > top) top = g.pool[i];
        if (top * 3 < g.target) { if (bump(c, 'nAkh') >= 10) ach('gAkhmatova'); }
      }
      if (g.sheet) { ach('razFirst');
        if (!c.satRaz) ach('razClean');
        if (g.sheet[me].length >= 12) ach('razFull');
        if (net) ach('razNet'); }
      /* «Рискнул и сел» — про того, кто сел на тёмной и всё равно взял
         партию. Раньше условие стояло внутри ветки победы и проверяло
         поражение, то есть не срабатывало никогда. */
      if (c.darkSat) ach('darkSet');
    } else { c.row = 0; c.nrow = 0; }

    /* Сколько сдач заняла партия и как шла гора — это про партию
       целиком, и считать это можно только тут. */
    if (won && g.handNo <= 10) ach('solo10');
    if (won && g.handNo <= 6) ach('fastPool');
    if (g.handNo >= 20) ach('long20');
    if (c.deepGora >= 30) ach('deepMinus');
    if (won && g.target >= 20) { ach('pool2x'); ach('bigPool'); }
    if (g.pool[me] >= 20) ach('pool20');
    bump(c, 'poolTotal', g.pool[me]);
    if (c.poolTotal >= 100) ach('pool100');
    if (won) {
      var half = 0;
      for (i = 0; i < g.N; i++) if (i !== me && g.pool[i] > half) half = g.pool[i];
      if (half * 2 < g.pool[me]) { ach('crushPool'); if (net) ach('nCrush'); }
      var one = true;
      for (i = 0; i < g.N; i++) if (i !== me && sc[i] > sc[me] - 25) one = false;
      if (!one) ach('one1');
      // роспись, в которой выиграл
      var cv = (g.o && g.o.conv) || 'finka';
      c.convs = c.convs || '';
      if (c.convs.indexOf(cv[0]) < 0) c.convs += cv[0];
      if (c.convs.length >= 3) ach('allConv');
      if (CFG.level >= 3) { if (bump(c, 'katala') >= 25) ach('katala25'); ach('botHard');
        if (g.N === 3) ach('solo3'); }
      if (!CFG.talk) ach('silent');
    }
    if (CFG.talk) { if (bump(c, 'talky') >= 10) ach('odessit'); }
    if (g.N === 4) { if (bump(c, 'g4') >= 10) ach('four10'); }
    if (net) {
      if (Net.S.host) { if (bump(c, 'hosted') >= 10) ach('host10');
        if (bump(c, 'rooms') >= 50) ach('gDuke'); }
      else { if (bump(c, 'guested') >= 10) ach('guest10'); }
      var live = 0;
      for (i = 0; i < g.N; i++) if (Net.S.conns && Net.S.conns[i] && (i === 0 || Net.S.conns[i].conn)) live++;
      if (live >= 4) ach('full4');
      if (live >= 2) { ach('live1'); if (bump(c, 'liveW') >= 5) ach('live5'); }
      if (won && g.N === 3) bump(c, 'nw3');
      if (won && g.N === 4) bump(c, 'nw4');
      if (c.nw3 && c.nw4) ach('nBoth');
      if (c.nw3 >= 25 && c.nw4 >= 25) ach('gUtyosov');
      if (won && live === 2) ach('duelNet');
    }
    if (facesOpen().length >= 100) ach('coll100');
    if (st.games >= 100) ach('g100');
    if (st.games >= 250) ach('g250');
    if (st.games >= 500) ach('g500');
    if (net) {
      if (st.net >= 10) ach('nG10');
      if (st.net >= 50) ach('nG50');
      if (st.net >= 100) ach('nG100');
      if (st.net >= 250) ach('nG250');
      if (st.net >= 500) ach('gInber');
      if (!won && bump(c, 'nlost') >= 100) ach('gPopandopulo');
    }
    // день за столом — для «недели» и «месяца»
    var day = new Date().toISOString().slice(0, 10);
    var days = [];
    try { days = JSON.parse(ls('days', '[]')) || []; } catch (e) { }
    if (days.indexOf(day) < 0) { days.push(day); try { lsSet('days', JSON.stringify(days)); } catch (e) { } }
    if (days.length >= 7) ach('week7');
    if (days.length >= 30) ach('month30');
    if (net) {
      var nd = [];
      try { nd = JSON.parse(ls('ndays', '[]')) || []; } catch (e) { }
      if (nd.indexOf(day) < 0) { nd.push(day); try { lsSet('ndays', JSON.stringify(nd)); } catch (e) { } }
      if (nd.length >= 7) ach('nD7');
      if (nd.length >= 30) ach('nD30');
      if (nd.length >= 60) ach('gSashka');
    }
    var h = new Date().getHours();
    if (h >= 0 && h < 5) ach('night');
    c.miserThisGame = 0; c.sat = 0; c.satRaz = 0; c.darkSat = 0;
    c.behind = 0; c.deepGora = 0; c.raspasThisGame = 0; c.six = 0; c.big = 0;
    c.bids = ''; c.wasRaspas = 0;
    c.behind1 = 0; c.behind2 = 0; c.behind3 = 0;
    c.foreignMade = 0; c.tookGame = 0;
    saveCnt(c);
  }

  function toMenu() { mainMenu(); }

      /* Регистр как в клаборе: обычная строчная надпись. Капслоком набранная

      (back ? '<button class="btn wide" id="mBack">Вернуться за стол ' + esc(back.code) + '</button>' : '') +
      '<button class="btn wide" id="mHall">Поднять свой стол</button>' +

      /* Роспись и состав — строкой под кнопками. Целую карточку справа

      segWire(m, 'segR', function (v) { CFG.raz = v === '1'; saveCfg(); newGameDialog(); });
      segWire(m, 'segCd', function (v) { CFG.card = v; saveCfg(); newGameDialog(); });

  /* ---------- настройки ----------
     Тоже экран, а не окошко: уровень ботов и базар — это выбор, а выбор
     у нас теперь везде сегментом. */
  function settings() {
    var LV = { 1: 'Новичок берёт игру смелее, чем стоило бы, и вистует по настроению.',
      2: 'Дворовый считает руку и редко лезет без карты.',
      3: 'Катала решает расклады целиком и наказывает за каждую ошибку.' };
    menuScreen('set', {
      title: 'Настройки',
      sub: 'Как играют соперники и сколько они говорят.',
      body:
        '<h4 class="hd">Соперники</h4>' +
        segHTML('segLv', CFG.level, [[1, 'Новичок'], [2, 'Дворовый'], [3, 'Катала']]) +
        '<div class="hint">' + LV[CFG.level] + '</div>' +
        '<h4 class="hd">Базар за столом</h4>' +
        segHTML('segT2', CFG.talk ? 1 : 0, [[1, 'Говорят'], [0, 'Тишина']]) +
        '<div class="hint">Тишина выключает только трёп. Заявки, вист и пас звучат всегда — ' +
        'это часть игры, а не украшение.</div>' +
        '<h4 class="hd">Звук</h4>' +
        segHTML('segS', CFG.snd ? 1 : 0, [[1, 'Со звуком'], [0, 'Без звука']]) +
        '<div class="hint">Карты, взятки и комната. На звук заявок не влияет.</div>' +

        /* Брокер — это сваха: он знакомит два браузера, а карты дальше
           ходят напрямую, мимо него. Общий, публичный, у некоторых
           провайдеров просто не открывается — сокет рвётся без ответа, и
           ни стол, ни комната не поднимаются. Лечится только другим
           адресом, поэтому он тут, а не зашит в сборку. */
        '<h4 class="hd">Свой брокер</h4>' +
        '<input class="fld" id="brk" maxlength="120" spellcheck="false" ' +
        'placeholder="пусто — общий брокер" value="' + esc(Net.brokerText()) + '">' +
        '<div class="row"><button class="btn wide" id="brkGo">Проверить связь</button></div>' +
        '<div class="hint" id="brkOut">Брокер только знакомит игроков между собой — ' +
        'карты потом ходят напрямую, и через него не проходят. Если общий недоступен у ' +
        'вашего провайдера, впишите свой: <b>мойсервер.ру</b>, <b>мойсервер.ру:9000</b> ' +
        'или <b>https://мойсервер.ру/путь</b>. Пусто — как раньше. Адрес должен быть один ' +
        'и тот же у всех за столом.</div>',
      back: mainMenu, backText: 'Назад'
    }, function (m) {
      segWire(m, 'segLv', function (v) { CFG.level = +v; saveCfg(); settings(); });
      segWire(m, 'segT2', function (v) { CFG.talk = v === '1'; saveCfg(); settings(); });
      segWire(m, 'segS', function (v) {
        CFG.snd = v === '1'; saveCfg();
        if (ART.setSnd) ART.setSnd(CFG.snd);
        settings();
      });
      var brk = m.querySelector('#brk'), out = m.querySelector('#brkOut');
      function saveBrk() {
        if (Net.brokerText() === brk.value.trim()) return false;
        Net.setBroker(brk.value);
        /* Комната уже висит на старом адресе — переселяем. */
        try { if (window.Hall) { Hall.leave(); hallOn = false; hallEnter(); } } catch (e) { }
        return true;
      }
      brk.onchange = brk.onblur = saveBrk;
      m.querySelector('#brkGo').onclick = function () {
        saveBrk();
        out.textContent = 'Проверяю…';
        Net.testBroker().then(function (t) {
          out.textContent = (Net.brokerText() || 'общий брокер') + ' — ' + t;
        });
      };
    });
  }

  /* ---------- профиль ----------

     Ник про прежний: «поле профиля — насколько оно охуенно в клаборе и
     недопилено в преферансе». Было: имя, сетка портретов и три карточки
     цифр столбиком в узкой колонке. Стало как в клаборе — потому что там
     это уже продумано, а не потому, что похоже:

       шапка — портрет, имя и одной строкой всё нажитое: кто ты за
         столом, без вчитывания в таблицы;
       разделы с заголовками, а не сплошная лента;
       под сеткой портретов — био выбранного: портреты тут не аватарки,
         а люди со своей историей, и это единственное место, где её
         видно;
       счёт человеческим текстом и одной таблицей, а не тремя
         карточками, каждая из которых занимала полэкрана. */

  function pct(a, b) { return b ? Math.round(a * 100 / b) + '%' : '—'; }

  /* Что значит выбранный характер — и сразу пример его фразы. Одно
     слово «жлоб» ничего не говорит, а живая реплика говорит всё. */
  var CHAR_TXT = {
    auto: 'Характер подберётся по выбранному портрету — как у ботов.',
    b: 'Балагур треплется много и по любому поводу.',
    p: 'Понтярщик хвалится картой и собой.',
    j: 'Жлоб считает чужие висты вслух.',
    k: 'Катала говорит мало и по делу.',
    s: 'Шлимазл жалуется на карту, на прикуп и на жизнь.',
    off: 'Вы молчите. Соперники продолжают трепаться — замолкает только ваша рука.'
  };
  function charHint(c) {
    var t = CHAR_TXT[c] || CHAR_TXT.auto;
    if (c === 'auto' || c === 'off') return t;
    var ex = '';
    try { ex = (window.Talk && Talk.pick) ? Talk.pick(Talk.L.greet, c) : ''; } catch (e) { }
    return t + (ex ? ' Например: «' + esc(ex) + '»' : '');
  }

  function profLine() {
    var st = stats();
    if (!st.games && !st.hands) return 'Пока ничего не сыграно.';
    return 'Партий ' + st.games + ', побед ' + st.wins + ' · сдач ' + (st.hands || 0) +
      ' · рейтинг ' + rating(st);
  }

  /* Счёт одной таблицей. Цифра слева — что это, справа — сколько, и
     рядом серым то, что из неё следует: «12» без «это 67%» не говорит
     ничего. */
  function profTable() {
    var st = stats(), v = vistNet(st);
    function row(k, val, dim) {
      return '<tr><td>' + k + '</td><td class="v">' + val +
        (dim ? ' <span class="dim">' + dim + '</span>' : '') + '</td></tr>';
    }
    return '<table class="prof">' +
      row('Партий сыграно', st.games || 0,
        st.games ? 'побед ' + (st.wins || 0) + ', это ' + pct(st.wins, st.games) : '') +
      row('Сдач', st.hands || 0) +
      row('По сети', st.net ? (st.net + (st.netWins ? ', побед ' + st.netWins : '')) : 'ещё не играли') +
      row('Пуля за всё время', st.pool || 0, 'гора ' + (st.gora || 0)) +
      row('Вистов выиграно', '<i class="vw">' + (st.vWon || 0) + '</i>',
        'проиграно <i class="vl">' + (st.vLost || 0) + '</i>') +
      row('Чистый вист', '<i class="' + (v >= 0 ? 'vw' : 'vl') + '">' + (v > 0 ? '+' : '') + v + '</i>') +
      row('Рейтинг', rating(stats())) +
      '</table>';
  }

  /* Вход и облако (src/p10_cloud.js): тот же вход, что в «Колдовстве».
     Вошли — профиль один на все устройства, и под одним входом играть
     можно только в одном месте. */
  function cloudBox() {
    var C = Cloud, h = '<h4 class="hd">Вход и облако</h4><div id="cloudBox">';
    if (C.user) {
      h += '<div class="sub" style="margin:0">Вы вошли: <b>' + esc(C.user.name || C.user.email || 'игрок') + '</b>' +
        (C.user.email && C.user.name ? ' · ' + esc(C.user.email) : '') + '</div>' +
        '<div class="hint">Профиль хранится в облаке и одинаков на всех устройствах, где вы вошли этим же ' +
        'входом, — и в «Колдовстве» с «Клабором» вход тот же. Играть под одним входом можно только в одном месте: ' +
        'откроете игру на другом устройстве — здесь она остановится.' +
        (C.at ? ' Последнее сохранение в облако — ' + new Date(C.at).toTimeString().slice(0, 5) + '.' : '') + '</div>' +
        '<div class="row"><button class="btn wide" data-m="cl-out">Выйти из профиля</button></div>';
    } else {
      h += '<div class="hint">Войдите — и профиль (портреты, секреты, статистика) станет одним на всех ' +
        'ваших устройствах и не пропадёт при чистке браузера. Вход тот же, что в «Колдовстве» и «Клаборе».</div>' +
        '<div class="row"><button class="btn pri wide" data-m="cl-google">Войти через Google</button></div>' +
        '<input class="fld" id="clMail" type="email" autocomplete="email" placeholder="Почта">' +
        '<input class="fld" id="clPass" type="password" autocomplete="current-password" placeholder="Пароль">' +
        '<div class="row"><button class="btn wide" data-m="cl-in">Войти</button>' +
        '<button class="btn wide" data-m="cl-up">Создать вход</button></div>' +
        '<div class="row"><button class="btn wide" data-m="cl-reset">Забыли пароль?</button></div>';
    }
    return h + '<div class="hint" id="cloudMsg">' +
      (C.state === 'wait' ? 'Связываемся с облаком…' : (C.err ? 'Облако: ' + esc(C.err) : '')) + '</div></div>';
  }
  function cloudWire(m) {
    m.querySelectorAll('[data-m^="cl-"]').forEach(function (b) {
      b.onclick = function () { cloudClick(b.dataset.m, m); };
    });
  }
  function cloudClick(v, m) {
    if (v.indexOf('cl-') !== 0) return false;
    var say = function (t) { var e = m.querySelector('#cloudMsg'); if (e) e.textContent = t; };
    var fail = function (e) { say('Облако: ' + (e.message || e)); };
    var mail = ((m.querySelector('#clMail') || {}).value || '').trim();
    var pass = (m.querySelector('#clPass') || {}).value || '';
    if (v === 'cl-google') { say('Связываемся с облаком…'); Cloud.google().catch(fail); return true; }
    if (v === 'cl-out') {
      Cloud.signOut().then(function () { UI.toast('Вы вышли. Профиль остался и в этом браузере.'); }).catch(fail);
      return true;
    }
    if (v === 'cl-reset') {
      if (!mail) { say('Впишите почту — пришлём письмо для нового пароля.'); return true; }
      Cloud.reset(mail).then(function () { say('Письмо для нового пароля отправлено на ' + mail + '.'); }).catch(fail);
      return true;
    }
    if (!mail || !pass) { say('Впишите почту и пароль.'); return true; }
    say('Связываемся с облаком…');
    (v === 'cl-up' ? Cloud.signUp(mail, pass) : Cloud.signIn(mail, pass)).catch(fail);
    return true;
  }
  // вошли, вышли, забрали игру — экран профиля перерисовываем, если он открыт
  var cloudSeen = '';
  Cloud.on(function (C) {
    var k = (C.user ? C.user.uid : '') + '|' + C.owner + '|' + C.at;
    if (k === cloudSeen) return; cloudSeen = k;
    var a = document.activeElement;
    if (document.getElementById('cloudBox') && !(a && /^cl(Mail|Pass)$/.test(a.id))) profile();
  });

  function profile() {

    done.forEach(function (a2) { if (a2[3] >= GOLD0) gold++; });

    var faces = open.map(function (i) {

        '<h4 class="hd">Ваш портрет</h4>' +

        'наведите, и он скажет, за какое. Остальные открываются за игру.</div>' +

        '<h4 class="hd">Ваш характер за столом</h4>' +
        '<div class="hint">Вы тоже отпускаете фразочки — они всплывают над вашей рукой. ' +
        'Характер решает, какие именно.</div>' +
        segHTML('segCh', CFG.myChar, [['auto', 'Под портрет'], ['b', 'Балагур'],
          ['p', 'Понтярщик'], ['j', 'Жлоб'], ['k', 'Катала'], ['s', 'Шлимазл'],
          ['off', 'Молчу']], 'grid') +
        '<div class="hint">' + charHint(CFG.myChar) + '</div>' +

        '<h4 class="hd">Счёт</h4>' + profTable() +
        '<div class="hint">Рейтинг считается по-спортивному: важно не сколько вистов подняли, ' +
        'а с кем играли и на сколько обошли. Считаются только доигранные до конца партии.</div>' +

        '<h4 class="hd">Достижения ' + done.length + ' из ' + ACH.length +
        (gold ? ' · золотых ' + gold : '') + '</h4>' +
        '<div class="achlist">' + doneHTML + '</div>' +
        (left ? '<div class="hint">Закрыто ещё ' + left + '. Что именно — секрет: ' +
          'условие открывается вместе с портретом.</div>' : '') +

        /* Номер игрока. Ник: «нельзя было зайти дважды с одного
           профиля». Показываем тут же — у него есть одно живое
           применение: два устройства за одним столом. */
        '<h4 class="hd">Номер игрока</h4>' +
        '<div class="mcard" style="font:12px/1.4 ui-monospace,Consolas,monospace">' +
        esc(Net.myUid()) + '</div>' +
        '<div class="hint">По нему стол узнаёт вас и не пускает за него дважды: один ' +
        'номер — одно место. Вылетели и вернулись — сядете на своё, а не рядом с собой. ' +
        'Номер переносится вместе с профилем; меняйте его, только если хотите сесть за ' +
        'один стол с двух устройств сразу.</div>' +
        (Cloud.user ? '<div class="hint">Пока вы вошли, номер общий для всех ваших устройств — ' +
          'так один вход не сядет за стол дважды.</div>'
          : '<div class="row"><button class="btn wide" id="pUid">Сменить номер</button></div>') +

        '<h4 class="hd">Профиль на вынос</h4>' +
        '<div class="hint">Одна строка уносит с собой всё: имя, портрет, открытые портреты, ' +
        'достижения и счёт. Пригодится, чтобы перенести себя на другое устройство или ' +
        'вернуться после чистки браузера.</div>' +
        '<div class="row"><button class="btn wide" id="pMove">Перенести профиль</button></div>',
      back: mainMenu, backText: 'Готово'
    }, function (m) {

          CFG.face = +b2.dataset.f; saveCfg();
          var cc = cnt(); if (bump(cc, 'faceSwap') >= 10) ach('faces10'); saveCnt(cc);
          if (window.Hall && Hall.updateMe) { try { Hall.updateMe(myName(), CFG.face, hallCard()); } catch (e) { } }
          profile();
        };
      });
      segWire(m, 'segCh', function (v) {
        var nm = (m.querySelector('#pName').value || '').trim().slice(0, 14);
        if (nm) setName(nm);
        CFG.myChar = v; saveCfg(); profile();
      });
      var q = m.querySelector('#pQ');
      if (q) q.onclick = function () {
        UI.toast('Ещё ' + left + ' портретов — за достижения. Условие открывается вместе с портретом.');
      };

  }

  /* ---------- профиль на вынос ----------
     Хранилище браузера живёт ровно до первой чистки. Поэтому профиль
     умеет выезжать строкой: скопировал — вставил на другом устройстве,
     и портреты с достижениями на месте.

     При переносе профили СЛИВАЮТСЯ, а не затираются: открытые портреты
     и выбитые достижения складываются, счётчики берутся по большему.
     Иначе перенос со старого устройства обнулял бы новое. */
  function exportText() {
    var d = {
      v: 1, name: myName(), face: CFG.face, uid: Net.myUid(),
      faces: facesOpen(), ach: achList(), stats: stats(), conv: CFG.conv, ch: CFG.myChar
    };
    try { return 'PREF1:' + btoa(unescape(encodeURIComponent(JSON.stringify(d)))); }
    catch (e) { return 'PREF1:' + JSON.stringify(d); }
  }
  function importText(t, quiet) {
    t = String(t || '').trim();
    var i = t.indexOf('PREF1:');
    if (i < 0) return { ok: false, why: 'Это не строка профиля.' };
    t = t.slice(i + 6);
    var d = null;
    try { d = JSON.parse(decodeURIComponent(escape(atob(t)))); }
    catch (e) { try { d = JSON.parse(t); } catch (e2) { } }
    if (!d || !d.v) return { ok: false, why: 'Строка повреждена.' };

    /* Номер игрока — часть профиля: перенёс профиль — это по-прежнему
       ты, и за стол ты садишься одним человеком, а не двумя. */
    if (d.uid) Net.setUid(d.uid);
    /* quiet — это облако (src/p10_cloud.js): там профиль один на все
       устройства, поэтому имя, портрет и характер берутся оттуда всегда. */
    if (d.name && (quiet || myName() === 'Игрок')) setName(d.name);
    if (d.face != null && (quiet || CFG.face < 0)) { CFG.face = d.face; }
    if (quiet && d.ch) CFG.myChar = d.ch;

    var f = facesOpen(), k;
    (d.faces || []).forEach(function (x) { if (f.indexOf(x) < 0) f.push(x); });
    saveFaces(f);

    var a = achList();
    (d.ach || []).forEach(function (x) { if (a.indexOf(x) < 0) a.push(x); });
    try { lsSet('ach', JSON.stringify(a)); } catch (e) { }

    var st = stats(), ds = d.stats || {};
    for (k in st) if (typeof ds[k] === 'number' && ds[k] > st[k]) st[k] = ds[k];
    saveStats(st);

    if (d.conv && K.CONV[d.conv]) CFG.conv = d.conv;
    saveCfg();
    if (quiet) {
      try { if (Net.S.on && Net.updateMe) Net.updateMe(myName(), CFG.face); } catch (e) { }
      try { if (window.Hall && Hall.updateMe) Hall.updateMe(myName(), CFG.face, hallCard()); } catch (e) { }
    } else ach('loadFile');
    return { ok: true, faces: (d.faces || []).length, ach: (d.ach || []).length };
  }

  function dlgProfileMove() {
    UI.modal('<h3>Перенос профиля</h3>' +
      '<div class="sub">Скопируйте строку и вставьте её на другом устройстве. ' +
      'Профили складываются: портреты и достижения не пропадут, счётчики возьмутся по большему.</div>' +
      '<textarea id="pfOut" class="codearea" readonly>' + esc(exportText()) + '</textarea>' +
      '<div class="row"><button class="btn" id="pfCopy">Скопировать</button></div>' +
      '<div class="fld"><span>Вставить чужую строку</span>' +
      '<textarea id="pfIn" class="codearea" placeholder="PREF1:…"></textarea></div>' +
      '<div class="row"><button class="btn" id="pfGo">Поднять профиль</button>' +
      '<button class="btn" id="pfClose">Закрыть</button></div>' +
      '<div class="warn" id="pfWarn" hidden></div>',
      function (m) {

        };
        m.querySelector('#pfGo').onclick = function () {
          var r = importText(m.querySelector('#pfIn').value);

          UI.closeModal();
          UI.toast('Профиль поднят: портретов ' + r.faces + ', достижений ' + r.ach);
          profile();
        };
        m.querySelector('#pfClose').onclick = UI.closeModal;
      });
  }

      'раздачи перестаёт решать.</p>' +
      '</div><div class="row"><button class="btn wide" id="rBack">Назад</button></div>' },
      function (m) { m.querySelector('#rBack').onclick = mainMenu; });
  }

  /* ---------- карточка соседа по столу ----------

     Ник: «если я тыкаю портрет другого игрока — чтобы не было просто
     биографии, а была вся его стата (в сетевой игре)».

     Показываем два блока. Первый — ЗА ЭТИМ СТОЛОМ: пуля, гора, чистый
     вист прямо сейчас и взаимный счёт со мной. Это считается из
     состояния игры и есть всегда, даже у бота. Второй — ВИЗИТКА: что
     человек прислал о себе, садясь за стол. У ботов её нет, и вместо
     неё стоит уровень — врать, что бот сыграл триста партий, незачем.

     Биография портрета остаётся, но уезжает вниз: это украшение, а не
     то, за чем открывают карточку соседа. */
  function tableCard(p) {
    if (!G || !G.pool) return '';
    var pool = G.pool[p] || 0, gora = G.mountain[p] || 0;
    var sc = null;
    try { sc = K.settle(G.pool, G.mountain, G.whists); } catch (e) { }
    var net = sc ? Math.round(sc[p]) : null;
    var rows =
      '<div class="mline"><span>пуля</span><i>' + pool + '</i></div>' +
      '<div class="mline"><span>гора</span><i>' + gora + '</i></div>';
    if (net != null) rows += '<div class="mline"><span>чистый вист сейчас</span>' +
      '<i class="' + (net >= 0 ? 'vw' : 'vl') + '">' + (net > 0 ? '+' : '') + net + '</i></div>';
    /* Взаимный счёт — то, что за столом интересует больше всего: не
       «сколько он вообще», а «сколько между нами». Своё место спрашиваем
       у стола: у сетевого гостя оно не нулевое, и жёсткий ноль показал
       бы ему чужую пару вместо своей. */
    var me = (window.UI && UI.me) ? UI.me() : 0;
    if (G.whists && p !== me && G.whists[me] && G.whists[p]) {
      var my = G.whists[me][p] || 0, his = G.whists[p][me] || 0;
      rows += '<div class="mline"><span>я на него / он на меня</span><i>' +
        my + ' / ' + his + '</i></div>';
      var d = my - his;
      rows += '<div class="mline"><span>между нами</span><i class="' +
        (d >= 0 ? 'vw' : 'vl') + '">' + (d > 0 ? '+' : '') + d + '</i></div>';
    }
    return '<div class="mcard"><b>За этим столом</b>' + rows + '</div>';
  }

  function visitCard(p) {
    var c = G && G.stats && G.stats[p];
    if (!c) {
      /* Бот. Уровень — честная замена рейтингу: по нему и считается
         поправка на силу соперника в моём собственном рейтинге. */
      var lv = { 1: 'новичок', 2: 'дворовый', 3: 'катала' }[CFG.level] || 'дворовый';
      return '<div class="mcard"><b>Визитка</b>' +
        '<div class="mline"><span>это бот</span><i>' + lv + '</i></div>' +
        '<div class="mline"><span>условный рейтинг</span><i class="vw">' +
        (BOT_RATE[CFG.level] || RATE0) + '</i></div></div>';
    }
    var rows = '';
    if (c.games != null) rows += '<div class="mline"><span>партий</span><i>' + c.games +
      (c.wins != null ? ' <span class="dim">побед ' + c.wins + ', ' +
        pct(c.wins, c.games) + '</span>' : '') + '</i></div>';
    if (c.hands != null) rows += '<div class="mline"><span>сдач</span><i>' + c.hands + '</i></div>';
    if (c.net != null) rows += '<div class="mline"><span>по сети</span><i>' + c.net +
      (c.netWins != null ? ' <span class="dim">побед ' + c.netWins + '</span>' : '') + '</i></div>';
    if (c.vWon != null || c.vLost != null) rows += '<div class="mline"><span>вистов ' +
      'выиграно / проиграно</span><i><span class="vw">' + (c.vWon || 0) +
      '</span> / <span class="vl">' + (c.vLost || 0) + '</span></i></div>';
    if (c.vist != null) rows += '<div class="mline"><span>чистый вист за всё время</span>' +
      '<i class="' + (c.vist >= 0 ? 'vw' : 'vl') + '">' + (c.vist > 0 ? '+' : '') +
      c.vist + '</i></div>';
    if (c.elo != null) rows += '<div class="mline"><span>рейтинг</span><i class="vw">' +
      c.elo + '</i></div>';
    if (!rows) return '<div class="sub">Визитка ещё не доехала.</div>';
    return '<div class="mcard"><b>Визитка</b>' + rows + '</div>';
  }

  function showProfile(p) {
    if (!G || !G.faces) return;
    var f = G.faces[p];
    var bio = (f >= 0 && ART.FACE_BIO[f]) ? ART.FACE_BIO[f] : '';
    var who = [];
    if (p === ((window.UI && UI.me) ? UI.me() : 0)) who.push('это вы');
    if (G.dealer === p) who.push('сдаёт');
    if (G.declarer === p) who.push('играет');
    var head = '<div class="profhead">' +
      ART.ava(f, (G.names[p] || '?').charAt(0), 'big') +
      '<div><div class="pname">' + esc(G.names[p]) + '</div>' +
      (who.length ? '<div class="sub" style="margin:0">' + who.join(' · ') + '</div>' : '') +
      '</div></div>';
    UI.modal(head + tableCard(p) + visitCard(p) +
      (bio ? '<div class="bio">' + esc(bio) + '</div>' : '') +
      '<div class="row"><button class="btn" id="bpc">Закрыть</button></div>',
      function (m) { m.querySelector('#bpc').onclick = UI.closeModal; }, { light: true });
  }

  function statCard() {
    var st = stats();
    /* `elo` в карточке — не украшение: по нему соперники считают свою
       поправку на силу стола. Нет карточки (бот, старая сборка) — её
       место займёт рейтинг по уровню бота. */
    return { name: myName(), face: CFG.face, games: st.games, wins: st.wins,
      hands: st.hands || 0, net: st.net || 0, netWins: st.netWins || 0,
      vWon: st.vWon || 0, vLost: st.vLost || 0,
      elo: rating(st), vist: vistNet(st) };
  }


  /* ============================================================
     СЕТЕВОЙ СТОЛ

     Сервера нет: комната поднимается прямо в браузере хозяина, гости
     приходят по четырёхзначному коду. Хозяин считает правила и рассылает
     состояние, гости рисуют и отсылают свои ходы.

     Пустые места занимают боты — стол не ждёт, пока соберётся полный
     состав. Вышел живой игрок — на его место садится бот, вернулся по
     своему ключу — забирает место обратно.
     ============================================================ */

  /* Кнопка «Сеть» живёт только за сетевым столом. В одиночной игре её
     быть не должно вовсе: Ник — «кнопки в одиночной игре при нажатии
     никак не реагируют». Она и не реагировала — висела мёртвой, потому
     что прятали её только после входа в сеть, а при запуске не трогали
     вовсе. Теперь прячется сразу, а за столом показывает код и умеет
     оттуда выйти. */
  function netBtn() {
    var b = $('#bNet');
    if (!b) return;
    var on = !!(window.Net && Net.S && Net.S.on);
    b.hidden = !on;
    if (on) b.textContent = 'Стол ' + Net.S.code;
  }
  function netInfo() {
    if (!(window.Net && Net.S && Net.S.on)) return;
    var host = Net.S.host;
    UI.modal('<h3>Стол ' + esc(Net.S.code) + '</h3>' +
      '<div class="sub">' + (host ? 'Вы подняли этот стол.' : 'Вы за чужим столом.') +
      ' Код можно передать тому, кого зовёте.</div>' +
      '<div class="row"><button class="btn" id="nClose">Назад за стол</button>' +
      '<button class="btn" id="nLeave">Покинуть стол</button></div>',
      function (m) {
        m.querySelector('#nClose').onclick = UI.closeModal;
        m.querySelector('#nLeave').onclick = function () {
          UI.closeModal(); Net.leave(); netBtn(); mainMenu();
        };
      });
  }

  /* Хозяин начинает партию. Живые сидят на своих местах, пустые занимают
     боты — с одесскими именами и портретами, как за обычным столом. */
  function netStart() {
    var N = Net.S.cfg.N, i;
    var names = Net.names().slice(0, N);
    var faces = [], busy = [CFG.face];
    for (i = 0; i < N; i++) {
      var live = (i === 0) || !!(Net.S.conns[i] && Net.S.conns[i].conn);
      if (live) {
        var f = (Net.S.conns[i] && Net.S.conns[i].face != null) ? Net.S.conns[i].face : CFG.face;
        faces.push(f); busy.push(f);
      } else {
        var sex = (i % 2) ? 'm' : 'f';
        var bf = pickFace(sex, busy); busy.push(bf); faces.push(bf);
        names[i] = NAMES.make(ART.FACE_SEX.charAt(bf) === 'f' ? 'f' : 'm', null,
          names.map(function (x) { return String(x).split(' ')[0]; }));
      }
    }
    G = new Engine.Game(Object.assign({
      players: N, names: names, target: CFG.target
    }, K.opts(CFG.conv), CFG.raz
      ? { razboynik: true, card: (CFG.card === 'full' ? K.CARD_FULL : K.CARD_SHORT) }
      : {}));
    G.faces = faces; G.lvl = CFG.level;
    G.stats = [statCard()];
    for (i = 1; i < N; i++) G.stats[i] = (Net.S.conns[i] && Net.S.conns[i].stats) || null;
    if (window.Talk) Talk.reset();
    UI.attach(G, [], 0);
    Net.startGame(G);
    G.newHand();
    Net.broadcast(G);
    UI.closeModal(); UI.closeSplash();
    UI.netEvents([]);
    netBtn();
    toTable();
    if (window.Hall && Hall.where) Hall.where('table');
  }

  /* ---------- экран создания стола ---------- */
  /* ---------- свой стол ----------
     Тот же экран, что и «Новая партия», только вместо «играть с ботами»
     поднимается стол с кодом. Настройки — теми же сегментами: чтобы
     человек не гадал, где переключатель, а где действие. */
  function scrHost() {
    menuScreen('host', {
      title: 'Свой стол',
      sub: 'Стол поднимается прямо в браузере. Пустые места займут боты — ' +
        'живой игрок может сесть на место бота в любой момент.',
      body:
        '<h4 class="hd">Ваше имя</h4>' +
        '<input class="fld" id="hostName" maxlength="14" placeholder="Ваше имя" value="' +
        esc(myName()) + '">' +
        '<h4 class="hd">Кто за столом</h4>' +
        segHTML('segHN', CFG.players, [[3, 'Втроём'], [4, 'Вчетвером']]) +
        '<h4 class="hd">Роспись</h4>' +
        segHTML('segHC', CFG.conv, Object.keys(K.CONV).map(function (c) {
          return [c, esc(K.CONV[c].name)];
        })) +
        '<div class="hint">' + esc(K.CONV[CFG.conv].note) + '</div>' +
        '<h4 class="hd">Пуля до</h4>' +
        segHTML('segHT', CFG.target, [[6, '6 — короткая'], [10, '10 — обычная'], [20, '20 — длинная']]) +
        '<div class="row"><button class="btn pri wide" id="hGo">Поднять стол</button></div>' +
        '<div class="warn" id="netWarn" hidden></div>',
      back: mainMenu, backText: 'Назад'
    }, function (m) {
      function keepName() {
        var v = (m.querySelector('#hostName').value || '').trim().slice(0, 14);
        if (v) setName(v);
      }
      segWire(m, 'segHN', function (v) { keepName(); CFG.players = +v; saveCfg(); scrHost(); });
      segWire(m, 'segHC', function (v) { keepName(); CFG.conv = v; saveCfg(); scrHost(); });
      segWire(m, 'segHT', function (v) { keepName(); CFG.target = +v; saveCfg(); scrHost(); });
      m.querySelector('#hGo').onclick = function () {
        var hn = (m.querySelector('#hostName').value || '').trim().slice(0, 14) || 'Хозяин';
        setName(hn);
        this.textContent = 'Поднимаю стол…';
        var w = m.querySelector('#netWarn');
        Net.S.myFace = CFG.face;
        Net.createRoom({ N: CFG.players, o: K.opts(CFG.conv), target: CFG.target },
          hn, Net.lobbyPush, null, CFG.face)
          .then(function () {
            netBtn();
            if (window.Hall && Hall.table) Hall.table(Net.S.code, CFG.players);
            scrHostLobby();
          })
          .catch(function (e) {
            var g2 = m.querySelector('#hGo');
            if (g2) g2.textContent = 'Поднять стол';
            if (w) { w.hidden = false; w.textContent = 'Не вышло: ' + ((e && e.message) ? e.message : e); }
          });
      };
    });
  }

  /* ---------- места за столом ----------

     Строки мест рисовались функцией seatRows(), которую так и не
     написали: «Поднять стол» падал с «seatRows is not defined», и
     сетевая игра не поднималась вовсе. Берём рабочий вариант из
     клабора — стили под него в оболочке уже лежат. */
  function hostSeatList() {
    return Net.S.conns.map(function (c, i) {
      return { seat: i, name: c.name, online: !!c.conn || i === 0,
        bot: c.bot && i !== 0, face: c.face };
    });
  }

  function seatRow(p2) {
    var mySeat = Net.S.on ? Net.S.seat : -1;
    var st = p2.seat === 0 ? 'хозяин'
      : (p2.online ? 'на месте' : (p2.name ? 'отключился, ведёт бот' : 'свободно'));
    if (p2.seat === mySeat) st = 'вы';
    var canKick = Net.S.on && Net.S.host && !Net.S.ready && p2.seat > 0 && p2.online && p2.name;
    return '<div class="seatrow' + (p2.online ? ' on' : '') + '"><span class="dot"></span>' +
      ART.ava(p2.face != null ? p2.face : -1, (p2.name || '?').charAt(0).toUpperCase(), 'sm') +
      '<span class="nm">' + esc(p2.name || ('Место ' + (p2.seat + 1))) + '</span>' +
      '<span class="st">' + st + '</span>' +
      (canKick ? '<button class="kick" data-kick="' + p2.seat + '" title="Убрать со стола">×</button>' : '') +
      '</div>';
  }
  function seatRows(list) {
    return (list || []).map(seatRow).join('');
  }

  function scrHostLobby() {
    menuScreen('hostlobby', {
      title: 'Стол собран',
      sub: 'Играем <b>' + (CFG.players === 4 ? 'вчетвером' : 'втроём') + '</b>, роспись <b>' +
        esc(K.CONV[CFG.conv].name) + '</b>, пуля до <b>' + CFG.target +
        '</b> у каждого. Свободные места ведут боты — живой игрок может сесть на место бота.',
      body:
        '<div class="codebox"><b>' + esc(Net.S.code) + '</b>' +
        '<span>код стола — продиктуйте или скиньте игрокам</span></div>' +
        '<div class="seats" id="seatsBox">' + seatRows(hostSeatList()) + '</div>' +
        '<div class="row"><button class="btn pri wide" id="lGo">Начать партию</button></div>' +
        '<div class="row"><button class="btn wide" id="lClose">Закрыть стол</button></div>',
      back: null
    }, function (m) {
      m.querySelector('#lGo').onclick = netStart;
      m.querySelector('#lClose').onclick = function () { Net.leave(); netBtn(); mainMenu(); };
      var box = m.querySelector('#seatsBox');
      if (box) box.onclick = function (ev) {
        var b = ev.target.closest('[data-kick]');
        if (b) Net.kick(+b.dataset.kick);
      };
    });
  }

  /* ---------- гость ---------- */
  function scrJoin(pre) {
    var back = Net.savedBack && Net.savedBack();
    var open = facesOpen();
    var faces = open.map(function (i) {
      var d = achOfFace(i);
      var tip = d ? (d[1] + ' — ' + d[2]) : ((ART.FACE_BIO && ART.FACE_BIO[i]) || '');
      return '<button class="fc' + (i === CFG.face ? ' on' : '') +
        (d ? (i >= GOLD0 ? ' gold' : ' rare') : '') +
        '" data-f="' + i + '" title="' + esc(tip) + '">' + ART.ava(i, '?') + '</button>';
    }).join('');
    var bio = (ART.FACE_BIO && ART.FACE_BIO[CFG.face])
      ? '<div class="bio">' + esc(ART.FACE_BIO[CFG.face]) + '</div>' : '';

    menuScreen('join', {
      title: 'Присоединиться',
      sub: 'Спросите у хозяина код из четырёх знаков. Настройки стола задаёт он — ' +
        'вы выбираете только имя и портрет.',
      body:
        '<h4 class="hd">Код стола</h4>' +
        '<input class="fld codein" id="jCode" maxlength="4" placeholder="ABCD" value="' +
        esc(pre || '') + '">' +
        '<h4 class="hd">Как вас звать</h4>' +
        '<input class="fld" id="jName" maxlength="14" placeholder="Ваше имя" value="' +
        esc(myName()) + '">' +
        '<h4 class="hd">Ваш портрет</h4>' +
        '<div class="facerow">' + faces + '</div>' + bio +
        (back ? '<h4 class="hd">Ключ места — если возвращаетесь</h4>' +
          '<div class="hint">Вы уже сидели за столом <b>' + esc(back.code) +
          '</b>. Кнопка ниже посадит вас на своё место, а не на свободное.</div>' +
          '<div class="row"><button class="btn wide" id="jBack2">Вернуться за стол ' +
          esc(back.code) + '</button></div>' : '') +
        '<div class="row"><button class="btn pri wide" id="jGo">Сесть за стол</button></div>' +
        '<div class="warn" id="jWarn" hidden></div>',
      back: mainMenu, backText: 'Назад'
    }, function (m) {
      if (back) m.querySelector('#jBack2').onclick = function () { resumeBack(back); };
      m.querySelectorAll('[data-f]').forEach(function (b2) {
        b2.onclick = function () {
          var nm = (m.querySelector('#jName').value || '').trim().slice(0, 14);
          if (nm) setName(nm);
          CFG.face = +b2.dataset.f; saveCfg();
          scrJoin((m.querySelector('#jCode').value || '').trim().toUpperCase());
        };
      });
      m.querySelector('#jGo').onclick = function () {
        var nm = (m.querySelector('#jName').value || '').trim().slice(0, 14) || 'Гость';
        var code = (m.querySelector('#jCode').value || '').trim().toUpperCase();
        var w = m.querySelector('#jWarn');
        if (code.length !== 4) {
          w.hidden = false; w.textContent = 'Код из четырёх знаков.'; return;
        }
        setName(nm);
        this.textContent = 'Стучусь…';
        joinAnd(code, nm, '');
      };
    });
  }

  function joinAnd(code, nm, key) {
    Net.S.myFace = CFG.face;
    Net.joinRoom(code, nm, key || Net.LS('pref-key-' + code) || '', CFG.face)
      .then(function () { netBtn(); scrGuestLobby(); })
      .catch(function (e) {
        UI.toast('Не вышло: ' + ((e && e.message) ? e.message : e));
        scrJoin(code);
      });
  }
  function resumeBack(d) {
    if (!d) return;
    UI.toast('Возвращаемся за стол ' + d.code);
    joinAnd(d.code, myName(), d.key);
  }

  function scrGuestLobby() {
    var list = (Net.lobbyList && Net.lobbyList()) || [];
    menuScreen('guestlobby', {
      title: 'Ждём хозяина',
      sub: 'Партию начинает хозяин стола. Это окно можно закрыть — стол позовёт сам.',
      body:
        '<div class="codebox"><b>' + esc(Net.S.code) + '</b>' +
        '<span>вы за этим столом, место ' + ((Net.S.seat | 0) + 1) + '</span></div>' +
        /* Net.lobbyList() отдаёт готовые места целиком
           ({seat, name, online, bot, face}) — заворачивать их ещё раз не
           нужно. Прежний экран считал их строками и печатал бы
           «[object Object]» на каждом месте. */
        '<div class="seats">' + seatRows(list) + '</div>' +
        '<div class="row"><button class="btn wide" id="gLeave">Выйти из-за стола</button></div>',
      back: null
    }, function (m) {
      m.querySelector('#gLeave').onclick = function () { Net.leave(); netBtn(); mainMenu(); };
    });
  }

  function lobbyRefresh() {
    if (!Net.S.on) return;
    if (Net.S.host) { if ($('#splash').dataset.k === 'hostlobby') scrHostLobby(); }
    else if ($('#splash').dataset.k === 'guestlobby') scrGuestLobby();
  }
  function lobbySeat() { if (Net.S.on && !Net.S.host) scrGuestLobby(); }


  /* ============================================================
     ОБЩАЯ КОМНАТА

     Зал без сервера: все, кто открыл игру, пытаются занять одно и то
     же имя. Кому повезло — тот и держит комнату, остальные к нему
     подключаются. Упал главный — комната переизбирает его сама.

     Зачем: чтобы не диктовать код стола по телефону. Поднял стол —
     о нём видят все в комнате и заходят одной кнопкой.
     ============================================================ */
  var hallOn = false;

  function hallCard() {
    var st = stats();
    return { games: st.games, wins: st.wins, net: st.net };
  }

  /* ---------- комната: колонка справа на КАЖДОМ экране меню ----------

     Раньше комната была отдельным экраном за кнопкой, а справа в меню
     висела карточка со статистикой. Из-за этого выходило ровно то, на
     что жаловался Ник: «чата в лобби нет, а оно должно быть всегда
     справа», и «зачем-то статистику запихнул, а она должна быть в
     профиле». Статистика уехала в профиль, комната встала на её место и
     держится рядом с любым экраном меню — кроме тех минут, когда идёт
     партия: за столом комната не нужна.

     Устройство взято у клабора целиком, вместе с тем, что там уже
     отработано: чат первой вкладкой (разговор виден сразу), число людей
     прямо в ярлыке второй, точка непрочитанного, звук и сворачивание
     двумя круглыми иконками в шапке. */
  var hallTab = 'log', hallSeen = 0, hallFold = false;

  /* Вышли в меню из партии — за столом нас больше нет, даже если объект
     партии цел. Без этого меню считало, что мы всё ещё играем: прятало
     комнату и держало отметку «играет» до перезагрузки. Так же сделано в
     клаборе. */
  var leftTable = false;
  function toTable() { leftTable = false; }
  function atTable() {
    if (leftTable) return false;
    return !!(G && !G.over) || !!(window.Net && Net.S && Net.S.on && Net.S.game && !Net.S.game.over);
  }

  function hallTabs() {
    var S = Hall.S, n = (S.on && S.ready && !S.err) ? S.members.length : 0;
    var unread = Hall.log().length - hallSeen;
    return '<button class="htab' + (hallTab === 'log' ? ' on' : '') + '" data-ht="log">Чат' +
      (hallTab !== 'log' && unread > 0 ? ' <i class="hnew"></i>' : '') + '</button>' +
      '<button class="htab' + (hallTab === 'people' ? ' on' : '') + '" data-ht="people">Люди' +
      (n ? ' <i class="hnum">' + n + '</i>' : '') + '</button>';
  }


  /* ---------- кто сейчас в сети и чем занят ----------

     Ник: «можешь показывать тех, кто онлайн, но условно в игре? В сетевой
     или просто с ботами?» Раньше ответ был «нет»: сел играть — вышел из
     комнаты, и она показывала «Люди 1», сколько бы столов ни шло рядом.
     Теперь человек из комнаты не исчезает, а получает отметку, и строка
     под вкладками разбирает всех по занятиям. */
  function hallOnline() {
    var S = Hall.S;
    if (!S.on || !S.ready || S.err) return '';
    var c = Hall.counts();
    if (c.all <= 1) return '<div class="honline">Пока вы тут один.</div>';
    var part = [];
    if (c.room) part.push(c.room + ' в комнате');
    if (c.table) part.push(c.table + ' за столом');
    if (c.bots) part.push(c.bots + ' с ботами');
    return '<div class="honline">' + c.all + ' в сети: ' + part.join(' · ') + '</div>';
  }

  function hallHead() {
    var S = Hall.S;
    /* Про беду говорим РАНЬШЕ, чем про «не подключены»: сдавшаяся
       комната выключает себя (`on = false`) и выставляет `err`, и если
       сначала смотреть на `on`, человек увидит равнодушное «не
       подключены» вместо «комната недоступна» и кнопки «Ещё раз».
       Экран ошибки был написан, но стоял за дверью, в которую нельзя
       было войти. */
    if (S.err) return '<span class="hstat bad">комната недоступна</span>' +
      '<button class="btn tiny" data-m="hretry">Ещё раз</button>';
    if (!S.on) return '<span class="hstat">не подключены</span>';
    if (!S.ready) return '<span class="hstat">подключаемся…</span>';
    return '';
  }

  function hallBtns() {
    return '<button class="hico hsnd' + (CFG.snd ? '' : ' off') + '" data-m="hsnd" title="' +
      (CFG.snd ? 'Звуки комнаты включены. Нажмите — замолчит'
        : 'Звуки комнаты выключены. Нажмите — заговорит') + '">♪</button>' +
      '<button class="hico hfold" data-m="hfold" title="Свернуть комнату">' +
      (hallFold ? '▾' : '▴') + '</button>';
  }

  function hallPeople() {
    var S = Hall.S;
    if (S.err) return '<div class="hempty">Комната не отвечает. Играть это не мешает: ' +
      'боты и вход по коду работают как обычно.</div>';
    if (!S.on || !S.ready) return '<div class="hempty">Подключаемся к комнате…</div>';
    if (!S.members.length) return '<div class="hempty">Пока никого. Вы тут первый.</div>';
    return S.members.map(function (m) {
      var mine = (m.id === S.me.id), busy = !!m.table;
      var w = m.where || 'room';
      var wName = w === 'table' ? 'за столом' : w === 'bots' ? 'играет с ботами' : 'в меню';
      var dot = '<i class="hdotst ' + (w === 'room' ? 'free' : w === 'bots' ? 'bots' : 'busy') +
        '" title="' + wName + '"></i>';
      var sub = [];
      if (m.host) sub.push('<i class="hhost">главный</i>');
      if (mine) sub.push('это вы');
      sub.push(busy && mine ? 'ваш стол ' + esc(m.table.code) : wName);
      return '<div class="hrow tapme' + (mine ? ' me' : '') + '" data-hprof="' + m.id + '">' +
        '<span class="hav">' +
        ART.ava(m.face != null ? m.face : -1, (m.name || '?').charAt(0).toUpperCase(), 'sm') +
        dot + '</span>' +
        '<span class="hname"><b>' + esc(m.name) + '</b>' +
        '<span class="hsub">' + sub.join(' · ') + '</span></span>' +
        (busy && !mine
          ? '<button class="btn tiny" data-hjoin="' + esc(m.table.code) + '">Подключиться</button>' : '') +
        '</div>';
    }).join('');
  }

  function hallLog() {
    var l = Hall.log();
    if (!l.length) return '<div class="hempty">Тут будет разговор. Историю не храним — ' +
      'только то, что говорят сейчас.</div>';
    return l.map(function (x) {
      if (x.k === 'sys') return '<div class="hmsg sys">' + esc(x.t) + '</div>';
      if (x.k === 'table') {
        var mine = Hall.S.me.table && Hall.S.me.table.code === x.code;
        return '<div class="hmsg tbl">' + esc(x.t) +
          (mine ? ' <span class="hst">это ваш стол</span>'
            : ' <button class="btn tiny" data-hjoin="' + esc(x.code) + '">Подключиться</button>') +
          '</div>';
      }
      return '<div class="hmsg"><b>' + esc(x.from) + '</b> ' + esc(x.t) + '</div>';
    }).join('');
  }

  function hallHTML() {
    return '<div class="hallcol' + (hallFold ? ' folded' : '') + ' t-' + hallTab + '">' +
      '<div class="hhead"><h4 class="hd">Комната</h4>' + hallHead() + hallBtns() + '</div>' +
      '<div class="htabs" id="hTabs">' + hallTabs() + '</div>' +
      '<div class="honlinebox" id="hOnline">' + hallOnline() + '</div>' +
      '<div class="hpeople" id="hPeople">' + hallPeople() + '</div>' +
      '<div class="hlog" id="hLog">' + hallLog() + '</div>' +
      '<div class="hsay"><input class="fld" id="hSay" maxlength="200" placeholder="Сказать всем…">' +
      '<button class="btn" data-m="hsend">Сказать</button></div>' +
      '</div>';
  }

  /* Перерисовываем только список и разговор: перебирать всю колонку
     нельзя — выдернем поле из-под набираемого текста. */
  function hallRefresh() {
    var box = $('#hPeople'); if (!box) return;
    var keep = box.scrollTop;
    box.innerHTML = hallPeople();
    box.scrollTop = keep;
    var lg = $('#hLog');
    if (lg) { lg.innerHTML = hallLog(); lg.scrollTop = 1e6; }
    if (hallTab === 'log') hallSeen = Hall.log().length;
    var tb = $('#hTabs'); if (tb) tb.innerHTML = hallTabs();
    var ob = $('#hOnline'); if (ob) ob.innerHTML = hallOnline();
    var hh = $('#splash .hhead');
    if (hh) hh.innerHTML = '<h4 class="hd">Комната</h4>' + hallHead() + hallBtns();
  }

  /* Где мы сейчас — отвечаем в одном месте, по состоянию игры, а не
     расставляя вызовы по экранам. */
  function hallWhere() {
    if (!window.Hall || !Hall.where) return;
    Hall.where(!atTable() ? 'room' : (window.Net && Net.S && Net.S.on ? 'table' : 'bots'));
  }

  /* В комнату заходим и во время партии: `enter` при уже поднятой комнате
     просто перевешивает обработчик и выходит. Раньше тут стояло
     `atTable()`, и сев играть, человек из комнаты пропадал. */
  function hallEnter() {
    if (!window.Hall) return;
    if (!hallOn) {
      hallOn = true;
      Hall.sound(function (k) { if (CFG.snd && !atTable() && ART.play) ART.play(k); });
    }
    Hall.enter(myName(), CFG.face, hallRefresh, hallCard());
  }

  function hallSend(m) {
    var f = m.querySelector('#hSay'); if (!f) return;
    var t = (f.value || '').trim(); if (!t) return;
    f.value = ''; Hall.say(t);
    var c = cnt();
    if (bump(c, 'said') >= 50) ach('tamada');
    if (c.said >= 300) ach('gZhvanetsky');
    saveCnt(c);
  }

  function hallJoin(code) {
    UI.toast('Стучусь на стол ' + code + '…');
    joinAnd(code, myName(), '');
  }

  /* Карточка человека из комнаты — по тапу на строку. */
  function hallProfile(id) {
    var l = Hall.list(), m = null, i;
    for (i = 0; i < l.length; i++) if (l[i].id === id) m = l[i];
    if (!m) return;
    var c = m.card, mine = (Hall.S.me.id === id), who = [];
    if (m.host) who.push('главный в комнате');
    if (mine) who.push('это вы');
    who.push(m.table ? 'за столом ' + esc(m.table.code) : 'в меню');
    var head = '<div class="profhead">' +
      ART.ava(m.face != null ? m.face : -1, (m.name || '?').charAt(0), 'big') +
      '<div><div class="pname">' + esc(m.name) + '</div>' +
      '<div class="sub" style="margin:0">' + who.join(' · ') + '</div></div></div>';
    var body = c
      ? '<div class="mcard">' +
        '<div class="mline"><span>партий</span><i>' + (c.games || 0) + '</i></div>' +
        '<div class="mline"><span>побед</span><i>' + (c.wins || 0) + '</i></div>' +
        '<div class="mline"><span>по сети</span><i>' + (c.net || 0) + '</i></div>' +
        (c.elo != null ? '<div class="mline"><span>рейтинг</span><i class="vw">' + c.elo + '</i></div>' : '') +
        '</div>'
      : '<div class="sub">Визитка ещё не доехала — человек только что вошёл.</div>';
    UI.modal(head + body + '<div class="row"><button class="btn" data-x="1">Закрыть</button></div>',
      function (mm) {
        mm.onclick = function (ev) { if (ev.target.closest('[data-x]')) UI.closeModal(); };
      }, { light: true });
  }

  /* Клики комнаты — общие для всех экранов меню. true значит «событие
     наше, дальше не идёт». */
  function hallWire(ev, m) {
    var hj = ev.target.closest('[data-hjoin]');
    if (hj) { hallJoin(hj.dataset.hjoin); return true; }
    var hp = ev.target.closest('[data-hprof]');
    if (hp) { hallProfile(hp.dataset.hprof); return true; }
    var ht = ev.target.closest('[data-ht]');
    if (ht) {
      hallTab = ht.dataset.ht;
      if (hallTab === 'log') hallSeen = Hall.log().length;
      var col = m.querySelector('.hallcol');
      if (col) {
        col.classList.toggle('t-people', hallTab === 'people');
        col.classList.toggle('t-log', hallTab === 'log');
      }
      hallRefresh();
      return true;
    }
    var b = ev.target.closest('[data-m]');
    if (!b) return false;
    var v = b.dataset.m;
    if (v === 'hsend') { hallSend(m); return true; }
    if (v === 'hsnd') { CFG.snd = !CFG.snd; saveCfg(); if (ART.setSnd) ART.setSnd(CFG.snd); hallRefresh(); return true; }
    if (v === 'hretry') { Hall.leave(); hallOn = false; hallEnter(); hallRefresh(); return true; }
    if (v === 'hfold') {
      hallFold = !hallFold;
      var c = m.querySelector('.hallcol');
      if (c) c.classList.toggle('folded', hallFold);
      b.textContent = hallFold ? '▾' : '▴';
      if (!hallFold) hallRefresh();
      return true;
    }
    return false;
  }

  function hallStart(m) {
    hallEnter();
    hallWhere();
    hallRefresh();
    var f = m.querySelector('#hSay');
    if (f) f.onkeydown = function (e) {
      if (e.key === 'Enter') { hallSend(m); e.preventDefault(); }
    };
  }

  /* ---------- рамка любого экрана меню ----------

     Одно место, где решается и «где комната», и «как отсюда выйти».
     Ник: «если нажать меню во время партии — нельзя вернуться». Пока
     партия идёт, в шапке стоит «За стол», и она возвращает к столу, а
     не начинает всё заново. */
  /* ---------- переключатель-сегмент ----------

     Ник про прежние кнопки: «ужасный дизайн кнопок». И справедливо:
     выбор из двух-трёх вариантов был набран мелкими чипами вперемешку с
     обычными кнопками — не читалось, какие из них переключатели, а какие
     действия. В клаборе это давно решено сегментом во всю ширину: одна
     рамка, внутри варианты, выбранный подсвечен. Берём оттуда как есть —
     стили под него в оболочке уже лежат. */
  function segHTML(id, cur, items, cls) {
    return '<div class="seg' + (cls ? ' ' + cls : '') + '" id="' + id + '">' + items.map(function (it) {
      return '<button data-v="' + esc(String(it[0])) + '" class="' +
        (String(cur) === String(it[0]) ? 'on' : '') + '">' + it[1] + '</button>';
    }).join('') + '</div>';
  }
  /* Один обработчик на сегмент: вернул выбранное значение — и всё. */
  function segWire(m, id, fn) {
    var box = m.querySelector('#' + id); if (!box) return;
    box.onclick = function (ev) {
      var b = ev.target.closest('button'); if (!b) return;
      fn(b.dataset.v);
    };
  }

  /* ---------- рамка любого экрана меню ----------

     Ник: «у тебя куча места, а ты не пользуешься этим». Раньше экран был
     узкой колонкой с маленьким заголовком, а половина окна пустовала.
     Теперь как в клаборе: слева шапка с выходом, посередине крупное
     название, под ним строка-пояснение — и дальше широкая колонка дела,
     а справа комната.

     Кнопка выхода одна и всегда на месте, но подписана по делу: идёт
     партия — «За стол», не идёт — «Готово». Ник: «если нажать меню во
     время партии, нельзя вернуться». */
  function menuScreen(key, o, wire) {
    if (typeof o === 'string') o = { body: o };
    var hall = (o.hall !== false) && !atTable() && !!window.Hall;
    var back = o.back || (atTable() ? function () { UI.closeSplash(); } : null);
    var head = (o.title
      ? '<div class="nav">' +
        (back ? '<button class="navb word" id="mNavBack">‹<span>' +
          esc(o.backText || (atTable() ? 'За стол' : 'Готово')) + '</span></button>'
          : '<span class="navb ghost"></span>') +
        '<div class="navt">' + esc(o.title) + '</div><span class="navb ghost"></span></div>' +
        (o.sub ? '<div class="sub">' + o.sub + '</div>' : '')
      : (back ? '<div class="mnav"><button class="btn mini" id="mNavBack">‹ ' +
          esc(o.backText || (atTable() ? 'За стол' : 'Готово')) + '</button></div>' : ''));
    UI.splash('<!--WIDE-->' + head +
      (hall ? '<div class="mainwrap"><div class="mcol wide">' + o.body + '</div>' + hallHTML() + '</div>'
        : '<div class="mcol wide">' + o.body + '</div>'),
      function (m) {
        var t = m.querySelector('#mNavBack');
        if (t && back) t.onclick = back;
        if (hall) {
          m.addEventListener('click', function (ev) { hallWire(ev, m); }, true);
          hallStart(m);
        }
        if (wire) wire(m);
      }, key);
  }

  function scrHall() { hallTab = 'log'; mainMenu(); }

  /* Вид кнопки «Базар» по её состоянию. */
  function talkBtn() {
    var b = $('#bTalk');
    if (!b) return;
    b.classList.toggle('off', !CFG.talk);
    b.textContent = CFG.talk ? 'Базар' : 'Тишина';
    b.title = CFG.talk ? 'Соперники болтают — выключить' : 'За столом тихо — включить базар';
  }

  /* ---------- запуск ---------- */
  function go() {
    UI.bindOnce();
    $$('#top .tbtn').forEach(function (b) {
      if (b.id === 'bNew') b.onclick = mainMenu;
      if (b.id === 'bSettings') b.onclick = settings;
      if (b.id === 'bNet') b.onclick = netInfo;
      /* Базар нажимали и не понимали, сработало ли: тост гаснет за две
         секунды, а кнопка выглядела одинаково во включённом и
         выключенном виде. Теперь она сама показывает своё состояние. */
      if (b.id === 'bTalk') b.onclick = function () {
        CFG.talk = !CFG.talk; saveCfg(); talkBtn();
        UI.toast(CFG.talk ? 'Базар включён' : 'Тишина за столом');
      };
    });
    talkBtn();
    netBtn();
    ART.applySkin && ART.applySkin('felt');
    mainMenu();
  }

  return {
    CFG: CFG, go: go, start: start, mainMenu: mainMenu, toMenu: toMenu, toTable: toTable,
    myName: myName, setName: setName, showProfile: showProfile, statCard: statCard,
    ach: ach, achHas: achHas, achList: achList, ACH: ACH, stats: stats, saveStats: saveStats,
    achTaken: achTaken, achRunReset: achRunReset,
    achHand: achHand, achGame: achGame,
    facesOpen: facesOpen, profile: profile, rules: rules, settings: settings,
    lobbySeat: lobbySeat, lobbyRefresh: lobbyRefresh, netStart: netStart,
    scrHost: scrHost, scrJoin: scrJoin, scrHall: scrHall, hallCard: hallCard,
    exportText: exportText, importText: importText,
    autosave: autosave, savedGame: savedGame, resumeGame: resumeGame, dropSave: dropSave,
    /* Наружу — только для проверок: t_rate.js пересчитывает рейтинг своей
       формулой и раньше держал коэффициент росписи прописью. После
       перемера (`calibk.js`) число разъехалось, и тест поймал самого
       себя. Пусть берёт его отсюда. */
    KCONV: KCONV
  };
})();
document.addEventListener('DOMContentLoaded', function () { Boot.go(); });

</script>
</body>
</html>
