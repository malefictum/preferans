      /* Свой снос — только играющему: он лежит у него на столе лицом
         вверх, но чужой снос в преферансе тайна. */
      drop: (seat === g.declarer && !g.pass) ? (g.drop || []) : null,
      pending: pd
    };
  }

  /* ---------- игра на стороне гостя ----------
     У гостя нет ни колоды, ни правил: он рисует то, что прислал хозяин,
     а свои ходы отправляет ему. Поэтому newHand ничего не делает, а
     apply не двигает состояние, а отсылает действие. */
  function NetGame(cfg, seat) {
    this.o = cfg.o; this.N = cfg.N; this.names = cfg.names.slice();
    this.isNet = true;
    this.target = cfg.target || 10;
    this.pool = []; this.mountain = []; this.whists = []; this.taken = [];
    for (var i = 0; i < this.N; i++) {
      this.pool.push(0); this.mountain.push(0); this.taken.push(0);
      var row = []; for (var j = 0; j < this.N; j++) row.push(0);
      this.whists.push(row);
    }
    this.hands = []; this.cur = []; this.widow = []; this.drop = [];
    this.seats = []; this.bids = []; this.out = []; this.whist = []; this.whisters = [];
    this.sheet = null; this.seen = [];
    this.dealer = 0; this.declarer = -1; this.contract = null; this.trump = null;
    this.need = 0; this.high = null; this.handNo = 0;
    this.pass = false; this.price = 0; this.passRow = 0;
    this.over = false; this.result = null; this.tricks = [];
    this.ev = []; this.log = []; this.pending = null;
    this.seat = seat;
  }
  NetGame.prototype = Object.create(Engine.Game.prototype);
  NetGame.prototype.constructor = NetGame;
  NetGame.prototype.newHand = function () { };
  NetGame.prototype.apply = function (a) {
    this.pending = null;
    send(S.conns[0], { t: 'act', seat: this.seat, a: a });
  };
  NetGame.prototype.applySync = function (pub, priv) {
    for (var k in pub) if (k !== 'counts' && k !== 'widow' && k !== 'lastTrick' &&
      k !== 'openHands') this[k] = pub[k];
    var me = this.seat, i;
    this.hands = [];
    for (i = 0; i < this.N; i++) {
      var oi = (pub.open || []).indexOf(i);
      if (i === me) this.hands.push(priv.hand || []);
      else if (pub.light && oi >= 0 && pub.openHands) this.hands.push(pub.openHands[oi] || []);
      else { var a = []; for (var j = 0; j < pub.counts[i]; j++) a.push(null); this.hands.push(a); }
    }
    // прикуп: свой — настоящий, чужой — две рубашки
    if (priv.widow) this.widow = priv.widow;
    else if (pub.widow) this.widow = pub.widow;
    else this.widow = [null, null];
    if (priv.drop && priv.drop.length) this.drop = priv.drop.slice();
    else { this.drop = []; for (i = 0; i < (pub.dropN || 0); i++) this.drop.push(null); }
    this.tricks = []; for (i = 0; i < (pub.tricksN || 0); i++) this.tricks.push(null);
    if (pub.lastTrick && this.tricks.length) this.tricks[this.tricks.length - 1] = pub.lastTrick;
  };

  /* ---------- связь ---------- */
  function send(c, m) { try { if (c && c.open) c.send(m); } catch (e) { } }
  /* ---------- сохранение стола ---------- */
  function saveHost(g) {
    if (!S.host || !g) return;
    try {
      localStorage.setItem('pref-host', JSON.stringify({
        ts: Date.now(), code: S.code, cfg: S.cfg,
        conns: S.conns.map(function (c) { return { seat: c.seat, name: c.name, key: c.key, face: c.face }; }),
        chars: g.chars || null, faces: g.faces || null,
        game: Engine.snapshot(g)
      }));
    } catch (e) { }
  }
  /* Запись живёт полсуток: код стола после этого всё равно мёртвый —
     хозяин давно закрыл вкладку, и кнопка вела бы в никуда. */
  var BACK_TTL = 12 * 3600 * 1000;
  function savedBack() {
    try {
      var d = JSON.parse(LS('pref-back') || 'null');
      if (!d || !d.code || !d.key) return null;
      if (Date.now() - (d.at || 0) > BACK_TTL) { dropBack(); return null; }
      return d;
    } catch (e) { return null; }
  }
  function dropBack() { try { localStorage.removeItem('pref-back'); } catch (e) { } }

  function savedHost() {
    try {
      var d = JSON.parse(localStorage.getItem('pref-host') || 'null');
      if (!d || !d.code || !d.game) return null;
      if (Date.now() - d.ts > 36 * 3600 * 1000) return null;   // старше полутора суток — не предлагаем
      return d;
    } catch (e) { return null; }
  }
  function dropSaved() { try { localStorage.removeItem('pref-host'); } catch (e) { } }

  function broadcast(g) {
    if (!S.host) return;
    saveHost(g);
    for (var i = 0; i < S.conns.length; i++) {
      var c = S.conns[i];
      if (!c || !c.conn) continue;
      var evs = g.ev.slice(c.sent || 0);
      c.sent = g.ev.length;
      send(c.conn, { t: 'sync', pub: pubState(g), priv: privState(g, c.seat), ev: evs });
    }
  }

  /* ---------- хозяин ---------- */
  function createRoom(cfg, myName, onState, fixed, myFace) {
    return loadPeer().then(function (ok) {
      if (!ok) throw new Error('нет связи с брокером');
      S.code = (fixed && fixed.code) || rndCode();
      S.host = true; S.on = true; S.seat = 0; S.cfg = cfg;
      S.conns = [];
      for (var i = 0; i < cfg.N; i++)
        S.conns.push({
          seat: i, name: i === 0 ? myName : '', key: rndKey(), conn: null, sent: 0,
          uid: i === 0 ? myUid() : null,
          bot: i !== 0, face: i === 0 ? (myFace != null ? myFace : -1) : -1,
          stats: (i === 0 && window.Boot && Boot.statCard) ? Boot.statCard() : null
        });
      if (fixed && fixed.conns)                       // поднимаем прежний стол: места и ключи те же
        for (i = 0; i < Math.min(fixed.conns.length, S.conns.length); i++) {
          S.conns[i].key = fixed.conns[i].key || S.conns[i].key;
          S.conns[i].name = fixed.conns[i].name || S.conns[i].name;
          if (fixed.conns[i].face != null) S.conns[i].face = fixed.conns[i].face;
          S.conns[i].bot = i !== 0;
        }
      LS('pref-room', S.code);
      /* Поднять стол с первого раза выходит не всегда: публичный брокер
         иногда роняет сокет прямо на открытии. Раньше это был конец —
         «Не вышло: Lost connection to server», и стол не поднимался,
         хотя вторая попытка через полсекунды проходит. Теперь пробуем
         молча, и только исчерпав попытки, говорим человеку. */
      return new Promise(function (res, rej) {
        var tries = 0;
        (function attempt() {
          tries++;
          var p = newPeer(PREFIX + S.code);
          S.peer = p;
          var settled = false;
          p.on('open', function () {
            settled = true;
            keepAlive(p, 'стол');
            res(S.code); onState && onState();
          });
          p.on('error', function (e) {
            if (settled) return;            // после открытия за связь отвечает keepAlive
            var t = (e && e.type) || '';
            try { p.destroy(); } catch (e2) { }
            /* Имя занято, а код мы выбирали сами — возьмём другой.
               Если код задан (возвращаемся за свой стол), менять его
               нельзя: по нему к нам идут люди. */
            if (t === 'unavailable-id' && !(fixed && fixed.code) && tries < 4) {
              S.code = rndCode(); LS('pref-room', S.code);
              return setTimeout(attempt, 250);
            }
            if (TRANSIENT[t] && tries < 3) return setTimeout(attempt, 500 * tries);
            settled = true;
            /* Сдались — прибираем за собой. Иначе следующая попытка
               начнётся с половиной поднятого стола в `S`. */
            S.on = false; S.host = false; S.peer = null;
            rej(new Error(netErr(e)));
          });
          p.on('connection', function (conn) {
            conn._seen = Date.now();
            conn.on('data', function (m) {
              conn._seen = Date.now();
              if (m && m.t === 'ping') return send(conn, { t: 'pong' });
              onHostMsg(conn, m, onState);
            });
            conn.on('close', function () { dropConn(conn, onState); });
            conn.on('error', function () { dropConn(conn, onState); });
          });
        })();
      });
    });
  }

  function seatOfConn(conn) {
    for (var i = 0; i < S.conns.length; i++) if (S.conns[i].conn === conn) return i;
    return -1;
  }
  /* Живой ли за этим местом человек.

     Стол спрашивает это перед тем, как походить за место: за бота он
     ходит сам, живого — ждёт. Функция была нужна столу с самого начала
     (`Net.isHuman` он зовёт в `ready`), но её просто не существовало —
     и условие всегда было ложным. Из-за этого хозяин ходил ЗА ГОСТЕЙ
     через полсекунды после их очереди, а гости сидели зрителями.

     Своё место живое всегда: за ним сидит тот, кто смотрит в экран. */
  function isHuman(seat) {
    if (!S.on) return false;
    if (!S.host) return seat === S.seat;
    if (seat === 0) return true;
    var c = S.conns && S.conns[seat];
    return !!(c && c.conn);
  }

  /* ---------- место опустело ----------

     Ник: «чтобы при вылете игра ставилась на паузу, пока игрок
     возвращается, чтобы за него только потом мог сесть бот».

     Раньше бот садился в ту же секунду. Со стороны человека это
     выглядело так: пока он жмёт «вернуться», за него уже отторговали
     и снесли прикуп, и возвращается он в чужую сдачу. Теперь между
     обрывом и ботом есть окно: стол замирает, все видят «ждём
     Колянусика — 38», и только если человек не вернулся, место
     забирает бот. Хозяин может не ждать — в той же плашке кнопка.

     В лобби ждать нечего: партия не началась, место просто пустеет. */
  function markAway(i, onState) {
    var c = S.conns[i];
    if (!c) return;
    c.conn = null;
    if (!S.ready) {                                  // ещё лобби — как было
      c.bot = true;
      lobbyPush(); onState && onState();
      if (UI && UI.toast) UI.toast((c.name || 'Игрок') + ' ушёл из-за стола');
      return;
    }
    c.away = Date.now() + T.away;
    c.bot = false;
    if (UI && UI.toast) UI.toast((c.name || 'Игрок') + ' без связи — ждём его, партия на паузе');
    lobbyPush(); onState && onState();
    awayPush();
  }
  function dropConn(conn, onState) {
    var i = seatOfConn(conn);
    if (i < 0) return;
    markAway(i, onState);
  }

  /* Кого ждут и сколько осталось. Список один на всех — и хозяину в
     плашку, и гостям: им тоже надо понимать, почему стол замер.
     Везём остаток, а не срок: часы у всех свои. */
  function awayList() {
    var out = [], now = Date.now();
    for (var i = 0; i < S.conns.length; i++) {
      var c = S.conns[i];
      if (c && c.away)
        out.push({
          seat: i, name: c.name || ('Место ' + (i + 1)),
          left: Math.max(0, c.away - now)
        });
    }
    return out;
  }
  function awayPush() {
    if (!S.host) return;
    var list = awayList();
    toGuests({ t: 'away', list: list });
    if (UI && UI.netAway) UI.netAway(list);
  }
  /* Ждать больше нечего: место забирает бот. Сюда приходят двумя
     путями — вышло время или хозяин нажал кнопку. Бота пускаем ПОСЛЕ
     того, как снята пауза: иначе его первый ход упрётся в неё же. */
  function seatBot(i) {
    if (!S.host) return false;
    var c = S.conns[i];
    if (!c || !c.away) return false;
    c.away = 0; c.bot = true;
    if (S.game) S.game.names[i] = (c.name || ('Место ' + (i + 1))) + ' (бот)';
    if (UI && UI.toast) UI.toast((c.name || 'Игрок') + ' не вернулся — место ведёт бот');
    lobbyPush(); awayPush();
    if (UI && UI.netFillBot) UI.netFillBot(i);
    if (S.game) broadcast(S.game);
    return true;
  }

  /* ---------- высадить со стола ----------
     «Вдруг зашёл не тот, что надо». Хозяин освобождает место, а ключ
     высаженного отправляется в бан на минуту: иначе он вернётся тем же
     ключом через секунду и сядет обратно. Ключ — единственное, чем гость
     себя опознаёт (адрес соединения у него каждый раз новый), так что это
     не крепость, а вежливое «не сейчас». */
  var BAN_MS = 60000;

  function kick(seat) {
    if (!S.host || seat <= 0 || seat >= S.conns.length) return false;
    var c = S.conns[seat];
    if (!c.conn) return false;
    var key = c.key;
    S.bans[key] = Date.now() + BAN_MS;
    send(c.conn, { t: 'bye', why: 'Хозяин убрал вас со стола. Вернуться можно через минуту.' });
    try { c.conn.close(); } catch (e) { }
    c.conn = null; c.bot = true; c.name = ''; c.face = -1; c.stats = null; c.sent = 0;
    if (S.game) { S.game.names[seat] = 'Место ' + (seat + 1); }
    lobbyPush();
    return true;
  }

  function banLeft(key) {
    var t = S.bans[key];
    if (!t) return 0;
    var left = t - Date.now();
    if (left <= 0) { delete S.bans[key]; return 0; }
    return left;
  }

  function onHostMsg(conn, m, onState) {
    var g = S.game;
    if (m.t === 'hello') {
      var seat = -1, i;
      var left = m.key ? banLeft(m.key) : 0;
      if (left > 0) {
        send(conn, { t: 'bye', why: 'Вас убрали со стола. Попробуйте через ' +
          Math.ceil(left / 1000) + ' сек.' });
        try { conn.close(); } catch (e) { }
        return;
      }
      /* Свой номер игрока — старше ключа: он опознаёт ЧЕЛОВЕКА, а ключ
         только место. Место с тем же номером забираем всегда, даже если
         прежнее соединение числится живым: живым оно числится и у
         призрака, и именно на этом стол ломался. */
      if (m.uid) {
        if (S.conns[0] && S.conns[0].uid === m.uid) {
          send(conn, { t: 'bye', why: 'Этот стол вы уже держите — вы за ним хозяин.' });
          try { conn.close(); } catch (e) { }
          return;
        }
        for (i = 1; i < S.conns.length; i++)
          if (S.conns[i].uid && S.conns[i].uid === m.uid) { seat = i; break; }
        if (seat > 0 && S.conns[seat].conn && S.conns[seat].conn !== conn) {
          try { send(S.conns[seat].conn, { t: 'bye', why: 'Вы вошли за этот стол из другого окна.' }); } catch (e) { }
          try { S.conns[seat].conn.close(); } catch (e) { }
          S.conns[seat].conn = null;
        }
      }
      // возврат по ключу — но занятое живое место не отбираем (двое за одним браузером)
      if (seat < 0 && m.key)
        for (i = 1; i < S.conns.length; i++)
          if (S.conns[i].key === m.key && !(S.conns[i].conn && S.conns[i].conn.open)) { seat = i; break; }
      /* Пустые места раздаём новичкам — но место, которое СЕЙЧАС держат
         за вылетевшим, не трогаем ни в какую: иначе он вернётся, а за
         его картами уже сидит чужой человек. */
      if (seat < 0)
        for (i = 1; i < S.conns.length; i++)
          if (!S.conns[i].conn && !S.conns[i].away && S.conns[i].bot && !S.conns[i].name) { seat = i; break; }
      if (seat < 0)
        for (i = 1; i < S.conns.length; i++) if (!S.conns[i].conn && !S.conns[i].away) { seat = i; break; }
      if (seat < 0) {
        var held = awayList().length;
        send(conn, { t: 'bye', why: held
          ? 'Все места заняты: одно держат за игроком, который вот-вот вернётся.'
          : 'Стол уже полон' });
        return;
      }
      S.conns[seat].conn = conn; S.conns[seat].bot = false;
      S.conns[seat].conn._seen = Date.now();
      /* Вернулся — ждать больше нечего. Пауза снимется в `awayPush`
         ниже, когда список опустеет. */
      S.conns[seat].away = 0;
      S.conns[seat].uid = m.uid || null;
      /* Если этот же человек уже сидел где-то ещё — освобождаем то
         место здесь и сейчас. */
      for (i = 1; i < S.conns.length; i++)
        if (i !== seat && m.uid && S.conns[i].uid === m.uid) {
          try { if (S.conns[i].conn) S.conns[i].conn.close(); } catch (e) { }
          S.conns[i].conn = null; S.conns[i].uid = null; S.conns[i].bot = true;
        }
      S.conns[seat].name = (m.name || 'Игрок').slice(0, 14);
      // портрет гостя: если такой уже занят — хозяин подберёт свободный того же пола
      var want = (typeof m.face === 'number' && m.face >= 0) ? m.face : -1;
      var busy = [];
      for (i = 0; i < S.conns.length; i++) if (i !== seat && S.conns[i].face >= 0) busy.push(S.conns[i].face);
      if (want < 0 || busy.indexOf(want) >= 0) {
        var free = ART.facesOf(want >= 0 ? ART.FACE_SEX[want] : 'm', busy);
        if (!free.length) free = ART.facesOf(want >= 0 && ART.FACE_SEX[want] === 'm' ? 'f' : 'm', busy);
        want = free.length ? free[0] : -1;
      }
      S.conns[seat].face = want;
      S.conns[seat].stats = m.stats || null;         // профиль гостя — его увидят соперники
      if (g) {
        if (!g.stats) g.stats = [];
        g.stats[seat] = S.conns[seat].stats;
      }
      if (g && g.faces) { g.faces[seat] = want; broadcast(g); }
      S.conns[seat].sent = 0;
      if (g) g.names[seat] = S.conns[seat].name;
      send(conn, {
        t: 'welcome', seat: seat, key: S.conns[seat].key, code: S.code,
        cfg: { N: S.cfg.N, o: S.cfg.o, names: names() }, started: !!S.ready
      });
      lobbyPush(); awayPush(); onState && onState();
      if (S.ready && g) { S.conns[seat].sent = 0; broadcast(g); }
      return;
    }
    if (m.t === 'me') {                              // гость поменял имя или портрет
      var st2 = seatOfConn(conn);
      if (st2 < 0) return;
      if (m.name) S.conns[st2].name = String(m.name).slice(0, 14);
      if (m.stats) {
        S.conns[st2].stats = m.stats;
        if (g) { if (!g.stats) g.stats = []; g.stats[st2] = m.stats; }
      }
      if (typeof m.face === 'number' && m.face >= 0) {
        var taken = [];
        for (i = 0; i < S.conns.length; i++) if (i !== st2 && S.conns[i].face >= 0) taken.push(S.conns[i].face);
        if (taken.indexOf(m.face) < 0) S.conns[st2].face = m.face;
      }
      if (g) {
        if (g.names) g.names[st2] = S.conns[st2].name;
        if (g.faces) g.faces[st2] = S.conns[st2].face;
        broadcast(g);
      }
      lobbyPush();
      return;
    }
    if (m.t === 'chat') {
      var cs = seatOfConn(conn);
      if (cs < 0) return;
      chatOut(S.conns[cs].name || ('Место ' + (cs + 1)), String(m.text || '').slice(0, 200), cs);
      return;
    }
    if (m.t === 'act') {
      if (!g || !g.pending) return;
      var st = seatOfConn(conn);
      if (st !== m.seat) return;
      if (g.pending.p !== st && g.pending.type !== 'next') return;
      UI.applyRemote(m.a);
    }
  }

  function toGuests(msg) {
    for (var i = 1; i < S.conns.length; i++)
      if (S.conns[i] && S.conns[i].conn) send(S.conns[i].conn, msg);
  }

  /* ---------- разговор за столом ----------
     Живой чат в сетевой партии. Хозяин — почтальон: принимает реплику,
     показывает у себя и раздаёт остальным. Историю нигде не храним. */
  // место отправителя едет вместе с репликой: по имени «свой-чужой» не отличить,
  // два игрока могут назваться одинаково
  function chatOut(from, text, seat) {
    if (!text) return;
    if (UI && UI.chatIn) UI.chatIn(from, text, seat);
    toGuests({ t: 'chat', from: from, text: text, seat: seat });
  }
  /* ---------- реплики над столом ----------

     Ник: «в сетевой игре чат комменты не синхронизированы — игрок
     говорит, и в сетевой игре все его видят».

     Реплика рождается из случайного броска: какой повод озвучить, чьим
     характером, какими словами. Пока каждый браузер бросал свой кубик,
     за одним столом люди видели РАЗНЫЕ фразы, а часто гость не видел
     ничего. Поэтому автор один — хозяин: он сочиняет за все места и
     рассылает готовый текст. Гость своих не сочиняет вовсе. */
  function bub(seat, text, force) {
    if (!S.on || !S.host || !text) return;
    toGuests({ t: 'bub', seat: seat, text: String(text).slice(0, 300), f: !!force });
  }

  function chat(text) {
    text = String(text || '').trim().slice(0, 200);
    if (!text || !S.on) return;
    if (S.host) chatOut(S.conns[0].name || 'Хозяин', text, 0);
    else send(S.conns[0], { t: 'chat', text: text });
  }

  function names() { return S.conns.map(function (c, i) { return c.name || ('Место ' + (i + 1)); }); }

  // хозяин пересаживает двух игроков местами. Команды в клаборе — это места
  // (0+2 против 1+3), так что пересадка и есть выбор команды.
  function swapSeats(i, j) {
    if (!S.host || S.ready) return false;
    if (i === j || i < 0 || j < 0 || i >= S.conns.length || j >= S.conns.length) return false;
    var a = S.conns[i], b = S.conns[j], k, t;

    /* ---------- пересадка переносит ЧЕЛОВЕКА, а не часть его ----------

       Ник: «при возврате сажает не на своё место — если хозяин тебя
       ПЕРЕСАДИЛ».

       Тут стоял список полей, которые едут с игроком: имя, ключ,
       соединение, портрет, профиль. Список надо было помнить и
       дополнять, и когда место стало опознаваться по номеру игрока
       (БОТЫ-ЗАМЕРЫ §54), номер в этот список дописать забыли. Снаружи
       это выглядело так: хозяин пересадил человека, тот вылетел и
       вернулся — а номер остался на СТАРОМ месте, по нему хозяин и
       сажал. Вернувшийся попадал на чужое место и вышибал оттуда
       соседа: «вы вошли за этот стол из другого окна».

       Поэтому не список, а наоборот: меняем местами ВСЁ, кроме номера
       самого места. Что бы к записи ни добавили завтра — оно поедет с
       человеком само, и эти грабли больше не разложить. */
    var keys = {};
    for (k in a) keys[k] = 1;
    for (k in b) keys[k] = 1;
    delete keys.seat;
    for (k in keys) { t = a[k]; a[k] = b[k]; b[k] = t; }
    a.seat = i; b.seat = j;
    // живым игрокам сообщаем их новое место, иначе они будут ждать чужих карт
    if (a.conn) send(a.conn, { t: 'seat', seat: i, key: a.key });
    if (b.conn) send(b.conn, { t: 'seat', seat: j, key: b.key });
    lobbyPush();
    return true;
  }
  function lobbyPush() {
    if (!S.host) return;
    var list = S.conns.map(function (c, i) { return { seat: i, name: c.name, online: !!c.conn || i === 0, bot: c.bot, face: c.face }; });
    for (var i = 1; i < S.conns.length; i++) send(S.conns[i].conn, { t: 'lobby', players: list, code: S.code });
    if (UI && UI.lobbyRefresh) UI.lobbyRefresh(list);
  }

  /* ---------- гость ---------- */
  function joinRoom(code, myName, key, face) {
    return loadPeer().then(function (ok) {
      if (!ok) throw new Error('нет связи с брокером');
      S.host = false; S.on = true; S.code = code.toUpperCase();
      LS('pref-room', S.code); LS('pref-name', myName);
      return new Promise(function (res, rej) {
        var done = false, tries = 0;
        function ok2(v) { done = true; res(v); }
        S._resolve = ok2;
        (function attempt() {
          tries++;
          var p = newPeer(null);
          S.peer = p;
          p.on('open', function () {
            keepAlive(p, 'гость');
            var conn = p.connect(PREFIX + S.code, { reliable: true });
            S.conns = [conn];
            conn.on('open', function () {
              S.lastHost = Date.now();
              send(conn, {
                t: 'hello', name: myName, face: face, uid: myUid(),
                key: key || LS('pref-key-' + S.code) || '',
                stats: (window.Boot && Boot.statCard) ? Boot.statCard() : null
              });
            });
            conn.on('data', function (m) {
              S.lastHost = Date.now();
              if (m && m.t === 'pong') return;
              onGuestMsg(m, res);
            });
            conn.on('close', function () { onLost(); });
            conn.on('error', function () { if (!done) { done = true; rej(new Error('стол не отвечает')); } });
          });
          p.on('error', function (e) {
            if (done) return;
            var t = (e && e.type) || '';
            /* Сокет к брокеру сорвался на полпути — это про связь, а не
               про стол: пробуем ещё раз, прежде чем пугать человека. */
            if (TRANSIENT[t] && tries < 3) {
              try { p.destroy(); } catch (e2) { }
              return setTimeout(attempt, 500 * tries);
            }
            done = true;
            try { p.destroy(); } catch (e2) { }
            S.on = false; S.peer = null;
            rej(new Error(netErr(e)));
          });
        })();
        setTimeout(function () { if (!done) { done = true; rej(new Error('стол не отвечает')); } }, 14000);
      });
    });
  }

  function onGuestMsg(m, res) {
    if (m.t === 'welcome') {
      S.seat = m.seat; S.key = m.key;
      LS('pref-key-' + S.code, m.key);
      /* Куда возвращаться, если вылетел. Код стола и ключ места и так
         лежали в хранилище, но добраться до них можно было только через
         «Присоединиться» с ручным вводом. Теперь это одна запись, и меню
         делает из неё кнопку «Вернуться за стол». */
      try {
        LS('pref-back', JSON.stringify({
          code: S.code, key: m.key, seat: m.seat, at: Date.now()
        }));
      } catch (e) { }
      S.cfg = m.cfg;
      S.game = new NetGame(m.cfg, m.seat);
      S.lost = false;
      if (S._resolve) S._resolve(m);
      return;
    }
    if (m.t === 'lobby') { S.lobby = m.players; if (UI && UI.lobbyRefresh) UI.lobbyRefresh(m.players); return; }
    if (m.t === 'away') {                            // стол ждёт вылетевшего — и мы ждём вместе с ним
      S.away = m.list || [];
      if (UI && UI.netAway) UI.netAway(S.away);
      return;
    }
    if (m.t === 'seat') {                            // хозяин пересадил — запоминаем новое место
      S.seat = m.seat;
      if (m.key) { S.key = m.key; LS('pref-key-' + S.code, m.key); }
      // и запись «Вернуться за стол» — с новым местом и ключом
      try {
        var bk = JSON.parse(LS('pref-back') || 'null');
        if (bk && bk.code === S.code) { bk.seat = m.seat; if (m.key) bk.key = m.key; LS('pref-back', JSON.stringify(bk)); }
      } catch (e) { }
      if (S.game) S.game.seat = m.seat;
      if (UI && UI.toast) UI.toast('Хозяин пересадил вас на место ' + (m.seat + 1));
      if (window.Boot && Boot.lobbySeat) Boot.lobbySeat();
      return;
    }
    if (m.t === 'chat') {
      if (UI && UI.chatIn) UI.chatIn(m.from, String(m.text || '').slice(0, 200), m.seat);
      return;
    }
    if (m.t === 'bub') {
      if (UI && UI.bubbleIn) UI.bubbleIn(m.seat, String(m.text || '').slice(0, 300), m.f);
      return;
    }
    if (m.t === 'bye') {
      S.on = false; UI.toast(m.why || 'Стол закрыт');
      // высаженного гостя не оставляем перед мёртвым списком мест
      try { if (window.Boot && Boot.mainMenu) { UI.closeModal(); Boot.mainMenu(); } } catch (e) { }
      return;
    }
    if (m.t === 'sync') {
      var g = S.game; if (!g) return;
      if (!S.ready) {
        S.ready = true;
        g.applySync(m.pub, m.priv);
        g.pendHold = m.priv.pending || null;
        UI.attach(g, [], g.seat);
        UI.closeModal();
        UI.closeSplash();                         // партия началась — убираем лобби со стола
        if (window.Boot && Boot.toTable) Boot.toTable();   // мы снова за столом
        if (window.Hall) Hall.where('table');     // из комнаты не уходим — только помечаемся
      } else {
        g.applySync(m.pub, m.priv);
        g.pendHold = m.priv.pending || null;
      }
      UI.netEvents(m.ev || []);
    }
  }

  function updateMe(name, face) {
    if (!S.on) return;
    if (S.host) {                                   // хозяин меняет себе сам
      if (name) S.conns[0].name = String(name).slice(0, 14);
      if (typeof face === 'number' && face >= 0) S.conns[0].face = face;
      if (window.Boot && Boot.statCard) S.conns[0].stats = Boot.statCard();
      if (S.game) {
        if (name) S.game.names[0] = S.conns[0].name;
        if (S.game.faces) S.game.faces[0] = S.conns[0].face;
        if (!S.game.stats) S.game.stats = [];
        S.game.stats[0] = S.conns[0].stats;
        broadcast(S.game);
      }
      lobbyPush();
      return;
    }
    send(S.conns[0], {
      t: 'me', name: name || undefined, face: face,
      stats: (window.Boot && Boot.statCard) ? Boot.statCard() : null
    });
  }

  function onLost() {
    if (!S.on || S.host) return;
    S.lost = true;
    if (UI && UI.netLost) UI.netLost();
  }

  function reconnect() {
    /* Прежний пир после обрыва новых соединений не принимает и сам ни
       к кому не подключится — его надо гасить целиком, а не «чинить». */
    S.conns = [];
    try { if (S.peer) S.peer.destroy(); } catch (e) { }
    S.peer = null; S.ready = false;
    return joinRoom(S.code, LS('pref-name') || 'Игрок', LS('pref-key-' + S.code) || '', S.myFace);
  }

  /* ---------- возврат за стол ----------

     Ник: «при обрыве игрок вылетает и не может вернуться назад в той же
     сессии — он не может сесть за своё старое место».

     Место ему вернуть умел уже номер игрока. Вернуться было НЕЧЕМ:
     `reconnect` в игре не вызывал никто. Человек видел красную кнопку
     «Связь!» — и дальше только главное меню и новый стол.

     Теперь гость стучится сам, с растущей паузой, пока хозяин не
     отзовётся. Пир каждый раз новый, а `hello` идёт с тем же номером и
     ключом — и хозяин отдаёт ему его место. */
  var looping = null, backT = null, loopStop = false;
  function reconnectLoop(onTry, limit) {
    if (looping) return looping;
    clearTimeout(backT); loopStop = false;
    var n = 0, code = S.code;
    looping = new Promise(function (res, rej) {
      (function once() {
        if (loopStop || S.host || S.code !== code) { looping = null; return rej(new Error('стол уже не тот')); }
        n++;
        if (onTry) onTry(n);
        /* Неудачный вход гасит признак «мы за столом» — для входа с нуля
           это правда, для возврата нет: место за нами держат, и стучаться
           мы собираемся до конца. */
        S.on = true;
        reconnect().then(function (w) {
          S.lost = false; looping = null; res(w);
        }, function () {
          if (n >= (limit || 40)) { looping = null; return rej(new Error('стол не отозвался')); }
          backT = setTimeout(once, Math.min(6000, 1200 + n * 400));
        });
      })();
    });
    return looping;
  }
  function stopLoop() { loopStop = true; clearTimeout(backT); looping = null; }

  function leave() {
    stopLoop();
    try { if (S.peer) S.peer.destroy(); } catch (e) { }
    S.on = false; S.host = false; S.ready = false; S.peer = null; S.conns = []; S.game = null;
    S.away = []; S.lost = false; S.lastHost = 0;
    if (UI && UI.netAway) UI.netAway([]);
  }

  /* ---------- часовой ----------
     Один на всё: он и пульс стучит, и терпение считает. Тикаем чаще,
     чем стучим: шаг в полсекунды нужен, чтобы сроки не округлялись до
     четырёх секунд — это видно и на столе, и в проверках. */
  var lastPing = 0;
  setInterval(function () {
    if (!S.on) return;
    var now = Date.now(), i, c;
    if (S.host) {
      for (i = 1; i < S.conns.length; i++) {
        c = S.conns[i];
        if (!c || !c.conn) continue;
        if (now - (c.conn._seen || now) > T.dead) {
          var dead = c.conn;
          try { dead.close(); } catch (e) { }
          dropConn(dead);                            // молчит слишком долго — считаем, что ушёл
        }
      }
      for (i = 1; i < S.conns.length; i++) {
        c = S.conns[i];
        if (c && c.away && now >= c.away) seatBot(i);
      }
      return;
    }
    var h = S.conns && S.conns[0];
    if (!h) return;
    if (h.open && now - lastPing >= T.beat) { lastPing = now; send(h, { t: 'ping' }); }
    if (!S.lost && S.lastHost && now - S.lastHost > T.dead) {
      try { h.close(); } catch (e) { }
      onLost();
    }
  }, 500);

  function startGame(game) {
    S.game = game; S.ready = true;
    for (var i = 0; i < S.conns.length; i++) if (S.conns[i]) S.conns[i].sent = 0;
    broadcast(game);
  }

  return {
    S: S, createRoom: createRoom, joinRoom: joinRoom, broadcast: broadcast,
    startGame: startGame, leave: leave, reconnect: reconnect, loadPeer: loadPeer,
    T: T, reconnectLoop: reconnectLoop, seatBot: seatBot, awayList: awayList,
    saveHost: saveHost, savedHost: savedHost, dropSaved: dropSaved, updateMe: updateMe,
    newPeer: newPeer, brokerText: brokerText, brokerCfg: brokerCfg,
    setBroker: setBroker, testBroker: testBroker,
    myUid: myUid, setUid: setUid, newUid: newUid,
    savedBack: savedBack, dropBack: dropBack,
    chat: chat, bub: bub,
    loadPeer: loadPeer, PREFIX: PREFIX, send: send,
    names: names, lobbyPush: lobbyPush, swapSeats: swapSeats, kick: kick, lobbyList: function () { return S.lobby || []; }, NetGame: NetGame, rndKey: rndKey, LS: LS,
    /* Наружу — только для проверок: как хозяин видит стол и что из
       этого уезжает гостю. Игра этим не пользуется. */
    pubState: pubState, privState: privState, isHuman: isHuman
  };
})();

/* ============================================================
   КЛАБОР — холл: кто сейчас в меню и о чём говорят

   Своего сервера у игры нет, поэтому холл держит браузер одного из игроков.
   Все занимают один и тот же известный адрес у брокера; кому он достался —
   тот и «главный в комнате»: он ведёт список и пересылает сообщения.
   Ушёл главный — оставшиеся через случайную паузу переизбирают нового.

   Истории нет и не задумано: зашёл — видишь то, что говорят сейчас.
   ============================================================ */
var Hall = (function () {
  'use strict';

  var HALL = 'HALL';                 // адрес комнаты у брокера: PREFIX + HALL
  var PING = 20000;                  // как часто напоминаем о себе
  var CLAIM_WAIT = 2600;             // сколько ждём, пока займётся адрес

  var H = {
    on: false, host: false, ready: false,
    peer: null, hostConn: null, conns: [],
    me: { id: '', name: '', face: -1, table: null, where: 'room' },
    members: [], msgs: [], hostName: '',
    onChange: null, err: ''
  };

  // счётчик попыток: старые таймеры и события от прошлого соединения
  // не должны рушить уже поднятую комнату
  var gen = 0;
  function now() { return Date.now(); }
  function hallId() { return Net.PREFIX + HALL; }
  function fire() { if (H.onChange) try { H.onChange(); } catch (e) { } }

  /* Звуки комнаты. Наружу отдаём только повод — играть или молчать,
     решает оболочка (за столом молчим всегда).
     Про свои же действия не сигналим: вошёл кто-то другой, сказал кто-то другой,
     стол поднял кто-то другой. */
  function snd(k) { if (H.onSound) try { H.onSound(k); } catch (e) { } }
  var seenIds = null;
  function noteMembers() {
    var ids = H.members.map(function (m) { return m.id; });
    if (seenIds === null) { seenIds = ids; return; }     // первый список — молчим
    var me = H.me.id, fresh = ids.filter(function (id) {
      return id !== me && seenIds.indexOf(id) < 0;
    });
    seenIds = ids;
    if (fresh.length) snd('join');
  }

  function line(kind, text, from, code, N) {
    H.msgs.push({ k: kind, t: text, from: from || '', code: code || null, N: N || 0, ts: now() });
    if (H.msgs.length > 60) H.msgs.splice(0, H.msgs.length - 60);
    fire();
  }

  /* ---------- вход ---------- */

  /* Вместе с именем и портретом человек несёт в комнату визитку: сколько
     портретов открыл, сколько секретов выбил, пара лучших достижений.
     Это несколько чисел, а не вся статистика — список рассылается всем
     при каждом изменении, и тяжёлую поклажу туда класть нельзя. */
  function enter(name, face, onChange, card) {
    if (H.on) { H.onChange = onChange; if (card) H.me.card = card; fire(); return; }
    H.on = true; H.err = ''; fails = 0; H.onChange = onChange;
    H.me.name = (name || 'Игрок').slice(0, 14);
    H.me.face = (face == null ? -1 : face);
    H.me.card = card || null;
    H.me.table = null;
    H.me.where = 'room';
    H.members = []; H.msgs = []; seenIds = null;
    Net.loadPeer().then(function (ok) {
      if (!ok) { H.err = 'нет связи с брокером'; H.on = false; fire(); return; }
      claim();
    }).catch(function () { H.err = 'нет связи с брокером'; H.on = false; fire(); });
  }

  // сперва пробуем стать главным; адрес занят — значит холл уже есть, идём гостем
  function claim() {
    if (!H.on) return;
    var my = ++gen, p, done = false;
    try { p = Net.newPeer(hallId()); } catch (e) { return guest(my); }
    p.on('open', function () {
      if (done || my !== gen || !H.on) { try { p.destroy(); } catch (e) { } return; }
      done = true; ok();
      H.peer = p; H.host = true; H.ready = true;
      H.me.id = 'host';
      H.hostName = H.me.name;
      H.members = [{ id: 'host', name: H.me.name, face: H.me.face,
        card: H.me.card, table: null, where: H.me.where, host: true }];
      seenIds = ['host'];        // подняли комнату: мы в ней одни, дальше всякий новый — со звуком
      p.on('connection', onGuest);
      line('sys', 'Комната поднята. Пока главный тут — вы.');
      fire();
    });
    p.on('error', function () {
      if (done || my !== gen || !H.on) return;
      done = true;
      try { p.destroy(); } catch (e) { }
      guest(my);
    });
    setTimeout(function () {
      if (done || my !== gen || !H.on) return;
      done = true;
      try { p.destroy(); } catch (e) { }
      guest(my);
    }, CLAIM_WAIT);
  }

  function guest(my) {
    if (!H.on || my !== gen) return;
    var p, done = false;
    try { p = Net.newPeer(null); } catch (e) { H.err = 'нет связи'; fire(); return; }
    H.peer = p; H.host = false;
    p.on('open', function () {
      if (my !== gen) { try { p.destroy(); } catch (e) { } return; }
      var c = p.connect(hallId(), { reliable: true });
      H.hostConn = c;
      c.on('open', function () {
        if (my !== gen) return;
        H.lastHost = now();
        done = true; ok(); H.ready = true;
        Net.send(c, { t: 'hi', name: H.me.name, face: H.me.face, card: H.me.card, w: H.me.where });
        fire();
      });
      c.on('data', function (m) { H.lastHost = now(); if (my === gen) onHostMsg(m); });
      c.on('close', function () { if (my === gen) lostHost(); });
      c.on('error', function () { if (!done && my === gen) retry(); });
    });
    p.on('error', function () { if (!done && my === gen) retry(); });
    setTimeout(function () { if (!done && H.on && my === gen) retry(); }, CLAIM_WAIT);
  }

  /* Главный ушёл — ждём вразнобой и пробуем занять его место.

     Тут была дыра, которую видно только на сломанной связи. Если брокер
     недостижим вообще — корпоративный вайфай режет вебсокет, провайдер
     не пускает, брокер лежит, — то `claim` падает в `guest`, `guest`
     падает в `retry`, `retry` зовёт `claim`, и так ВЕЧНО: раз в
     полсекунды, без остановки, без единого слова человеку. На живой
     сборке значок «подключаемся…» так и висел через пятьдесят секунд,
     хотя вебсокет к брокеру отвалился ещё на первой.

     Самое обидное, что экран ошибки уже написан: «комната недоступна» и
     кнопка «Ещё раз» в `hallHead`. До него просто нельзя было дойти.

     Поэтому круги считаем. Несколько попыток — это нормально: главный
     мог выйти, адрес освобождается не мгновенно, и тут суета уместна.
     Но после GIVE_UP кругов подряд ясно, что дело не в соседе по
     комнате, и надо сказать это вслух. Пауза между кругами растёт: с
     каждым разом шанс, что поможет немедленный повтор, ниже. */
  var fails = 0;
  var GIVE_UP = 5;
  var HEAL = 45000;          // через сколько пробуем тихо, уже сдавшись

  function retry() {
    if (!H.on) return;
    gen++;                                    // всё, что было до этого, больше не наше
    H.ready = false; H.host = false; H.hostConn = null; H.members = [];
    try { if (H.peer) H.peer.destroy(); } catch (e) { }
    H.peer = null;
    if (++fails > GIVE_UP) {
      /* Сдаёмся видимо, а не молча: человек видит «комната недоступна» и
         кнопку «Ещё раз» — она зовёт `enter` заново и обнуляет счёт.

         Но сдаёмся не навсегда. Ник: «если сетевая игра крашнулась,
         комната недоступна» — и так до перезагрузки страницы, потому
         что после этой ветки к брокеру больше никто не стучался.
         Связь же обычно возвращается сама через минуту. Поэтому раз в
         три четверти минуты пробуем тихо: получилось — комната оживает
         молча, не получилось — человек и не заметил, что мы пробовали. */
      H.err = 'нет связи с комнатой';
      H.on = false;
      fire();
      var my = gen;
      setTimeout(function () {
        /* Ушли за стол или нажали «Ещё раз» — чинить нечего. */
        if (my !== gen || H.on) return;
        H.on = true; fails = 0; fire();
        claim();
      }, HEAL);
      return;
    }
    fire();
    setTimeout(claim, Math.min(8000, 400 * fails) + Math.floor(Math.random() * 900));
  }

  /* Круг удался — счёт неудач обнуляем, иначе редкие обрывы за вечер
     сложатся и однажды выключат комнату на ровном месте. */
  function ok() { fails = 0; }

  function lostHost() {
    if (!H.on || H.host) return;
    line('sys', 'Главный вышел из комнаты, ищем нового…');
    retry();
  }

  function leave() {
    H.on = false; H.ready = false; H.host = false; gen++;
    if (H.hostConn) { try { Net.send(H.hostConn, { t: 'bye' }); } catch (e) { } }
    try { if (H.peer) H.peer.destroy(); } catch (e) { }
    H.peer = null; H.hostConn = null; H.conns = []; H.members = []; H.msgs = [];
    fire();
  }

  /* ---------- главный ---------- */

  function onGuest(conn) {
    conn._seen = now();
    H.conns.push(conn);
    conn.on('data', function (m) { conn._seen = now(); fromGuest(conn, m); });
    conn.on('close', function () { dropGuest(conn); });
    conn.on('error', function () { dropGuest(conn); });
  }

  function dropGuest(conn) {
    var i = H.conns.indexOf(conn);
    if (i >= 0) H.conns.splice(i, 1);
    var m = memberOf(conn);
    if (m) {
      H.members = H.members.filter(function (x) { return x.id !== m.id; });
      line('sys', m.name + ' вышел из комнаты.');
      pushList();
    }
  }

  function memberOf(conn) {
    for (var i = 0; i < H.members.length; i++) if (H.members[i].conn === conn) return H.members[i];
    return null;
  }

  function fromGuest(conn, m) {
    if (!m || !m.t) return;
    if (m.t === 'hi') {
      var was = memberOf(conn);
      if (was) {                                 // это не новый игрок, а тот же сменил имя
        was.name = String(m.name || was.name).slice(0, 14);
        if (typeof m.face === 'number' && m.face >= 0) was.face = m.face;
        if (m.card) was.card = m.card;
        pushList();
        return;
      }
      var id = 'p' + (++seq);
      var mem = { id: id, name: String(m.name || 'Игрок').slice(0, 14),
        face: (typeof m.face === 'number' ? m.face : -1), card: m.card || null,
        table: null, where: (m.w === 'table' || m.w === 'bots') ? m.w : 'room',
        conn: conn };
      H.members.push(mem);
      Net.send(conn, { t: 'you', id: id });
      line('sys', mem.name + ' вошёл в комнату.');
      pushList();
      return;
    }
    var who = memberOf(conn);
    if (!who) return;
    if (m.t === 'msg') return broadcastMsg(who.name, String(m.text || '').slice(0, 200), who.id);
    if (m.t === 'table') {
      who.table = m.code ? { code: String(m.code).slice(0, 6), N: m.N || 3 } : null;
      if (who.table) tableLine(who.name, who.table.code, who.table.N, who.id);
      else line('sys', who.name + ' закрыл стол.');
      pushList();
      return;
    }
    if (m.t === 'note') {                       // «сели играть» — разносим от имени комнаты
      var tx = String(m.text || '').slice(0, 120);
      if (tx) { line('sys', tx); toAll({ t: 'sys', text: tx }); }
      return;
    }
    /* Раньше тут был `gone`: сел играть — и мы вычёркивали человека из
       комнаты совсем. Ник: «можешь показывать тех, кто онлайн, но условно
       в игре?» Может, и это честнее: человек никуда не делся, он просто
       занят. Теперь вместо вычёркивания — пометка, где он. */
    if (m.t === 'where') {
      var w = (m.w === 'table' || m.w === 'bots') ? m.w : 'room';
      if (who.where !== w) { who.where = w; whereLine(who.name, w, who.id); }
      pushList();
      return;
    }
    if (m.t === 'bye') return dropGuest(conn);
  }
  var seq = 0;

  function pubList() {
    return H.members.map(function (m) {
      return { id: m.id, name: m.name, face: m.face, card: m.card || null,
        table: m.table, where: m.where || 'room', host: !!m.host };
    });
  }
  function pushList() {
    // соединение могло тихо отвалиться — такие места в списке не держим
    H.members = H.members.filter(function (m) { return m.host || (m.conn && m.conn.open !== false); });
    H.conns = H.conns.filter(function (c) { return c && c.open !== false; });
    var l = pubList();
    H.conns.forEach(function (c) { Net.send(c, { t: 'list', members: l, hostName: H.me.name }); });
    noteMembers();
    fire();
  }
  function toAll(msg) {
    H.conns.forEach(function (c) { Net.send(c, msg); });
  }
  // id отправителя едет вместе с репликой: по имени «свой-чужой» не отличить,
  // двое могут назваться одинаково
  function broadcastMsg(from, text, sid) {
    if (!text) return;
    line('msg', text, from);
    if (sid !== H.me.id) snd('msg');
    toAll({ t: 'msg', from: from, text: text, sid: sid });
  }
  function tableLine(name, code, N, sid) {
    line('table', name + ' создал стол' + (N ? ' на ' + N : ''), name, code, N);
    if (sid !== H.me.id) snd('table');
    toAll({ t: 'table', from: name, code: code, N: N, sid: sid });
  }

  /* Короткая строка в разговор: человек сел играть или вернулся. Это не
     болтовня, а повод не гадать, куда он делся посреди разговора. */
  function whereLine(name, w, sid) {
    var t = w === 'table' ? name + ' сел за стол.'
      : w === 'bots' ? name + ' сел играть с ботами.'
        : name + ' вернулся в комнату.';
    line('sys', t);
    toAll({ t: 'sys', text: t });
    if (sid !== H.me.id && w === 'table') snd('table');
  }

  /* Сколько людей где. Ровно то, что Ник просил показывать: сколько в
     комнате, сколько за сетевым столом, сколько играет с ботами. */
  function counts() {
    var c = { all: 0, room: 0, table: 0, bots: 0 };
    for (var i = 0; i < H.members.length; i++) {
      var w = H.members[i].where || 'room';
      c.all++;
      c[w === 'table' ? 'table' : (w === 'bots' ? 'bots' : 'room')]++;
    }
    return c;
  }

  /* ---------- гость ---------- */

  function onHostMsg(m) {
    if (!m || !m.t) return;
    if (m.t === 'you') { H.me.id = m.id; return; }
    if (m.t === 'list') {
      H.members = m.members || [];
      noteMembers();
      if (m.hostName && m.hostName !== H.hostName) {
        var first = !H.hostName;
        H.hostName = m.hostName;
        if (!first) line('sys', 'Теперь главный в комнате — ' + m.hostName + '.');
      }
      fire(); return;
    }
    if (m.t === 'msg') {
      if (m.sid !== H.me.id) snd('msg');
      return line('msg', m.text, m.from);
    }
    if (m.t === 'sys') return line('sys', m.text);
    if (m.t === 'table') {
      if (m.sid !== H.me.id) snd('table');
      return line('table', m.from + ' создал стол' + (m.N ? ' на ' + m.N : ''), m.from, m.code, m.N);
    }
  }

  /* ---------- что делает игрок ---------- */

  function say(text) {
    text = String(text || '').trim().slice(0, 200);
    if (!text || !H.ready) return;
    if (H.host) broadcastMsg(H.me.name, text, H.me.id);
    else Net.send(H.hostConn, { t: 'msg', text: text });
  }

  // объявить, что я поднял стол (или закрыл его)
  function table(code, N) {
    if (!H.ready) return;
    H.me.table = code ? { code: code, N: N } : null;
    if (H.host) {
      var m = H.members.filter(function (x) { return x.id === 'host'; })[0];
      if (m) m.table = H.me.table;
      if (code) tableLine(H.me.name, code, N, H.me.id);
      else line('sys', 'Вы закрыли стол.');
      pushList();
    } else Net.send(H.hostConn, { t: 'table', code: code || null, N: N || 0 });
  }

  /* ---------- где человек сейчас ----------

     Ник: «можешь показывать тех, кто онлайн, но условно в игре? В сетевой
     или просто с ботами?»

     Раньше на этом месте стоял выход из комнаты: сел играть — и тебя в
     ней больше нет. Поэтому комната всегда показывала «Люди 1», даже
     когда за тремя столами шла игра: все играющие из неё вычёркивались.

     Так сделано в «Колдовстве», и оттуда же взята цена: связь с комнатой
     во время партии НЕ рвём, только меняем отметку. Это второе
     соединение рядом с игровым — лёгкое (раз в двадцать секунд), но
     помнить о нём надо, и звуки комнаты за столом обязаны молчать. */
  function where(w) {
    w = (w === 'table' || w === 'bots') ? w : 'room';
    if (H.me.where === w) return;
    H.me.where = w;
    if (!H.on || !H.ready) return;
    if (H.host) {
      var m = null, i;
      for (i = 0; i < H.members.length; i++) if (H.members[i].id === 'host') m = H.members[i];
      if (m) m.where = w;
      whereLine(H.me.name, w, H.me.id);
      pushList();
    } else Net.send(H.hostConn, { t: 'where', w: w });
  }

  // сменил имя или портрет — заново представиться
  function updateMe(name, face, card) {
    if (name) H.me.name = String(name).slice(0, 14);
    if (typeof face === 'number' && face >= 0) H.me.face = face;
    if (card) H.me.card = card;
    if (!H.ready) return;
    if (H.host) {
      H.hostName = H.me.name;
      var m = H.members.filter(function (x) { return x.id === 'host'; })[0];
      if (m) { m.name = H.me.name; m.face = H.me.face; m.card = H.me.card; }
      pushList();
    } else Net.send(H.hostConn, { t: 'hi', name: H.me.name, face: H.me.face, card: H.me.card });
  }

  /* Объявить на всю комнату, что стол сел играть. Говорит хозяин стола
     перед тем, как выйти: иначе комната видит только «такой-то вышел»
     и не понимает, партия началась или человек закрыл вкладку. */
  function announce(text) {
    text = String(text || '').trim().slice(0, 120);
    if (!text || !H.ready) return;
    if (H.host) { line('sys', text); toAll({ t: 'sys', text: text }); }
    else Net.send(H.hostConn, { t: 'note', text: text });
  }

  /* ---------- пульс комнаты ----------

     Пока играющие вычёркивались, список жил сам собой: вышел — убрали.
     Теперь люди остаются в нём часами, и молчаливый обрыв (а он молчит
     всегда — см. платформа/01-СЕТЬ-СТОЛА) оставил бы в комнате призраков:
     «5 в сети», а их двое. Поэтому главный считает, когда в последний раз
     слышал каждого, а гость — когда в последний раз слышал главного. */
  var DEAD = 70000;          // три пропущенных круга — значит человека нет

  setInterval(function () {
    if (!H.on || !H.ready) return;
    if (H.host) {
      var t = now(), i, c;
      for (i = H.conns.length - 1; i >= 0; i--) {
        c = H.conns[i];
        if (c && t - (c._seen || t) > DEAD) { try { c.close(); } catch (e) { } dropGuest(c); }
      }
      pushList();
      return;
    }
    Net.send(H.hostConn, { t: 'ping' });
    if (H.lastHost && now() - H.lastHost > DEAD) lostHost();
  }, PING);

  return {
    S: H, enter: enter, leave: leave, say: say, table: table,
    sound: function (f) { H.onSound = f; },
    where: where, counts: counts, updateMe: updateMe, announce: announce,
    list: function () { return H.members.slice(); },
    log: function () { return H.msgs.slice(); }
  };
})();

/* ============================================================
   ОДЕССКИЙ ПРЕФЕРАНС — стол, анимация, ввод

   Отличия от клаборного стола, ради которых это отдельный файл:

     торговля идёт лестницей, а не одним словом «беру»;
     посреди стола лежит прикуп, и его открывают;
     выторговавший сносит две карты из двенадцати;
     защита отдельно говорит «вистую» или «пас»;
     счёт пишется в три колонки — пуля, гора, висты.

   Всё остальное — места, карты, полёты, пузыри с репликами, журнал,
   чат — то же самое, что за клаборным столом: платформа общая.
   ============================================================ */
var UI = (function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
  var g = null, brains = [], ME = 0, evIdx = 0, busy = false, gen = 0;
  /* Сколько взятка лежит на столе, прежде чем её сгребут. Ник просил
     полторы секунды: «после сыгранной последней карты просто взятка
     испаряется». Меньше — и игрок не успевает увидеть, чем её взяли. */
  var TRICK_HOLD = 1500;
  var TRICK_FLY = 460;        // сколько карты летят к тому, кто взял
  var speed = 1, pumping = false, needReady = false, dealing = false;
  var selected = null, bubbles = {}, handTimer = null, paused = false;
  var pausedUI = false, netHold = false;

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function wait(ms, cb) { var my = gen; setTimeout(function () { if (my === gen) cb(); }, ms / speed); }
  function esc(t) {
    return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* ---------- места ----------
     Мест за преферансным столом три или четыре, а слотов на экране
     всегда три: своё место внизу, остальные слева, сверху и справа.
     Вчетвером сдающий отдыхает, но со стола не исчезает — его видно
     и понятно, почему он молчит. */
  var SEATIDS = ['seatL', 'seatT', 'seatR'];
  function others() {
    var l = [], i, n = g.N;
    for (i = 1; i < n; i++) l.push((ME + i) % n);
    return l;
  }
  function seatEl(p) {
    var l = others(), i = l.indexOf(p);
    if (i < 0) return null;
    // трое: слева и справа. Четверо: слева, сверху, справа.
    var map = (l.length === 2) ? ['seatL', 'seatR'] : SEATIDS;
    return $('#' + map[i]);
  }
  function faceOf(p) { return (g.faces && g.faces[p] != null) ? g.faces[p] : -1; }
  function letterOf(p) { return (g.names[p] || '?').charAt(0).toUpperCase(); }

  function badge(full, short) {
    return '<span class="badge" title="' + esc(full) + '">' + esc(short) + '</span>';
  }

  /* Чья рука кладёт карту. Обычно того, кого спросили; в светлую
     спрашивают вистующего, а карта — из открытой руки. */
  function handSeat() {
    if (!g.pending) return ME;
    return (g.pending.hand != null) ? g.pending.hand : g.pending.p;
  }
  function isOpen(p) { return !!(g && g.light && g.open && g.open.indexOf(p) >= 0); }

  /* Что игрок ОБЪЯВИЛ — строкой под именем. Ник: «можно сделать кто что
     объявлял под именем». Раньше это жило только в шапке стола и в
     правой панели: смотришь на человека и не помнишь, что он сказал.
     Тут же — его последнее слово в торговле, а у играющего окончательная
     игра, и следом вист, когда дойдёт до виста. */
  function saidOf(p) {
    if (!hb) return '';
    if (g.pass) return 'распасы';
    if (hb.contract != null && p === hb.declarer)
      return bidHTML(hb.contract) + (hb.dark ? ' втёмную' : hb.noWidow ? ' с руки' : '');

    /* Сказал вист — показываем ВИСТ, а не то, что человек пасовал в
       торговле. Иначе выходит «пас · вистует», и это читается как
       противоречие: Ник так и прочёл — «я вистую, он пасует», хотя
       вистовали оба, а «пас» был про заявку. На месте игрока нужно
       текущее состояние, а весь ход торговли и так лежит в панели. */
    var w = g.whist && g.whist[p];
    if (w) {
      var t = (w === 'W' ? 'вистует' : w === 'H' ? 'полвиста' : 'пас');
      /* В светлую рука лежит на столе — и надо сразу видеть, СВОЕЙ ли
         рукой человек ходит. При вист-пас за пасовавшего кладёт карты
         вистующий, при двух вистующих каждый ходит сам. */
      /* «за него ходит X» на плашку не влезает даже на десктопе —
         замерено `t_said.js`. Кто ведёт обе руки, полностью сказано в
         ведомости справа; на месте игрока хватает «ходит X». */
      if (g.light && g.open && g.open.indexOf(p) >= 0) {
        t += (g.lightBy >= 0 && g.lightBy !== p)
          ? ' · ходит ' + who(g.lightBy)
          : ' · в светлую';
      }
      return t;
      /* Короткий вид для телефона отдаётся отдельно: см. saidShort. */
    }
    var last = null;
    for (var i = 0; i < hb.bids.length; i++) if (hb.bids[i].p === p) last = hb.bids[i];
    if (!last) return '';
    return last.bid == null ? 'пас' : bidHTML(last.bid) +
      (last.dark ? ' втёмную' : last.noWidow ? ' с руки' : '');
  }
  /* То же самое одним словом — для узкого экрана.

     На телефоне место игрока ужимается до трети ширины, и полная
     надпись «вистует · в светлую» превращалась многоточием в «в..».
     Обрезать тут нельзя ничего: вист это или пас — ровно то, ради чего
     на плашку и смотрят. Поэтому на узком экране не РЕЖЕМ длинную
     надпись, а подставляем короткую — тем же приёмом, каким сделаны
     метки: полный текст в узле, короткий в data-s, выбор за стилем. */
  function saidShort(p) {
    if (!hb) return '';
    if (g.pass) return 'распасы';
    if (hb.contract != null && p === hb.declarer) return K.bidShort(hb.contract);
    var w = g.whist && g.whist[p];
    if (w) {
      /* На телефоне — только само слово. Что рука открыта и кто ею
         ведёт, видно и так: карты лежат на столе, а подробность стоит
         в ведомости на вкладке «Пуля». */
      return (w === 'W' ? 'вист' : w === 'H' ? 'полвиста' : 'пас');
    }
    var last = null;
    for (var i = 0; i < hb.bids.length; i++) if (hb.bids[i].p === p) last = hb.bids[i];
    if (!last) return '';
    return last.bid == null ? 'пас' : K.bidShort(last.bid);
  }

  /* Узкий экран — короткое слово. Выбор делаем ТУТ, а не стилем:
     спрятать длинную надпись нечем — она всё равно упрётся в край и
     обрежется, только уже без многоточия. Перерисовка на смену размера
     окна уже есть (`resize` → `drawAll`), так что при повороте телефона
     надпись меняется сама. */
  function narrow() {
    try { return window.matchMedia('(max-width:900px)').matches; } catch (e) { return false; }
  }
  function saidFor(p) { return narrow() ? saidShort(p) : saidOf(p); }

  function nameBox(p) {
    var sd = saidFor(p);
    return '<span class="whobox"><span class="nm">' + esc(g.names[p]) + '</span>' +
      (sd ? '<span class="said">' + sd + '</span>' : '') + '</span>';
  }

  function drawSeats() {
    ['seatL', 'seatT', 'seatR'].forEach(function (id) {
      var e = document.getElementById(id);
      if (e) { e.style.display = 'none'; e.innerHTML = ''; }
    });
    others().forEach(function (p) {
      var s = seatEl(p);
      if (!s) return;
      s.style.display = '';
      var b = '';
      if (p === g.dealer) b += badge('сдаёт', 'сд.');
      if (p === g.declarer) b += badge('играет ' + K.bidWord(g.contract), 'игр.');
      if (g.whist && (g.whist[p] === 'W' || g.whist[p] === 'H'))
        b += badge(g.whist[p] === 'H' ? 'полвиста' : 'вистует', 'вист');
      if (g.N === 4 && g.seats && g.seats.indexOf(p) < 0) b += badge('отдыхает', '—');

      /* Веер рубашек. Не украшение: по нему видно, сколько у соперника
         карт, и стол перестаёт быть пустым. Именно этого не хватало. */
      var fan = '', n = (dealing || !g.hands) ? 0 : (g.hands[p] || []).length, i;
      for (i = 0; i < n; i++) fan += '<i></i>';

      /* Светлая: рука пасовавшего лежит на столе лицом вверх. Рубашки
         тут были бы враньём — её видят все, и по ней играют. */
      if (isOpen(p) && !dealing) {
        b += badge('на столе', 'стол');
        var mineNow = g.pending && g.pending.type === 'play' && g.pending.p === ME &&
          handSeat() === p;
        var lg = mineNow ? g.legal(p).map(K.id) : null;
        /* Раскладываем по мастям и вдоль своего края — как кладут
           открытую руку за живым столом и как это рисовали в старых
           преферансах: каждая масть отдельной стопкой, стопки одна под
           другой, у левого игрока веер раскрывается вправо, у правого
           влево. Кучей в один ряд десять карт не прочитать. */
        var side = (s.id === 'seatL') ? ' left' : (s.id === 'seatR') ? ' right' : ' top';
        var oc = '';
        K.SUITS.forEach(function (su) {
          var l = (g.hands[p] || []).filter(function (c) { return c && c.s === su; });
          if (!l.length) return;
          l.sort(function (a2, b2) { return K.ord(b2) - K.ord(a2); });
          oc += '<div class="osuit">';
          l.forEach(function (c) {
            var cl = 'card';
            if (lg) cl += (lg.indexOf(K.id(c)) >= 0) ? ' playable' : ' dead';
            oc += '<div class="' + cl + '" data-id="' + K.id(c) + '">' + ART.faceHTML(c) + '</div>';
          });
          oc += '</div>';
        });
        fan = null;
        s.innerHTML = '<div class="pl" data-prof="' + p + '">' +
          ART.ava(faceOf(p), letterOf(p), 'md') +
          nameBox(p) + b +
          '<span class="sc">' + (g.taken ? g.taken[p] : 0) + '</span>' +
          '</div><div class="ohand' + side + (mineNow ? ' my' : '') + '">' + oc + '</div>' +
          '<div class="bubble" data-bub="' + p + '"></div>';
        s.classList.toggle('act', !!(g.pending && handSeat() === p));
        return;
      }

      s.innerHTML = '<div class="pl" data-prof="' + p + '">' +
        ART.ava(faceOf(p), letterOf(p), 'md') +
        nameBox(p) + b +
        '<span class="sc">' + (g.taken ? g.taken[p] : 0) + '</span>' +
        '</div><div class="fan">' + fan + '</div>' +
        '<div class="bubble" data-bub="' + p + '"></div>';
      s.classList.toggle('act', !!(g.pending && handSeat() === p));
    });

    // своё место — портрет, взятки и метки
    var me = $('#seatMe');
    if (me) {
      var mb = '';
      if (ME === g.dealer) mb += badge('сдаёте', 'сд.');
      if (ME === g.declarer) mb += badge('играете ' + K.bidWord(g.contract), 'игр.');
      if (g.whist && (g.whist[ME] === 'W' || g.whist[ME] === 'H')) mb += badge('вистуете', 'вист');
      me.innerHTML = '<span data-prof="' + ME + '">' + ART.ava(faceOf(ME), letterOf(ME), 'md') + '</span>' +
        nameBox(ME) + mb +
        '<span class="sc">' + (g.taken ? g.taken[ME] : 0) + '</span>';
      me.classList.toggle('act', !!(g.pending && handSeat() === ME));
    }
    drawMyBubble();
  }

  /* ---------- пузыри с репликами ---------- */
  function bubble(p, txt, cls, ms) {
    if (!txt) return;
    var host = (p === ME) ? $('#bubMe') : $('[data-bub="' + p + '"]');
    if (!host) return;
    host.textContent = txt;
    host.className = 'bubble talk on' + (cls ? ' ' + cls : '');
    bubbles[p] = txt;
    var my = ++bubbles['g' + p];
    setTimeout(function () {
      if (bubbles['g' + p] !== my) return;
      host.classList.remove('on'); bubbles[p] = null;
    }, ms || 3200);
  }
  function drawMyBubble() {
    var b = $('#bubMe');
    if (b && !bubbles[ME]) b.classList.remove('on');
  }

  /* ---------- одесский базар ---------- */
  function charOfSeat(p) {
    /* Свой характер игрок выбирает сам — это его голос за столом, а не
       приложение к портрету. 'auto' оставляет как у ботов: по портрету. */
    if (p === ME && window.Boot && Boot.CFG && Boot.CFG.myChar &&
        Boot.CFG.myChar !== 'auto' && Boot.CFG.myChar !== 'off')
      return Boot.CFG.myChar;
    var f = faceOf(p);
    if (f >= 0 && ART.FACE_CH && ART.FACE_CH[f]) return ART.FACE_CH[f];
    return 'b';
  }
  function sexOfSeat(p) {
    var f = faceOf(p);
    if (f >= 0 && ART.FACE_SEX && ART.FACE_SEX[f]) return ART.FACE_SEX[f];
    return 'm';
  }
  /* Реплики — это трёп, и «Тишина» их гасит. Но команды за столом
     («шесть пик», «вистую», «пас») трёпом не считаются: они часть игры
     и звучат всегда. Это разные вещи, и путать их нельзя — в клаборе
     на этом уже обжигались. */
  function netOn() { return !!(window.Net && Net.S && Net.S.on); }
  function netHost() { return netOn() && !!Net.S.host; }

  function talk(p, key, ctx, force) {
    if (!window.Talk) return;
    /* За сетевым столом реплику сочиняет ХОЗЯИН и рассылает готовой.
       Раньше её бросал каждый браузер сам — и за одним столом люди
       видели разные фразы, а гость чаще не видел ничего. Ник: «в
       сетевой игре чат комменты не синхронизированы; игрок говорит — и
       в сетевой игре все его видят». Гость своих не сочиняет. */
    if (netOn() && !netHost()) return;
    if (!force && window.Boot && Boot.CFG && !Boot.CFG.talk) return;
    /* «Молчу» — это про себя, а не про стол: соперники продолжают
       трепаться, замолкает только своя рука. */
    if (p === ME && window.Boot && Boot.CFG && Boot.CFG.myChar === 'off') return;
    ctx = ctx || {};
    ctx.seat = p; ctx.mine = (p === ME);
    ctx.sex = sexOfSeat(p);
    ctx.lvl = (window.Boot && Boot.CFG) ? Boot.CFG.level : 2;
    var s = Talk.say(charOfSeat(p), key, ctx, force);
    if (!s) return;
    if (netHost()) Net.bub(p, s, force);
    bubble(p, s);
  }

  /* Реплика, присланная хозяином. Свои настройки гость всё равно
     уважает: выключил базар — пузырей нет; выключил свой характер —
     нет пузыря над своей рукой. Объявления (force) звучат всегда:
     это не трёп, а слово за столом. */
  function bubbleIn(p, txt, force) {
    if (!txt || !g) return;
    if (!force && window.Boot && Boot.CFG && !Boot.CFG.talk) return;
    if (p === ME && window.Boot && Boot.CFG && Boot.CFG.myChar === 'off') return;
    bubble(p, txt);
  }

  /* Кому травить байку. Треплются БОТЫ — свою руку за язык не тянем,
     и того, о ком сейчас речь, тоже пропускаем: смешнее, когда шутит
     сосед, а не пострадавший. */
  function anyBot(except) {
    if (!g) return -1;
    var l = [];
    for (var p = 0; p < g.N; p++) {
      if (p === ME || p === except) continue;
      /* За сетевым столом слово принадлежит живому человеку: вкладывать
         ему в рот анекдот нельзя. Треплются только боты — у них нет
         присланной карточки. За своим столом карточек нет ни у кого,
         значит боты все, и правило само себя выключает. */
      if (g.stats && g.stats[p]) continue;
      l.push(p);
    }
    return l.length ? l[Math.floor(Math.random() * l.length)] : -1;
  }
  /* Ник: «реплик мало, боты очень мало трещат, не травят анекдоты как
     в клаборе». Мешки `anekdot`, `idle`, `slow` и `greet` были написаны
     и ни разу не вызывались — стол молчал не от скромности, а от того,
     что его никто не спрашивал. Вот эти четыре вызова. */
  /* force — байка звучит наверняка, мимо общего «не тараторить». Так
     сделано в клаборе на конце сдачи: карты собраны, пауза длинная, и
     проглатывать тут реплику незачем. Между взятками паузы короткие —
     там байка идёт на общих правах и может не прозвучать. */
  function joke(except, delay, pAnek, force) {
    var who = anyBot(except);
    if (who < 0) return;
    wait(delay || 1500, function () {
      talk(who, Math.random() < (pAnek == null ? 0.55 : pAnek) ? 'anekdot' : 'idle',
        { joke: true }, force);
    });
  }

  /* ---------- журнал ---------- */
  function log(t, k) {
    var pane = $('#logpane');
    if (!pane) return;
    var d = el('div', 'lrow' + (k ? ' ' + k : ''), esc(t));
    pane.appendChild(d);
    pane.scrollTop = pane.scrollHeight;
  }

  /* ---------- центр стола ----------
     Раскладка ровно клаборная: коробка взятки сама подгоняется под
     размер карты и состав стола, своё место снизу, остальные по кругу.
     Отличий от клабора тут быть не должно — стол один и тот же, игра
     разная. */
  function sizeTrick() {
    var t = $('#trick'), tb = $('#table');
    var cw = cardW(), ch = cw * 1.49;
    var wide = (g.N === 4) ? 3.15 : 3.05;
    var tall = 2.15;
    var W = Math.min(tb.clientWidth * 0.94, cw * wide);
    var H = Math.min(tb.clientHeight * 0.52, ch * tall);
    t.style.width = Math.round(W) + 'px';
    t.style.height = Math.round(H) + 'px';
    return [W, H];
  }

  function slotPos(p) {
    var off = (p - ME + g.N) % g.N;
    var sz = sizeTrick(), W = sz[0], H = sz[1];
    var cw = cardW(), ch = cw * 512 / 344;
    var cx = W / 2 - cw / 2, cy = H / 2 - ch / 2;
    if (off === 0) return [cx, H - ch];
    if (g.N === 3) return off === 1 ? [0, 0] : [W - cw, 0];
    if (off === 1) return [0, cy];
    if (off === 2) return [cx, 0];
    return [W - cw, cy];
  }

  /* Карты на столе. Обычно это `g.cur` — текущая незаконченная взятка.

     Но в момент, когда взятка ЗАКРЫЛАСЬ, движок уже переложил её в
     `tricks` и очистил `cur`, а стол в это время только доигрывает полёт
     последней карты. Рисовать тут `cur` — значит стереть третью карту,
     не показав её: получалось, что последняя карта до стола вообще не
     доходила, а пауза в полторы секунды держала ПУСТОЙ стол.

     Ник: «после сыгранной последней карты просто взятка испаряется».
     Поэтому пока взятка показывается, стол рисует её из `shown`. */
  var shown = null;
  function drawTrick() {
    var t = $('#trick');
    if (!t) return;
    t.innerHTML = '';
    (shown || g.cur || []).forEach(function (pl) {
      var pos = slotPos(pl.p);
      var c = el('div', 'card');
      c.innerHTML = ART.faceHTML(pl.c);
      c.style.cssText = 'position:absolute;left:' + pos[0] + 'px;top:' + pos[1] +
        'px;width:' + cardW() + 'px';
      t.appendChild(c);
    });
  }

  /* ---------- полёты ----------
     Карта не появляется на столе, а долетает до него: глаз должен
     успеть заметить, кто её положил. То же и на сдаче — карты
     разлетаются от колоды по рукам, по две по кругу, начиная слева от
     сдающего, как за настоящим столом. */
  function rectOf(e) {
    var r = e.getBoundingClientRect();
    return { x: r.left, y: r.top, w: r.width, h: r.height };
  }
  function deckPoint() {
    var dz = $('#deckzone');
    var r = dz ? dz.getBoundingClientRect() : null;
    if (r && r.width > 4) return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    var t = $('#table').getBoundingClientRect();
    return { x: t.left + t.width / 2, y: t.top + t.height * 0.42 };
  }
  function seatPoint(p) {
    if (p === ME) {
      var h = $('#handwrap').getBoundingClientRect();
      return { x: h.left + h.width / 2, y: h.bottom - 60 };
    }
    var s = seatEl(p);
    if (!s) return deckPoint();
    var r = s.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height * 0.75 };
  }
  function flyBack(from, p, w) {
    var to = seatPoint(p), h = w * 512 / 344;
    var f = el('div', 'card back');
    f.style.cssText = 'left:' + (from.x - w / 2) + 'px;top:' + (from.y - h / 2) + 'px;' +
      'width:' + w + 'px;height:' + h + 'px;transform:none';
    $('#fly').appendChild(f);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        f.style.transform = 'translate(' + (to.x - from.x) + 'px,' + (to.y - from.y) + 'px)' +
          ' rotate(' + (Math.random() * 24 - 12) + 'deg)';
      });
    });
    wait(360, function () { f.remove(); });
  }
  /* Сдаём по две, по кругу, и в конце две карты уходят в прикуп —
     в преферансе это видно за столом, значит должно быть видно и тут. */
  function dealAnim(done) {
    var from = deckPoint(), w = Math.round(cardW() * 0.5);
    var step = 42, k = 0, i, r;
    var seats = g.seats || [];
    for (r = 0; r < 5; r++)
      for (i = 0; i < seats.length; i++) {
        (function (pp, d) { wait(d, function () { flyBack(from, pp, w); }); })(seats[i], (k++) * step);
      }
    wait(k * step + 380, done);
  }
  function flyCard(card, from, p, done) {
    var t = $('#trick').getBoundingClientRect();
    var pos = slotPos(p), cw = cardW();
    var to = { x: t.left + pos[0], y: t.top + pos[1], w: cw, h: cw * 512 / 344 };
    var f = el('div', 'card');
    f.innerHTML = ART.faceHTML(card);
    f.style.cssText = 'left:' + from.x + 'px;top:' + from.y + 'px;width:' + from.w +
      'px;height:' + from.h + 'px;transform:none';
    $('#fly').appendChild(f);
    var dx = to.x - from.x, dy = to.y - from.y, sc = to.w / from.w;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        f.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + sc +
          ') rotate(' + (Math.random() * 6 - 3) + 'deg)';
      });
    });
    wait(360, function () { f.remove(); drawTrick(); if (done) done(); });
  }
  /* Взятку не стирают — её УНОСЯТ. Карты собираются в стопку и летят к
     тому, кто взял, слегка веером и с небольшим поворотом: так видно, кто
     забрал, даже если отвернулся на секунду. Раньше они просто гасли до
     прозрачности на месте, и это читалось как «исчезли», а не «ушли к
     нему». Ник: «сделай анимацию, как они уходят к игроку как взятка —
     как летят к нему». */
  function collectTrick(w, done) {
    var t = $('#trick'), cards = $$('#trick .card');
    var s = (w === ME) ? $('#seatMe') || $('#hand') : seatEl(w);
    var tr = s ? s.getBoundingClientRect()
      : { left: innerWidth / 2, top: innerHeight - 40, width: 40, height: 20 };
    var tx = tr.left + tr.width / 2, ty = tr.top + tr.height / 2;
    cards.forEach(function (c, i) {
      var r = c.getBoundingClientRect();
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      /* Карты трогаются не разом: разница в полсотни миллисекунд
         превращает три одновременных полёта в одну собранную стопку. */
      c.style.zIndex = String(20 + i);
      c.style.transitionDelay = (i * 55) + 'ms';
      c.style.transition = 'transform ' + TRICK_FLY + 'ms cubic-bezier(.38,.02,.62,1),' +
        'opacity ' + TRICK_FLY + 'ms ease-in ' + (i * 55 + Math.round(TRICK_FLY * 0.55)) + 'ms';
      c.style.transform = 'translate(' + (tx - cx) + 'px,' + (ty - cy) + 'px)' +
        ' rotate(' + ((i - 1) * 7) + 'deg) scale(.28)';
      c.style.opacity = '.2';
    });
    /* Ждём и последнюю карту: полёт плюс её задержка на старте. */
    wait(TRICK_FLY + cards.length * 55 + 40, function () {
      shown = null;                       // дальше стол снова рисует `cur`
      t.innerHTML = ''; if (done) done();
    });
  }

  /* ---------- прикуп ----------
     Пока торгуются — две рубашки. Выторговавший видит карты, остальные
     видят, что он их взял. В распасах прикуп вскрывается всем, если
     роспись это позволяет. */
  /* Прикуп теперь лежит наверху всю сдачу, и перерисовывать его на
     каждый ход нельзя: карты пересоздаются, и каждый раз заново
     проигрывается их появление. Ник: «у тебя постоянно танцует прикуп
     после каждого хода». Поэтому держим подпись состояния и трогаем
     разметку, только когда она и правда изменилась. */
  function drawWidow() {
    var w = $('#widow');
    if (!w) return;
    function clear() {
      if (w.dataset.sig === '') return;
      w.dataset.sig = ''; w.innerHTML = ''; w.classList.remove('open');
    }
    if (!g.widow || !g.widow.length) return clear();
    if (g.phaseAfterWidow) return clear();          // прикуп забрали и ещё не вскрыли
    var open = (g.widowOpen === true) ||
      (g.pass && g.o && g.o.passWidow);
    /* У ГОСТЯ прикуп приезжает пустышками: хозяин не отдаёт чужие карты
       по сети, и в массиве лежат `null`. Подпись и рисование обязаны это
       переживать — на первой же сдаче гость валился с «Cannot read
       properties of null». */
    var sig = (open ? 'o:' : 'c:') + g.widow.map(function (c) {
      return (c && c.r) ? K.id(c) : '?';
    }).join(',');
    if (w.dataset.sig === sig) return;              // ничего не поменялось — не трогаем
    w.dataset.sig = sig;
    w.innerHTML = '';
    w.appendChild(el('div', 'wlbl', 'прикуп'));
    g.widow.forEach(function (c) {
      // рубашка — это не картинка внутри карты, а сама карта с классом:
      // так же, как в колоде на столе. Отдельного рисовальщика тут не нужно.
      var face = open && c && c.r;
      var d = el('div', face ? 'card' : 'card back');
      if (face) d.innerHTML = ART.faceHTML(c);
      w.appendChild(d);
    });
    w.classList.toggle('open', !!open);
  }

  /* ---------- табло ----------
     Что происходит прямо сейчас: чей ход, что заказано, сколько надо
     взять и сколько уже взято. Игрок не должен держать это в голове. */
  function drawInfo() {
    var i = $('#info');
    if (!i) return;
    var bits = [];
    var hd = $('#cHand');
    if (hd) hd.textContent = 'сдача ' + (g.handNo || 1);
    var cv = $('#cConv');
    if (cv && g.o && K.CONV[g.o.conv]) cv.textContent = K.CONV[g.o.conv].name.toLowerCase();

    if (g.pass) {
      bits.push('<b class="big">РАСПАСЫ</b>');
      bits.push('по ' + g.price + ' за взятку');
      if (g.passRow > 1) bits.push(g.passRow + '-й подряд');
    } else if (g.contract != null) {
      var tr = g.trump;
      bits.push('<b class="big">' + esc(K.bidWord(g.contract)) +
        (tr ? ' <span class="' + (K.SUIT_RED[tr] ? 'red' : '') + '">' + K.SUIT_CH[tr] + '</span>' : '') + '</b>');
      bits.push('играет ' + esc(g.names[g.declarer]));
      if (!K.isMiser(g.contract))
        bits.push('надо ' + g.need + ', взял ' + g.taken[g.declarer]);
      else
        bits.push('взял ' + g.taken[g.declarer] + ' — надо ноль');
    } else if (g.high != null) {
      bits.push('торг: <b>' + esc(K.bidWord(g.high)) + '</b>');
    } else if (g.sheet) {
      /* В разбойнике торговли нет — есть очередь. Писать «торговля»
         значит врать игроку про то, чего не происходит. */
      bits.push('<b class="big">РАЗБОЙНИК</b>');
      if (g.declarer >= 0) bits.push('вписывает ' + esc(g.names[g.declarer]));
    } else {
      bits.push('торговля');
    }
    if (g.sheet) {
      var lf = g.sheet[ME].filter(function (r) { return !r.done; }).length;
      bits.push('в карточке осталось ' + lf);
    }
    if (g.pending && g.pending.p != null && g.names[g.pending.p]) {
      var hs = handSeat(), tw = esc(g.names[hs]);
      if (hs !== g.pending.p) tw += ' (за него ' + esc(g.names[g.pending.p]) + ')';
      bits.push('<span class="turnw">ход: ' + tw + '</span>');
    }
    i.innerHTML = bits.join('<i class="sep">·</i>');
  }

  /* ---------- рука ---------- */
  /* Ширина карты в руке подбирается под экран, и в расчёт должны идти
     ВСЕ слагаемые ряда. Раньше считались только карты — а между мастями
     стоят зазоры, и на сносе (двенадцать карт, часто все четыре масти)
     ряд вылезал ровно на эти три зазора: по полкарты срезалось слева и
     справа. Ник: «12 карт не помещаются — немного сузить надо».

     Порядок уступок тоже не случайный: сперва ужимаем НАХЛЁСТ, и только
     когда ужимать уже некуда — саму карту. Узкая карта читается хуже
     плотного веера: у перекрытой карты остаётся видимым угол с рангом и
     мастью, а у сжатой мельчает вся картинка. */
  function suitGaps() {
    var hd = (g && g.hands && g.hands[ME]) || [], k, n = 0;
    for (k = 1; k < hd.length; k++) if (hd[k] && hd[k - 1] && hd[k].s !== hd[k - 1].s) n++;
    return n;
  }

  function cardW() {
    var n = Math.max(1, (g.hands && g.hands[ME] && g.hands[ME].length) || 10);
    var t = $('#table'), w = t.clientWidth, h = t.clientHeight;
    var narrow = w < 620;
    var gapPx = narrow ? 11 : 18;
    /* 16 — боковые поля #handwrap, дальше зазоры между мастями. */
    var avail = w - 16 - suitGaps() * gapPx;
    var over = narrow ? 0.42 : 0.60;
    var byH = (h * (narrow ? 0.30 : 0.34)) / 1.49;
    var cap = Math.min(byH, narrow ? 92 : 116);
    /* Сколько нужно ужать нахлёст, чтобы ряд влез при полноразмерной
       карте. Плотнее 0.34 видимой полосы не жмём: дальше угол с рангом
       начинает прятаться под соседкой. */
    if (n > 1) {
      var need = (avail / cap - 1) / (n - 1);
      if (need < over) over = Math.max(narrow ? 0.30 : 0.34, need);
    }
    var byW = avail / (1 + over * (n - 1));
    var v = Math.max(40, Math.round(Math.min(byW, cap)));
    document.documentElement.style.setProperty('--ov', -(1 - over).toFixed(2));
    return v;
  }

  var dropPick = [];        // что отмечено под снос
  function drawHand() {
    var h = $('#hand');
    if (!h) return;
    h.innerHTML = '';
    document.documentElement.style.setProperty('--cw', cardW() + 'px');
    if (!g.hands || dealing) return;
    /* Пока игрок не решил — смотреть или играть втёмную — его карты
       лежат рубашками. Это не украшение: посмотрел хоть одну — право
       на тёмную потеряно, и честнее не показывать их вовсе. */
    if (darkChoice()) {
      g.hands[ME].forEach(function () {
        var d = el('div', 'card back dk');
        h.appendChild(d);
      });
      return;
    }
    var legal = null;
    var myPlay = g.pending && g.pending.type === 'play' && g.pending.p === ME &&
      handSeat() === ME;
    var myDrop = g.pending && g.pending.type === 'drop' && g.pending.p === ME;
    if (myPlay) legal = g.legal(ME).map(K.id);
    var prevSuit = null;
